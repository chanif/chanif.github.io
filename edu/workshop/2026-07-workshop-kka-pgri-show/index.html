// theme per slide index: cover & penutup pakai gradient gelap, sisanya terang
const themes = slides.map((_,i)=> (i===0 || i===slides.length-1) ? 'bg-cover' : 'bg-light');

const deck = document.getElementById('deck');
slides.forEach((html,i)=>{
  const d = document.createElement('div');
  d.className = 'slide ' + themes[i];
  d.innerHTML = html;
  deck.appendChild(d);
});

const dotsWrap = document.getElementById('dots');
slides.forEach((_,i)=>{
  const dot = document.createElement('div');
  dot.className='dot';
  dot.onclick=()=>showSlide(i);
  dotsWrap.appendChild(dot);
});

let current = 0;
const total = slides.length;
const slideEls = document.querySelectorAll('.slide');
const dotEls = document.querySelectorAll('.dot');

function showSlide(i){
  if(i<0||i>=total) return;
  slideEls[current].classList.remove('active');
  current = i;
  slideEls[current].classList.add('active');
  dotEls.forEach((d,idx)=>d.classList.toggle('on', idx===current));
  document.getElementById('progress-bar').style.width = ((current+1)/total*100)+'%';
  document.getElementById('counter').textContent = (current+1)+' / '+total;
  document.getElementById('btn-prev') && (document.getElementById('btn-prev').style.opacity = current===0?'.3':'1');
  document.getElementById('btn-next') && (document.getElementById('btn-next').style.opacity = current===total-1?'.3':'1');
}
function go(dir){ showSlide(current+dir); }

showSlide(0);

// keyboard
window.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key===' ') go(1);
  if(e.key==='ArrowLeft') go(-1);
});

// swipe
let touchX=null;
document.getElementById('deck').addEventListener('touchstart', e=>{touchX=e.touches[0].clientX;});
document.getElementById('deck').addEventListener('touchend', e=>{
  if(touchX===null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if(Math.abs(dx)>50) go(dx<0?1:-1);
  touchX=null;
});
</script>
