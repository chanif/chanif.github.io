<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALGO | Belajar Seru Alin & Golang</title>
    
    <!-- Tailwind CSS & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        h1, h2, h3, h4, .font-heading { font-family: 'Quicksand', sans-serif; }
        body { font-family: 'Inter', sans-serif; }
        html { scroll-behavior: smooth; }
        
        .fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .lms-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .lms-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(99, 102, 241, 0.15);
        }

        .step-transition {
            animation: slideIn 0.3s ease-out forwards;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* High contrast overrides for dynamic lesson contents */
        .prose, .prose * {
            color: #334155 !important;
        }
        .prose h1, .prose h2, .prose h3, .prose h4, .prose strong {
            color: #4f46e5 !important;
        }
        .prose .bg-slate-900\/50, .prose .bg-slate-900 {
            background-color: #f1f5f9 !important;
            border-color: #cbd5e1 !important;
        }
        .prose .bg-indigo-900\/40, .prose .bg-indigo-900 {
            background-color: #e0e7ff !important;
            border-color: #c7d2fe !important;
        }
        .prose code, .prose .font-mono {
            background-color: #e2e8f0 !important;
            color: #0f172a !important;
            padding: 2px 4px;
            border-radius: 4px;
        }
    </style>
    <link rel="stylesheet" href="./style.css">
</head>

    <!-- Script to aggregate data (ignoring missing files for now) -->
    <script>
        const subjectsData = {
            'lomba': {
                name: 'Lomba',
                color: 'indigo',
                levels: [],
                isLomba: true
            },
            'membaca': {
                name: 'Membaca',
                color: 'pink',
                levels: []
            },
            'math': {
                name: 'Matematika',
                color: 'blue',
                levels: []
            },
            'english': {
                name: 'Bahasa Inggris',
                color: 'emerald',
                levels: []
            }
        };

        // Populate lomba levels
        if(window.lombaTK) subjectsData.lomba.levels.push(window.lombaTK);
        if(window.lombaSD) subjectsData.lomba.levels.push(window.lombaSD);
        // Populate reading levels
        for(let i=1; i<=10; i++) {
            if(window['membaca' + i]) subjectsData.membaca.levels.push(window['membaca' + i]);
        }
        // Populate math levels
        for(let i=1; i<=25; i++) {
            if(window['math' + i]) subjectsData.math.levels.push(window['math' + i]);
        }
        // Populate english levels
        for(let i=1; i<=25; i++) {
            if(window['english' + i]) subjectsData.english.levels.push(window['english' + i]);
        }
    </script>

    <!-- App Script -->
    <script>
        // ==========================================
        // 2. DATABASE / STORAGE LOGIC 
        // ==========================================
        const STORAGE_KEY = "algo_progress";

        function getUserProgress() {
            return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
        }

        function saveUserProgress(levelId, lessonId, data) {
            const progress = getUserProgress();
            progress[`${levelId}_${lessonId}`] = data;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
        }

        function clearAllProgress() {
            localStorage.removeItem(STORAGE_KEY);
        }

        // ==========================================
        // 3. UI STATE & INTERACTION LOGIC
        // ==========================================
        let activeSubject = 'membaca';
        let selectedLevelId = null;
        let activeLevelData = null;
        let activeLessonData = null;

        // Lesson Viewer Flow variables
        let steps = [];
        let currentStepIndex = 0;
        let quizQuestions = [];
        let userAnswers = {};
        let quizScore = 0;

        document.addEventListener("DOMContentLoaded", () => {
            initApp();
            setupEventListeners();
        });

        function switchSubject(subject) {
            activeSubject = subject;
            selectedLevelId = null; // Reset selected level on tab switch
            
            // Update tabs UI
            ['lomba', 'membaca', 'math', 'english'].forEach(s => {
                const tab = document.getElementById(`tab-${s}`);
                if(s === subject) {
                    tab.className = `px-4 py-2 rounded-xl text-sm font-bold transition-all whitespace-nowrap bg-white shadow-sm border border-slate-200 text-${subjectsData[s].color}-600`;
                } else {
                    tab.className = `px-4 py-2 rounded-xl text-sm font-bold transition-all whitespace-nowrap text-slate-500 hover:text-slate-700`;
                }
            });

            // Update progress bar color
            const pBar = document.getElementById('progressBar');
            pBar.className = `h-full rounded-full transition-all duration-700 bg-gradient-to-r from-${subjectsData[subject].color}-400 to-${subjectsData[subject].color}-600`;
            
            document.getElementById('subjectNameProgress').textContent = subjectsData[subject].name;
            document.getElementById("lessonSection").classList.add("hidden");

            calculateOverallProgress();
            renderLevels();
        }

        function initApp() {
            switchSubject(activeSubject);
        }

        function calculateOverallProgress() {
            const userProgress = getUserProgress();
            let totalLessons = 0;
            let completedLessons = 0;

            const levels = subjectsData[activeSubject].levels;

            levels.forEach(level => {
                if (level.isLomba && level.sessions) {
                    level.sessions.forEach(session => {
                        totalLessons++;
                        const record = userProgress[`${level.id}_${session.id}`];
                        if (record && record.completed) completedLessons++;
                    });
                } else if (level.lessons) {
                    level.lessons.forEach(lesson => {
                        totalLessons++;
                        const record = userProgress[`${level.id}_${lesson.id}`];
                        if (record && record.completed) completedLessons++;
                    });
                }
            });

            const pct = totalLessons > 0 ? Math.round((completedLessons / totalLessons) * 100) : 0;
            const label = subjectsData[activeSubject].isLomba ? 'sesi diselesaikan' : 'materi diselesaikan';
            document.getElementById("progressDetails").textContent = `${completedLessons} dari ${totalLessons} ${label}`;
            document.getElementById("progressPctVal").textContent = `${pct}%`;
            document.getElementById("progressBar").style.width = `${pct}%`;
        }

        function renderLevels() {
            const userProgress = getUserProgress();
            const grid = document.getElementById("levelGrid");
            grid.innerHTML = "";

            const levels = subjectsData[activeSubject].levels;

            levels.forEach(level => {
                let completed = 0;
                let totalItems = 0;
                if (level.isLomba && level.sessions) {
                    totalItems = level.sessions.length;
                    level.sessions.forEach(session => {
                        const record = userProgress[`${level.id}_${session.id}`];
                        if (record && record.completed) completed++;
                    });
                } else if (level.lessons) {
                    totalItems = level.lessons.length;
                    level.lessons.forEach(lesson => {
                        const record = userProgress[`${level.id}_${lesson.id}`];
                        if (record && record.completed) completed++;
                    });
                }

                const color = subjectsData[activeSubject].color;
                const isSelected = selectedLevelId === level.id;
                
                const card = document.createElement("div");
                card.className = `bg-white border rounded-3xl p-5 shadow-sm lms-card cursor-pointer flex flex-col justify-between ${isSelected ? `border-${color}-500 ring-2 ring-${color}-100` : 'border-slate-100'}`;
                card.onclick = () => selectLevel(level.id);

                card.innerHTML = `
                    <div class="space-y-3">
                        <div class="flex justify-between items-start">
                            <span class="text-4xl">${level.icon}</span>
                            <span class="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded-md bg-${color}-50 text-${color}-600 border border-${color}-100">${level.badge}</span>
                        </div>
                        <div>
                            <h3 class="font-heading font-extrabold text-base text-slate-800">${level.title}</h3>
                            <p class="text-xs text-slate-400 mt-1 leading-normal line-clamp-2">${level.description}</p>
                        </div>
                    </div>
                    <div class="mt-4 pt-3 border-t border-slate-50 flex items-center justify-between text-xs font-bold">
                        <span class="text-slate-400">Progres:</span>
                        <span class="text-${color}-600 bg-${color}-50/50 px-2 py-1 rounded-lg">${completed} / ${totalItems}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function selectLevel(levelId) {
            selectedLevelId = levelId;
            renderLevels();
            showLevelLessons(levelId);
            
            setTimeout(() => {
                document.getElementById("lessonSection").scrollIntoView({ behavior: 'smooth' });
            }, 50);
        }

        function showLevelLessons(levelId) {
            const userProgress = getUserProgress();
            const levels = subjectsData[activeSubject].levels;
            const level = levels.find(l => l.id === levelId);
            if (!level) return;

            document.getElementById("selectedLevelIcon").textContent = level.icon;
            document.getElementById("selectedLevelTitle").textContent = level.title;
            document.getElementById("selectedLevelDesc").textContent = level.description;
            
            let completed = 0;
            const list = document.getElementById("lessonList");
            list.innerHTML = "";

            // Handle Lomba sessions
            if (level.isLomba && level.sessions) {
                const color = subjectsData[activeSubject].color;
                level.sessions.forEach((session, index) => {
                    const record = userProgress[`${level.id}_${session.id}`];
                    const isCompleted = record && record.completed;
                    if (isCompleted) completed++;
                    let scoreLabel = "";
                    if (isCompleted) {
                        const scoreVal = record.score !== undefined && record.score !== null ? `${record.score}%` : "-";
                        scoreLabel = `<span class="text-[10px] font-bold text-slate-500 bg-slate-100 px-2 py-1 rounded-md border border-slate-200">Skor: ${scoreVal}</span>`;
                    }
                    const item = document.createElement("div");
                    item.className = "flex flex-col sm:flex-row items-start sm:items-center justify-between py-4 gap-4";
                    item.innerHTML = `
                        <div class="flex items-start gap-4">
                            <div class="w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 border mt-0.5 ${isCompleted ? `bg-${color}-500 border-${color}-500 text-white` : 'border-slate-300 text-transparent'}">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
                            </div>
                            <div>
                                <div class="flex flex-wrap items-center gap-2">
                                    <span class="text-xs text-slate-400 font-bold">Sesi ${index + 1}</span>
                                    <span class="text-sm font-bold uppercase tracking-wider text-slate-800 font-heading">${session.title}</span>
                                    <span class="text-[9px] font-extrabold px-1.5 py-0.5 rounded-md bg-indigo-50 text-indigo-600 border border-indigo-100">${session.questions.length} soal</span>
                                </div>
                                <div class="flex items-center gap-3 mt-1.5 text-[11px] text-slate-400">
                                    <span>🏆 Lomba</span>
                                    ${scoreLabel}
                                </div>
                            </div>
                        </div>
                        <div class="flex-shrink-0 self-end sm:self-center">
                            <button onclick="startLombaSession('${levelId}', '${session.id}')" 
                                class="inline-block text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700 px-5 py-2.5 rounded-xl transition hover:shadow-sm">
                                ${isCompleted ? 'Ulangi Sesi' : 'Mulai Sesi! 🚀'}
                            </button>
                        </div>
                    `;
                    list.appendChild(item);
                });
                document.getElementById("selectedLevelProgress").textContent = `${completed} / ${level.sessions.length} Selesai`;
            } else if (level.lessons) {
                // Original lesson rendering
                level.lessons.forEach((lesson, index) => {
                    const record = userProgress[`${level.id}_${lesson.id}`];
                    const isCompleted = record && record.completed;
                    if (isCompleted) completed++;
                    let scoreLabel = "";
                    if (isCompleted) {
                        const scoreVal = record.score !== undefined && record.score !== null ? `${record.score}%` : "-";
                        scoreLabel = `<span class="text-[10px] font-bold text-slate-500 bg-slate-100 px-2 py-1 rounded-md border border-slate-200">Skor Quiz: ${scoreVal}</span>`;
                    }
                    const diffColor = lesson.difficulty === "Mudah" ? "bg-emerald-50 text-emerald-600 border border-emerald-100" :
                                      lesson.difficulty === "Sedang" ? "bg-amber-50 text-amber-600 border border-amber-100" :
                                      "bg-rose-50 text-rose-600 border border-rose-100";
                    const color = subjectsData[activeSubject].color;
                    const item = document.createElement("div");

        // ==========================================
        // 4. LESSON VIEWER CORE LOGIC 
        // ==========================================

        function startLesson(levelId, lessonId) {
            const levels = subjectsData[activeSubject].levels;
            activeLevelData = levels.find(l => l.id === levelId);
            if (activeLevelData) {
                activeLessonData = activeLevelData.lessons.find(l => l.id === lessonId);
            }

            if (!activeLevelData || !activeLessonData) {
                alert("Materi belum tersedia!");
                return;
            }

            document.getElementById("dashboardSection").classList.add("hidden");
            document.getElementById("viewerSection").classList.remove("hidden");
            window.scrollTo({ top: 0, behavior: 'smooth' });

            // Simpler flow for ALGO: Material -> Quiz -> Summary
            steps = ["material", "quiz", "summary"];
            currentStepIndex = 0;
            quizScore = 0;
            userAnswers = {};

            document.getElementById("lessonNavMeta").textContent = `${activeLevelData.title} | ${activeLessonData.title}`;

            // Load all questions (or max 15)
            const pool = activeLessonData.questions || [];
            quizQuestions = getRandomSubset(pool, Math.min(pool.length, 15));
            
            // If no questions, skip quiz step
            if(quizQuestions.length === 0) {
                steps = ["material", "summary"];
            }

            renderStepIndicator();
            renderStep();
        }

        function getRandomSubset(array, size) {
            const shuffled = [...array].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, size);
        }

        function renderStepIndicator() {
            const container = document.getElementById("stepIndicator");
            container.innerHTML = "";
            container.className = `grid gap-2 mb-8 text-center text-[10px] sm:text-xs font-bold text-slate-400 grid-cols-${steps.length}`;

            steps.forEach((step, i) => {
                const stepName = step === "material" ? "1. BACA MATERI 📖" :
                                 step === "quiz" ? "2. KUIS SERU 🎯" :
                                 (steps.length === 3 ? "3. BINTANG 🌟" : "2. BINTANG 🌟");

                const indicator = document.createElement("div");
                const colorClass = subjectsData[activeSubject].color;
                indicator.className = `pb-2 border-b-4 transition ${i === currentStepIndex ? `border-${colorClass}-500 text-${colorClass}-600 font-extrabold text-sm` : 'border-slate-200'}`;
                indicator.textContent = stepName;
                container.appendChild(indicator);
            });
        }

        function renderStep() {
            const step = steps[currentStepIndex];
            const contentDiv = document.getElementById("stepContent");
            contentDiv.innerHTML = "";
            contentDiv.className = "step-transition space-y-6";

            if (step === "material") {

                renderSummary(contentDiv);

                            <span class="block text-5xl font-black font-heading text-emerald-600">${correctCount}</span>

            // Build quiz review HTML
            let reviewHtml = "";

                score: Math.max(quizScore, (record && record.score) ? record.score : 0),
                timestamp: new Date().toISOString()
            };
            saveUserProgress(activeLevelData.id, activeLessonData.id, progressData);
        }

        function handleNextStep() {
            const step = steps[currentStepIndex];
            
            if (step === "quiz") {
                if (Object.keys(userAnswers).length < quizQuestions.length) {
                    alert("Ayo jawab semua pertanyaan dulu ya! 😊");
                    return;
                }

                let correctCount = 0;
                quizQuestions.forEach((q, idx) => {
                    if (Number(userAnswers[idx]) === q.correctIndex) {
                        correctCount++;
                    }
                });
                quizScore = Math.round((correctCount / quizQuestions.length) * 100);
            } 
            else if (step === "summary") {
                closeViewer();
                return;
            }

            currentStepIndex++;
            renderStepIndicator();
            renderStep();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

            document.getElementById("cancelViewerBtn").addEventListener("click", () => {

        // ==========================================
        // 5. LOMBA QUIZ ENGINE
        // ==========================================
        let lombaLevelData = null;
        let lombaSessionData = null;
        let lombaAnswers = {};
        let lombaMode = false;

        function startLombaSession(levelId, sessionId) {

        function renderLombaQuiz() {
            const contentDiv = document.getElementById("stepContent");
            contentDiv.innerHTML = '';
            contentDiv.className = 'step-transition space-y-6';

            contentDiv.innerHTML = `
                <div class="text-center space-y-2 mb-8">

            const container = document.getElementById('lombaQuizContainer');

                const qBlock = document.createElement('div');

                        <div class="text-lg font-extrabold text-slate-800">${qIdx + 1}. ${q.question}</div>

                    // Multiple choice

                                    <input type="radio" name="lomba_q_${qIdx}" value="${optIdx}" ${lombaAnswers[qIdx] && lombaAnswers[qIdx].value === String(optIdx) ? 'checked' : ''} class="w-5 h-5 text-indigo-600 border-slate-300 focus:ring-indigo-500">

            nextBtn.textContent = 'Koreksi Jawaban 📝';
        }

        function setupDragAndDrop(zone, qIdx) {
            let draggedEl = null;
            zone.addEventListener('dragstart', (e) => {
                draggedEl = e.target.closest('[draggable]');
                if (draggedEl) {
                    draggedEl.style.opacity = '0.4';
                    e.dataTransfer.effectAllowed = 'move';
                }
            });
            zone.addEventListener('dragend', (e) => {
                if (draggedEl) draggedEl.style.opacity = '1';
                draggedEl = null;
                zone.querySelectorAll('[draggable]').forEach(c => c.classList.remove('border-indigo-500', 'bg-indigo-200'));
            });
            zone.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                const target = e.target.closest('[draggable]');
                if (target && target !== draggedEl) {
                    target.classList.add('border-indigo-500', 'bg-indigo-200');
                }
            });
            zone.addEventListener('dragleave', (e) => {
                const target = e.target.closest('[draggable]');
                if (target) target.classList.remove('border-indigo-500', 'bg-indigo-200');
            });
            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                const target = e.target.closest('[draggable]');
                if (target && target !== draggedEl && draggedEl) {
                    const items = [...zone.children];
                    const dragIdx = items.indexOf(draggedEl);
                    const dropIdx = items.indexOf(target);
                    if (dragIdx < dropIdx) {
                        zone.insertBefore(draggedEl, target.nextSibling);
                    } else {
                        zone.insertBefore(draggedEl, target);
                    }
                    target.classList.remove('border-indigo-500', 'bg-indigo-200');
                    // Update answer
                    const newOrder = [...zone.children].map(c => c.dataset.value);
                    lombaAnswers[qIdx] = { type: 'drag', items: newOrder };
                }
            });

            // Touch support for mobile
            let touchDragged = null;
            let touchClone = null;
            zone.addEventListener('touchstart', (e) => {
                touchDragged = e.target.closest('[draggable]');
                if (!touchDragged) return;
                touchDragged.style.opacity = '0.4';
            }, { passive: true });
            zone.addEventListener('touchmove', (e) => {
                if (!touchDragged) return;
                e.preventDefault();
                const touch = e.touches[0];
                const elem = document.elementFromPoint(touch.clientX, touch.clientY);
                const target = elem ? elem.closest('[draggable]') : null;
                zone.querySelectorAll('[draggable]').forEach(c => c.classList.remove('border-indigo-500', 'bg-indigo-200'));
                if (target && target !== touchDragged) {
                    target.classList.add('border-indigo-500', 'bg-indigo-200');
                }
            }, { passive: false });
            zone.addEventListener('touchend', (e) => {
                if (!touchDragged) return;
                touchDragged.style.opacity = '1';
                const touch = e.changedTouches[0];
                const elem = document.elementFromPoint(touch.clientX, touch.clientY);
                const target = elem ? elem.closest('[draggable]') : null;
                if (target && target !== touchDragged) {
                    const items = [...zone.children];
                    const dragIdx = items.indexOf(touchDragged);
                    const dropIdx = items.indexOf(target);
                    if (dragIdx < dropIdx) {
                        zone.insertBefore(touchDragged, target.nextSibling);
                    } else {
                        zone.insertBefore(touchDragged, target);
                    }
                    const newOrder = [...zone.children].map(c => c.dataset.value);
                    lombaAnswers[qIdx] = { type: 'drag', items: newOrder };
                }
                zone.querySelectorAll('[draggable]').forEach(c => c.classList.remove('border-indigo-500', 'bg-indigo-200'));
                touchDragged = null;
            }, { passive: true });
        }

        function checkLombaAnswer(q, qIdx) {
            const ans = lombaAnswers[qIdx];
            if (!ans) return false;
            if (q.type === 'drag_order') {
                const userItems = ans.items.map(String);
                const correctItems = q.correct.map(String);
                return JSON.stringify(userItems) === JSON.stringify(correctItems);
            } else {
                return Number(ans.value) === q.correctIndex;
            }
        }

        function renderLombaReview() {
            const questions = lombaSessionData.questions;
            let correctCount = 0;
            questions.forEach((q, idx) => { if (checkLombaAnswer(q, idx)) correctCount++; });
            const score = Math.round((correctCount / questions.length) * 100);
            const isPassed = score >= MIN_PASSING_SCORE;

            // Update step indicator
            const stepCont = document.getElementById('stepIndicator');
            stepCont.innerHTML = '';
            ['1. KERJAKAN SOAL 🎯', '2. REVIEW JAWABAN 📋'].forEach((name, i) => {
                const d = document.createElement('div');
                d.className = `pb-2 border-b-4 transition ${i === 1 ? 'border-indigo-500 text-indigo-600 font-extrabold text-sm' : 'border-slate-200'}`;
                d.textContent = name;
                stepCont.appendChild(d);
            });

            // Build review items
            const reviewItems = questions.map((q, idx) => {
                const isCorrect = checkLombaAnswer(q, idx);
                const statusIcon = isCorrect ? '✅' : '❌';
                const statusColor = isCorrect ? 'emerald' : 'rose';
                const ans = lombaAnswers[idx];

                let answerHtml = '';
                if (q.type === 'drag_order') {
                    const userOrder = ans ? ans.items.map(String) : [];
                    const correctOrder = q.correct.map(String);
                    answerHtml = `
                        <div class="space-y-2 pl-7">
                            <div class="text-sm font-bold text-slate-600">Jawabanmu:</div>
                            <div class="flex flex-wrap gap-2">${userOrder.map((v, i) => {
                                const isRight = v === correctOrder[i];
                                return `<span class="px-3 py-1.5 rounded-lg border-2 text-sm font-bold ${isRight ? 'bg-emerald-50 border-emerald-400 text-emerald-700' : 'bg-rose-50 border-rose-400 text-rose-700'}">${v}</span>`;
                            }).join('')}</div>
                            ${!isCorrect ? `<div class="text-sm font-bold text-emerald-600 mt-1">Jawaban benar: ${correctOrder.join(' → ')}</div>` : ''}
                        </div>
                    `;
                } else {
                    answerHtml = `<div class="grid gap-2 pl-7">${q.options.map((opt, optIdx) => {
                        let bg = 'bg-slate-50 border-slate-200 text-slate-600';
                        if (optIdx === q.correctIndex) bg = 'bg-emerald-50 border-emerald-400 text-emerald-700 font-bold';
                        if (ans && Number(ans.value) === optIdx && !isCorrect) bg = 'bg-rose-50 border-rose-400 text-rose-700 font-bold';
                        const prefix = optIdx === q.correctIndex ? '✅ ' : (ans && Number(ans.value) === optIdx && !isCorrect ? '❌ ' : '○ ');
                        return `<span class="block px-3 py-2 rounded-lg border text-sm ${bg}">${prefix}${opt}</span>`;
                    }).join('')}</div>`;
                }

                return `
                    <div class="bg-white border-2 border-${statusColor}-200 rounded-2xl p-4 space-y-2">
                        <div class="flex items-start gap-2">
                            <span class="text-xl flex-shrink-0">${statusIcon}</span>
                            <p class="font-bold text-slate-700 text-sm" style="white-space:pre-line">${idx+1}. ${q.question}</p>
                        </div>
                        ${answerHtml}
                    </div>
                `;
            }).join('');

            const contentDiv = document.getElementById('stepContent');
            contentDiv.innerHTML = `
                <div class="text-center py-6">
                    <div class="text-8xl mb-6 ${isPassed ? 'animate-bounce' : ''}">${isPassed ? '🌟' : '💪'}</div>
                    <h2 class="font-heading font-extrabold text-4xl text-slate-800 mb-2">${isPassed ? 'Hebat Sekali!' : 'Hampir Saja!'}</h2>
                    <p class="text-slate-500 font-medium text-lg">${isPassed ? 'Kamu berhasil menyelesaikan sesi ini!' : `Coba lagi ya! Minimal skor ${MIN_PASSING_SCORE}.`}</p>
                    <div class="mt-8 flex flex-col sm:flex-row gap-4 justify-center items-center">
                        <div class="bg-indigo-50 p-6 rounded-2xl border-2 border-indigo-200 min-w-[160px] text-center">
                            <span class="block text-sm font-bold text-indigo-500 uppercase mb-2">Skor</span>
                            <span class="block text-5xl font-black font-heading text-indigo-600">${score}</span>
                        </div>
                        <div class="bg-emerald-50 p-6 rounded-2xl border-2 border-emerald-200 min-w-[160px] text-center">
                            <span class="block text-sm font-bold text-emerald-500 uppercase mb-2">Benar ✅</span>
                            <span class="block text-5xl font-black font-heading text-emerald-600">${correctCount}</span>
                        </div>
                        <div class="bg-rose-50 p-6 rounded-2xl border-2 border-rose-200 min-w-[160px] text-center">
                            <span class="block text-sm font-bold text-rose-500 uppercase mb-2">Salah ❌</span>
                            <span class="block text-5xl font-black font-heading text-rose-600">${questions.length - correctCount}</span>
                        </div>
                    </div>
                </div>
                <div class="mt-8 text-left w-full">
                    <h3 class="text-lg font-black text-slate-700 mb-4 flex items-center gap-2">📋 Review Jawaban</h3>
                    <div class="space-y-3 max-h-[600px] overflow-y-auto pr-1">${reviewItems}</div>
                </div>
            `;

            // Save progress
            const progressData = {
                completed: isPassed || (getUserProgress()[`${lombaLevelData.id}_${lombaSessionData.id}`] || {}).completed || false,
                score: Math.max(score, ((getUserProgress()[`${lombaLevelData.id}_${lombaSessionData.id}`]) || {}).score || 0),
                timestamp: new Date().toISOString()
            };
            saveUserProgress(lombaLevelData.id, lombaSessionData.id, progressData);

            // Update button
            const nextBtn = document.getElementById('nextStepBtn');
            nextBtn.textContent = 'Selesai! 🏁';
        }

        // Override handleNextStep to support lomba
        const originalHandleNextStep = handleNextStep;
        handleNextStep = function() {
            if (lombaMode) {
                const step = steps[currentStepIndex];
                if (step === 'lomba_quiz') {
                    // Check all answered
                    const questions = lombaSessionData.questions;
                    let allAnswered = true;
                    questions.forEach((q, idx) => {
                        if (!lombaAnswers[idx]) allAnswered = false;
                        if (q.type !== 'drag_order' && lombaAnswers[idx] && lombaAnswers[idx].value === undefined) allAnswered = false;
                    });
                    if (!allAnswered) {
                        alert('Ayo jawab semua soal dulu ya! 😊');
                        return;
                    }
                    // Capture final drag orders from DOM
                    questions.forEach((q, idx) => {
                        if (q.type === 'drag_order') {
                            const zone = document.getElementById(`drag-zone-${idx}`);
                            if (zone) {
                                const order = [...zone.children].map(c => c.dataset.value);
                                lombaAnswers[idx] = { type: 'drag', items: order };
                            }
                        }
                    });
                    currentStepIndex = 1;
                    renderLombaReview();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else if (step === 'lomba_review') {
                    lombaMode = false;
                    closeViewer();
                }
                return;
            }
            originalHandleNextStep();
        };
    </script>
    <script src="./auto_advance.js"></script>
</body>
</html>
