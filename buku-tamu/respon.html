<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buku Tamu Digital — Jejak & Respon Pengunjung Stand Apresiasi GTK 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #00798c;
      --primary-dark: #005f73;
      --cyan-border: #38bdf8;
      --cyan-light: #bae6fd;
      --navy-deep: #061325;
      --orange-accent: #f57936;
      --orange-dark: #ea580c;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --card-bg: rgba(255, 255, 255, 0.96);
      --card-border: #bae6fd;
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(circle at 5% 4%, rgba(0, 210, 238, 0.20) 0%, transparent 35%),
        radial-gradient(circle at 95% 8%, rgba(245, 121, 54, 0.18) 0%, transparent 32%),
        radial-gradient(circle at 90% 55%, rgba(2, 132, 199, 0.14) 0%, transparent 38%),
        radial-gradient(circle at 8% 85%, rgba(16, 185, 129, 0.16) 0%, transparent 36%),
        linear-gradient(180deg, #f8fcfe 0%, #edf6f9 50%, #e2f0f4 100%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 24px 16px 80px;
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
    }

    /* Top Bar Navigation */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
    }

    .badge-event {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(90deg, #007788, #00a8b8);
      color: #ffffff;
      padding: 7px 18px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border: 1.5px solid #ffffff;
      box-shadow: 0 4px 10px rgba(0, 121, 140, 0.2);
    }

    .action-links {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      color: #334155;
      padding: 9px 18px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
      box-shadow: 0 2px 4px rgba(15, 23, 42, 0.04);
    }

    .btn-action:hover {
      background: #f8fafc;
      border-color: #94a3b8;
      color: #0f172a;
    }

    .btn-action.primary {
      background: linear-gradient(135deg, #0284c7 0%, #00798c 100%);
      border: none;
      color: #fff;
      box-shadow: 0 4px 14px rgba(0, 121, 140, 0.35);
    }

    .btn-action.primary:hover {
      background: linear-gradient(135deg, #0369a1 0%, #005f73 100%);
      transform: translateY(-1px);
    }

    /* Header Section */
    .header-card {
      text-align: center;
      margin-bottom: 24px;
    }

    .title {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(1.35rem, 4.5vw, 2.2rem);
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 6px;
      letter-spacing: -0.01em;
      text-align: center;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 4px 10px;
    }

    .title-teal {
      color: #00889e;
      font-size: 0.86em;
      font-weight: 800;
      -webkit-text-stroke: 3.5px #ffffff;
      paint-order: stroke fill;
      filter: drop-shadow(0 2px 0 rgba(0, 95, 115, 0.16)) drop-shadow(0 3px 8px rgba(0, 109, 130, 0.14));
      letter-spacing: 0.01em;
      white-space: nowrap;
    }

    .title-orange {
      color: #ff5500;
      font-size: 1.08em;
      font-weight: 900;
      -webkit-text-stroke: 4px #ffffff;
      paint-order: stroke fill;
      filter: drop-shadow(0 2px 0 rgba(194, 65, 12, 0.16)) drop-shadow(0 4px 10px rgba(234, 88, 12, 0.16));
      white-space: nowrap;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    /* Filter & Summary Bar */
    .filter-wrapper {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 18px;
      padding: 14px 18px;
      margin-bottom: 24px;
      box-shadow: 0 4px 14px rgba(0, 121, 140, 0.06);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .filter-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-title {
      font-size: 0.86rem;
      font-weight: 800;
      color: var(--navy-deep);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .filter-title .count-badge {
      background: #e0f2fe;
      color: #0369a1;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
    }

    .live-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      color: #047857;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    /* Filter Chips */
    .filter-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      color: #334155;
      padding: 6px 13px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
    }

    .chip-btn:hover {
      background: #f1f5f9;
      border-color: #94a3b8;
    }

    .chip-btn.active {
      background: #00798c;
      border-color: #00798c;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 121, 140, 0.3);
    }

    .chip-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #e2e8f0;
      color: #0f172a;
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 800;
      line-height: 1;
      transition: all 0.15s;
    }

    .chip-btn.active .chip-count {
      background: rgba(255, 255, 255, 0.25);
      color: #ffffff;
    }

    /* Grid Kartu Respon */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 16px;
    }

    .feedback-card {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: var(--radius);
      padding: 18px 20px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04);
    }

    .feedback-card:hover {
      transform: translateY(-2px);
      border-color: #0284c7;
      box-shadow: 0 10px 24px -6px rgba(0, 95, 115, 0.15);
    }

    .feedback-card.highlight {
      border: 2.5px solid #00a8b8;
      background: #f0fdfa;
      box-shadow: 0 8px 22px rgba(0, 168, 184, 0.2);
    }

    .highlight-pill {
      position: absolute;
      top: -10px;
      right: 18px;
      background: linear-gradient(90deg, #007788, #00a8b8);
      color: #fff;
      font-size: 0.68rem;
      font-weight: 800;
      padding: 3px 12px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      box-shadow: 0 2px 6px rgba(0, 121, 140, 0.3);
    }

    .card-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      font-size: 1.15rem;
      color: #fff;
      flex-shrink: 0;
      text-transform: uppercase;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12);
    }

    .user-info {
      flex: 1;
      min-width: 0;
    }

    .user-name {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--navy-deep);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }

    .user-instansi {
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 3px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Kesan Pill (Identik dengan form input) */
    .kesan-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 12px;
      align-self: flex-start;
      border: 1.5px solid transparent;
    }

    .kesan-pill.good {
      background: #f0fdfa;
      border-color: #00a8b8;
      color: #084c5e;
    }

    .kesan-pill.warn {
      background: #fffbeb;
      border-color: #f59e0b;
      color: #92400e;
    }

    .kesan-pill.bad {
      background: #fef2f2;
      border-color: #ef4444;
      color: #991b1b;
    }

    .card-message {
      font-size: 0.88rem;
      line-height: 1.5;
      color: #334155;
      margin-bottom: 12px;
      background: #f8fafc;
      padding: 10px 14px;
      border-radius: 12px;
      border-left: 3.5px solid #00798c;
      font-weight: 500;
      font-style: normal;
    }

    .card-footer {
      font-size: 0.74rem;
      color: #94a3b8;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-top: auto;
      font-weight: 600;
    }

    /* Empty State */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 50px 20px;
      background: var(--card-bg);
      border: 2px dashed #bae6fd;
      border-radius: var(--radius);
    }

    .empty-state .icon {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .empty-state h3 {
      font-size: 1.15rem;
      color: var(--navy-deep);
      margin-bottom: 6px;
      font-weight: 800;
    }

    .empty-state p {
      color: var(--text-muted);
      font-size: 0.88rem;
      margin-bottom: 16px;
    }

    /* Mobile Floating Action Button */
    .fab-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: linear-gradient(135deg, #0284c7 0%, #00798c 100%);
      color: #fff;
      padding: 14px 22px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.95rem;
      text-decoration: none;
      box-shadow: 0 10px 25px -4px rgba(0, 121, 140, 0.45);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      z-index: 99;
      transition: all 0.2s;
    }

    .fab-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px -4px rgba(0, 121, 140, 0.55);
    }

    @media (max-width: 600px) {
      .title {
        font-size: 1.65rem;
      }
      .top-bar {
        flex-direction: column;
        align-items: flex-start;
      }
      .action-links {
        width: 100%;
        justify-content: space-between;
      }
      .cards-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Top Bar Navigation -->
    <div class="top-bar">
      <div class="badge-event">
        ★ Apresiasi GTK Jawa Timur 2026
      </div>
      <div class="action-links">
        <button id="refreshBtn" class="btn-action">
          🔄 Segarkan
        </button>
        <a href="index.html" class="btn-action primary">
          ✍️ Isi Buku Tamu
        </a>
      </div>
    </div>

    <!-- Header Section -->
    <div class="header-card">
      <h1 class="title">
        <span class="title-teal">Buku Tamu</span>
        <span class="title-orange">Menyelam ke Dalam Mesin Digital</span>
      </h1>
      <p class="subtitle">Jejak sapaan, apresiasi, dan masukan dari seluruh pengunjung stand kami 👋</p>
    </div>

    <!-- Filter & Summary Bar -->
    <div class="filter-wrapper">
      <div class="filter-header">
        <div class="filter-title">
          <span>Pengunjung Terdaftar:</span>
          <span class="count-badge" id="totalCountBadge">0 Tamu</span>
        </div>
        <div class="live-status">
          <div class="live-dot"></div>
          <span id="liveStatusText">Live update (15d)</span>
        </div>
      </div>

      <!-- Quick Filter Pills with Dynamic Counters -->
      <div class="filter-chips" id="filterChipsContainer">
        <!-- Rendered dynamically with live counters: Semua (0), 🌟 Keren (0), etc. -->
      </div>
    </div>

    <!-- Cards Grid -->
    <div class="cards-grid" id="cardsGrid">
      <!-- Diisi secara dinamis -->
    </div>
  </div>

  <!-- Mobile Floating Action Button -->
  <a href="index.html" class="fab-btn">
    ✍️ Isi Buku Tamu
  </a>

  <script>
    const API_LIST_URL = 'https://api.fanani.my.id/buku-tamu/list?limit=100';

    const cardsGrid = document.getElementById('cardsGrid');
    const refreshBtn = document.getElementById('refreshBtn');
    const totalCountBadge = document.getElementById('totalCountBadge');
    const liveStatusText = document.getElementById('liveStatusText');
    const filterChipsContainer = document.getElementById('filterChipsContainer');

    const FILTERS = [
      { key: 'all', label: 'Semua' },
      { key: 'Keren', label: '🌟 Keren' },
      { key: 'Inovatif', label: '💡 Inovatif' },
      { key: 'Seru', label: '🎮 Seru' },
      { key: 'Cukup', label: '👍 Cukup Bagus' },
      { key: 'Biasa', label: '🤔 Biasa' },
      { key: 'Perlu', label: '⚠️ Perlu Ditingkatkan' },
      { key: 'Kurang', label: '👎 Kurang / Jelek' }
    ];

    let allEntries = [];
    let activeFilter = 'all';

    let justSubmittedName = '';
    try {
      justSubmittedName = sessionStorage.getItem('just_submitted_name') || '';
    } catch (e) {}

    const AVATAR_GRADIENTS = [
      'linear-gradient(135deg, #0284c7, #00798c)',
      'linear-gradient(135deg, #007788, #00a8b8)',
      'linear-gradient(135deg, #f57936, #ea580c)',
      'linear-gradient(135deg, #4f46e5, #6366f1)',
      'linear-gradient(135deg, #059669, #10b981)',
      'linear-gradient(135deg, #d97706, #f59e0b)',
      'linear-gradient(135deg, #0891b2, #06b6d4)'
    ];

    function getGradient(name) {
      let hash = 0;
      for (let i = 0; i < name.length; i++) {
        hash = name.charCodeAt(i) + ((hash << 5) - hash);
      }
      const index = Math.abs(hash) % AVATAR_GRADIENTS.length;
      return AVATAR_GRADIENTS[index];
    }

    function getTone(kesan) {
      if (kesan.includes('Kurang') || kesan.includes('Jelek')) return 'bad';
      if (kesan.includes('Perlu') || kesan.includes('Biasa')) return 'warn';
      return 'good';
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatTime(isoString) {
      if (!isoString) return '';
      try {
        const date = new Date(isoString);
        if (isNaN(date.getTime())) return '';
        
        // Cek selisih menit
        const now = new Date();
        const diffMinutes = Math.floor((now - date) / 60000);
        if (diffMinutes < 1) return 'Baru saja';
        if (diffMinutes < 60) return `${diffMinutes} mnt lalu`;

        return date.toLocaleDateString('id-ID', {
          day: 'numeric',
          month: 'short',
          hour: '2-digit',
          minute: '2-digit'
        });
      } catch (e) {
        return '';
      }
    }

    function renderFilterChips() {
      filterChipsContainer.innerHTML = FILTERS.map(f => {
        let count = 0;
        if (f.key === 'all') {
          count = allEntries.length;
        } else {
          count = allEntries.filter(item => (item.kesan || '').includes(f.key)).length;
        }
        const isActive = activeFilter === f.key ? 'active' : '';
        return `
          <button class="chip-btn ${isActive}" data-filter="${f.key}">
            <span>${f.label}</span>
            <span class="chip-count">${count}</span>
          </button>
        `;
      }).join('');

      // Attach click listeners to freshly rendered buttons
      filterChipsContainer.querySelectorAll('.chip-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeFilter = btn.dataset.filter;
          renderFilterChips();
          applyFilterAndRender();
        });
      });
    }

    async function loadResponses() {
      try {
        liveStatusText.textContent = 'Memperbarui...';
        const res = await fetch(API_LIST_URL);
        const data = await res.json();

        if (res.ok && data.success) {
          allEntries = data.data || [];
          totalCountBadge.textContent = `${allEntries.length} Tamu`;
          renderFilterChips();
          applyFilterAndRender();
          liveStatusText.textContent = 'Live update (15d)';
        } else {
          liveStatusText.textContent = 'Gagal memuat respon';
        }
      } catch (err) {
        console.error(err);
        liveStatusText.textContent = 'Koneksi terputus';
      }
    }

    function applyFilterAndRender() {
      let filtered = allEntries;
      if (activeFilter !== 'all') {
        filtered = allEntries.filter(item => (item.kesan || '').includes(activeFilter));
      }

      if (filtered.length === 0) {
        cardsGrid.innerHTML = `
          <div class="empty-state">
            <div class="icon">✨</div>
            <h3>${activeFilter === 'all' ? 'Belum Ada Respon' : 'Tidak Ada Respon pada Kategori Ini'}</h3>
            <p>${activeFilter === 'all' ? 'Jadilah yang pertama mengisi buku tamu!' : 'Pilih kategori kesan lain untuk melihat respon.'}</p>
            ${activeFilter === 'all' ? '<a href="index.html" class="btn-action primary">✍️ Isi Buku Tamu Sekarang</a>' : ''}
          </div>
        `;
        return;
      }

      cardsGrid.innerHTML = filtered.map(item => {
        const isHighlight = justSubmittedName && item.nama.toLowerCase() === justSubmittedName.toLowerCase();
        const initial = (item.nama || 'T').charAt(0).toUpperCase();
        const gradient = getGradient(item.nama || 'Tamu');
        const tone = getTone(item.kesan || '');
        const timeFormatted = formatTime(item.created_at);

        return `
          <div class="feedback-card ${isHighlight ? 'highlight' : ''}">
            ${isHighlight ? '<div class="highlight-pill">Respon Anda 🎉</div>' : ''}
            
            <div class="card-top">
              <div class="avatar" style="background: ${gradient}">${escapeHtml(initial)}</div>
              <div class="user-info">
                <div class="user-name" title="${escapeHtml(item.nama)}">${escapeHtml(item.nama)}</div>
                <div class="user-instansi" title="${escapeHtml(item.instansi)}">
                  <span>🏢</span> <span>${escapeHtml(item.instansi)}</span>
                </div>
              </div>
            </div>

            <div class="kesan-pill ${tone}">
              ${escapeHtml(item.kesan)}
            </div>

            ${
              item.pesan && item.pesan.trim()
                ? `<div class="card-message">"${escapeHtml(item.pesan.trim())}"</div>`
                : ''
            }

            <div class="card-footer">
              <span>${escapeHtml(timeFormatted)}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    // Refresh Click Handler
    refreshBtn.addEventListener('click', () => {
      loadResponses();
    });

    // Initial Load & Auto-Refresh every 15s
    renderFilterChips();
    loadResponses();
    setInterval(loadResponses, 15000);
  </script>
</body>
</html>
