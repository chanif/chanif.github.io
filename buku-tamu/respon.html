<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wall of Feedback & Tamu — Apresiasi GTK Jawa Timur 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #00798c;
      --primary-dark: #005f73;
      --cyan-border: #38bdf8;
      --cyan-light: #bae6fd;
      --navy-deep: #061325;
      --orange-accent: #f57936;
      --orange-dark: #ea580c;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --card-bg: rgba(255, 255, 255, 0.96);
      --card-border: #bae6fd;
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(circle at 5% 4%, rgba(0, 210, 238, 0.20) 0%, transparent 35%),
        radial-gradient(circle at 95% 8%, rgba(245, 121, 54, 0.18) 0%, transparent 32%),
        radial-gradient(circle at 90% 55%, rgba(2, 132, 199, 0.14) 0%, transparent 38%),
        radial-gradient(circle at 8% 85%, rgba(16, 185, 129, 0.16) 0%, transparent 36%),
        linear-gradient(180deg, #f8fcfe 0%, #edf6f9 50%, #e2f0f4 100%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 24px 16px 80px;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
    }

    /* Top Nav / Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
    }

    .badge-event {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(90deg, #007788, #00a8b8);
      color: #ffffff;
      padding: 7px 18px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border: 1.5px solid #ffffff;
      box-shadow: 0 4px 10px rgba(0, 121, 140, 0.2);
    }

    .action-links {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      color: #334155;
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
      box-shadow: 0 2px 4px rgba(15, 23, 42, 0.04);
    }

    .btn-action:hover {
      background: #f8fafc;
      border-color: #94a3b8;
      color: #0f172a;
    }

    .btn-action.primary {
      background: linear-gradient(135deg, #0284c7 0%, #00798c 100%);
      border: none;
      color: #fff;
      box-shadow: 0 4px 12px rgba(0, 121, 140, 0.3);
    }

    .btn-action.primary:hover {
      background: linear-gradient(135deg, #0369a1 0%, #005f73 100%);
    }

    /* Header Section */
    .header-section {
      text-align: center;
      margin-bottom: 28px;
    }

    .title {
      font-family: 'Outfit', sans-serif;
      font-size: 2.3rem;
      font-weight: 900;
      color: var(--navy-deep);
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.98rem;
    }

    /* Stats Bar */
    .stats-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 12px rgba(0, 121, 140, 0.06);
    }

    .stat-number {
      font-family: 'Outfit', sans-serif;
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--navy-deep);
      line-height: 1.1;
    }

    .stat-label {
      font-size: 0.76rem;
      color: var(--text-muted);
      font-weight: 700;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    /* Live Indicator */
    .live-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      font-size: 0.84rem;
      color: var(--text-muted);
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #047857;
      font-weight: 700;
    }

    .live-dot {
      width: 9px;
      height: 9px;
      background: #10b981;
      border-radius: 50%;
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    /* Feed Masonry / Cards Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    .feedback-card {
      background: var(--card-bg);
      border: 2px solid #e2e8f0;
      border-radius: var(--radius);
      padding: 20px 22px;
      backdrop-filter: blur(12px);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04);
    }

    .feedback-card:hover {
      transform: translateY(-2px);
      border-color: #38bdf8;
      box-shadow: 0 12px 24px -8px rgba(0, 95, 115, 0.14);
    }

    .feedback-card.highlight {
      border: 2.5px solid #00a8b8;
      background: #f0fdfa;
      box-shadow: 0 8px 24px rgba(0, 168, 184, 0.2);
    }

    .highlight-pill {
      position: absolute;
      top: -11px;
      right: 18px;
      background: linear-gradient(90deg, #007788, #00a8b8);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 3px 12px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      box-shadow: 0 2px 6px rgba(0, 121, 140, 0.3);
    }

    .card-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      font-size: 1.15rem;
      color: #fff;
      flex-shrink: 0;
      text-transform: uppercase;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.12);
    }

    .user-info {
      flex: 1;
      min-width: 0;
    }

    .user-name {
      font-weight: 800;
      font-size: 1.02rem;
      color: var(--navy-deep);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-instansi {
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
      font-weight: 600;
    }

    .kesan-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 12px;
      align-self: flex-start;
    }

    /* Badge Tone Variations */
    .kesan-badge.good {
      background: #f0fdfa;
      border: 1px solid #00a8b8;
      color: #084c5e;
    }

    .kesan-badge.warn {
      background: #fffbeb;
      border: 1px solid #f59e0b;
      color: #92400e;
    }

    .kesan-badge.bad {
      background: #fef2f2;
      border: 1px solid #ef4444;
      color: #991b1b;
    }

    .card-message {
      font-size: 0.9rem;
      line-height: 1.5;
      color: #334155;
      margin-bottom: 14px;
      flex: 1;
      white-space: pre-line;
      background: #f8fafc;
      padding: 10px 14px;
      border-radius: 10px;
      border-left: 3.5px solid #0284c7;
      font-weight: 500;
    }

    .card-message.empty {
      font-style: italic;
      color: #94a3b8;
      border-left-color: #cbd5e1;
    }

    .card-footer {
      font-size: 0.76rem;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      font-weight: 600;
    }

    /* Empty State */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      background: var(--card-bg);
      border: 2px dashed #cbd5e1;
      border-radius: var(--radius);
    }

    .empty-state .icon {
      font-size: 2.5rem;
      margin-bottom: 12px;
    }

    .empty-state h3 {
      font-size: 1.2rem;
      color: var(--navy-deep);
      margin-bottom: 6px;
      font-weight: 800;
    }

    .empty-state p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 18px;
    }

    /* Floating Action Button (Mobile) */
    .fab-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: linear-gradient(135deg, #0284c7 0%, #00798c 100%);
      color: #fff;
      padding: 14px 24px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.95rem;
      text-decoration: none;
      box-shadow: 0 10px 25px -4px rgba(0, 121, 140, 0.45);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      z-index: 99;
      transition: all 0.2s;
    }

    .fab-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px -4px rgba(0, 121, 140, 0.55);
    }

    @media (max-width: 640px) {
      .title {
        font-size: 1.8rem;
      }
      .top-bar {
        flex-direction: column;
        align-items: flex-start;
      }
      .cards-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="badge-event">
        Apresiasi GTK Jawa Timur 2026
      </div>
      <div class="action-links">
        <button id="refreshBtn" class="btn-action">
          🔄 Refresh
        </button>
        <a href="index.html" class="btn-action primary">
          ✍️ Isi Buku Tamu
        </a>
      </div>
    </div>

    <!-- Header Section -->
    <div class="header-section">
      <h1 class="title">Wall of Impressions & Feedback</h1>
      <p class="subtitle">Apresiasi & catatan kesan dari seluruh pengunjung stand karya inovatif kami</p>
    </div>

    <!-- Stats Bar -->
    <div class="stats-container">
      <div class="stat-card">
        <div class="stat-number" id="totalGuests">-</div>
        <div class="stat-label">Total Tamu</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="countKeren">-</div>
        <div class="stat-label">🌟 Keren / Inovatif</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="countSeru">-</div>
        <div class="stat-label">🎮 Seru / Oke</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="countEvaluasi">-</div>
        <div class="stat-label">💡 Masukan / Evaluasi</div>
      </div>
    </div>

    <!-- Live Status Indicator -->
    <div class="live-status">
      <div class="live-badge">
        <div class="live-dot"></div>
        <span>Live Papan Respon Real-Time</span>
      </div>
      <div id="lastUpdateText">Memuat data...</div>
    </div>

    <!-- Feed Cards Grid -->
    <div class="cards-grid" id="cardsGrid">
      <!-- Cards will be populated dynamically -->
    </div>
  </div>

  <!-- Mobile Floating Action Button -->
  <a href="index.html" class="fab-btn">
    ✍️ Isi Buku Tamu
  </a>

  <script>
    const API_LIST_URL = 'https://api.fanani.my.id/buku-tamu/list?limit=100';

    const cardsGrid = document.getElementById('cardsGrid');
    const refreshBtn = document.getElementById('refreshBtn');
    const totalGuestsEl = document.getElementById('totalGuests');
    const countKerenEl = document.getElementById('countKeren');
    const countSeruEl = document.getElementById('countSeru');
    const countEvaluasiEl = document.getElementById('countEvaluasi');
    const lastUpdateText = document.getElementById('lastUpdateText');

    let justSubmittedName = '';
    try {
      justSubmittedName = sessionStorage.getItem('just_submitted_name') || '';
    } catch (e) {}

    const AVATAR_GRADIENTS = [
      'linear-gradient(135deg, #0284c7, #00798c)',
      'linear-gradient(135deg, #007788, #00a8b8)',
      'linear-gradient(135deg, #f57936, #ea580c)',
      'linear-gradient(135deg, #4f46e5, #6366f1)',
      'linear-gradient(135deg, #059669, #10b981)',
      'linear-gradient(135deg, #d97706, #f59e0b)',
      'linear-gradient(135deg, #0891b2, #06b6d4)'
    ];

    function getGradient(name) {
      let hash = 0;
      for (let i = 0; i < name.length; i++) {
        hash = name.charCodeAt(i) + ((hash << 5) - hash);
      }
      const index = Math.abs(hash) % AVATAR_GRADIENTS.length;
      return AVATAR_GRADIENTS[index];
    }

    function getTone(kesan) {
      if (kesan.includes('Kurang') || kesan.includes('Jelek')) return 'bad';
      if (kesan.includes('Perlu') || kesan.includes('Biasa')) return 'warn';
      return 'good';
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatTime(isoString) {
      if (!isoString) return '';
      try {
        const date = new Date(isoString);
        if (isNaN(date.getTime())) return '';
        return date.toLocaleDateString('id-ID', {
          day: 'numeric',
          month: 'short',
          hour: '2-digit',
          minute: '2-digit'
        });
      } catch (e) {
        return '';
      }
    }

    async function loadResponses() {
      try {
        lastUpdateText.textContent = 'Memperbarui...';
        const res = await fetch(API_LIST_URL);
        const data = await res.json();

        if (res.ok && data.success) {
          renderData(data.data || []);
          lastUpdateText.textContent = 'Terakhir diupdate: ' + new Date().toLocaleTimeString('id-ID');
        } else {
          lastUpdateText.textContent = 'Gagal memuat respon terbaru';
        }
      } catch (err) {
        console.error(err);
        lastUpdateText.textContent = 'Koneksi terputus';
      }
    }

    function renderData(items) {
      // Calculate Stats
      totalGuestsEl.textContent = items.length;

      let kerenCount = 0;
      let seruCount = 0;
      let evalCount = 0;

      items.forEach(item => {
        const k = item.kesan || '';
        if (k.includes('Keren') || k.includes('Inovatif')) {
          kerenCount++;
        } else if (k.includes('Seru') || k.includes('Cukup')) {
          seruCount++;
        } else {
          evalCount++;
        }
      });

      countKerenEl.textContent = kerenCount;
      countSeruEl.textContent = seruCount;
      countEvaluasiEl.textContent = evalCount;

      if (items.length === 0) {
        cardsGrid.innerHTML = `
          <div class="empty-state">
            <div class="icon">✨</div>
            <h3>Belum Ada Respon</h3>
            <p>Jadilah yang pertama mengisi buku tamu dan memberikan apresiasi!</p>
            <a href="index.html" class="btn-action primary">✍️ Isi Buku Tamu Sekarang</a>
          </div>
        `;
        return;
      }

      cardsGrid.innerHTML = items.map(item => {
        const isHighlight = justSubmittedName && item.nama.toLowerCase() === justSubmittedName.toLowerCase();
        const initial = (item.nama || 'T').charAt(0).toUpperCase();
        const gradient = getGradient(item.nama || 'Tamu');
        const tone = getTone(item.kesan || '');
        const timeFormatted = formatTime(item.created_at);

        return `
          <div class="feedback-card ${isHighlight ? 'highlight' : ''}">
            ${isHighlight ? '<div class="highlight-pill">Respon Anda 🎉</div>' : ''}
            <div class="card-top">
              <div class="avatar" style="background: ${gradient}">${escapeHtml(initial)}</div>
              <div class="user-info">
                <div class="user-name" title="${escapeHtml(item.nama)}">${escapeHtml(item.nama)}</div>
                <div class="user-instansi" title="${escapeHtml(item.instansi)}">${escapeHtml(item.instansi)}</div>
              </div>
            </div>

            <div class="kesan-badge ${tone}">
              ${escapeHtml(item.kesan)}
            </div>

            ${
              item.pesan && item.pesan.trim()
                ? `<div class="card-message">"${escapeHtml(item.pesan.trim())}"</div>`
                : `<div class="card-message empty">Tidak meninggalkan pesan tertulis.</div>`
            }

            <div class="card-footer">
              <span>Apresiasi GTK Jatim 2026</span>
              <span>${escapeHtml(timeFormatted)}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    // Refresh Click
    refreshBtn.addEventListener('click', () => {
      loadResponses();
    });

    // Initial Load & Auto-Refresh every 15s
    loadResponses();
    setInterval(loadResponses, 15000);
  </script>
</body>
</html>
