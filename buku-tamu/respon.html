<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wall of Feedback & Tamu — Apresiasi GTK Jawa Timur 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070c18;
      --card-bg: rgba(16, 25, 45, 0.75);
      --card-border: rgba(56, 85, 133, 0.4);
      --primary: #38bdf8;
      --accent: #f97316;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(14, 165, 233, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(249, 115, 22, 0.1) 0px, transparent 50%),
        radial-gradient(at 50% 100%, rgba(30, 41, 59, 0.3) 0px, transparent 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px 80px;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
    }

    /* Top Nav / Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
    }

    .badge-event {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(14, 165, 233, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #7dd3fc;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .badge-event span {
      width: 7px;
      height: 7px;
      background: #38bdf8;
      border-radius: 50%;
      box-shadow: 0 0 8px #38bdf8;
    }

    .action-links {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(71, 85, 105, 0.5);
      color: #e2e8f0;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }

    .btn-action:hover {
      background: rgba(51, 65, 85, 0.8);
      border-color: #94a3b8;
      color: #fff;
    }

    .btn-action.primary {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      border: none;
      color: #fff;
    }

    .btn-action.primary:hover {
      background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
    }

    /* Header Section */
    .header-section {
      text-align: center;
      margin-bottom: 28px;
    }

    .title {
      font-family: 'Outfit', sans-serif;
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 40%, #bae6fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Stats Bar */
    .stats-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px 16px;
      text-align: center;
      backdrop-filter: blur(10px);
    }

    .stat-number {
      font-family: 'Outfit', sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      color: #fff;
      line-height: 1.1;
    }

    .stat-label {
      font-size: 0.76rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    /* Live Indicator */
    .live-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #4ade80;
      font-weight: 600;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
      70% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }

    /* Feed Masonry / Cards Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    .feedback-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 18px 20px;
      backdrop-filter: blur(12px);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .feedback-card:hover {
      transform: translateY(-2px);
      border-color: rgba(56, 189, 248, 0.5);
      box-shadow: 0 12px 28px -8px rgba(0, 0, 0, 0.4);
    }

    .feedback-card.highlight {
      border: 2px solid #38bdf8;
      background: rgba(14, 165, 233, 0.12);
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
    }

    .highlight-pill {
      position: absolute;
      top: -10px;
      right: 16px;
      background: #0284c7;
      color: #fff;
      font-size: 0.68rem;
      font-weight: 800;
      padding: 2px 10px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .card-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.15rem;
      color: #fff;
      flex-shrink: 0;
      text-transform: uppercase;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
    }

    .user-info {
      flex: 1;
      min-width: 0;
    }

    .user-name {
      font-weight: 700;
      font-size: 0.98rem;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-instansi {
      font-size: 0.78rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    .kesan-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 12px;
      align-self: flex-start;
    }

    /* Badge Tone Variations */
    .kesan-badge.good {
      background: rgba(14, 165, 233, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #7dd3fc;
    }

    .kesan-badge.warn {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(251, 191, 36, 0.35);
      color: #fde047;
    }

    .kesan-badge.bad {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(248, 113, 113, 0.35);
      color: #fca5a5;
    }

    .card-message {
      font-size: 0.88rem;
      line-height: 1.5;
      color: #cbd5e1;
      margin-bottom: 14px;
      flex: 1;
      white-space: pre-line;
      background: rgba(10, 18, 34, 0.4);
      padding: 10px 12px;
      border-radius: 10px;
      border-left: 3px solid rgba(56, 189, 248, 0.5);
    }

    .card-message.empty {
      font-style: italic;
      color: #64748b;
      border-left-color: #334155;
    }

    .card-footer {
      font-size: 0.74rem;
      color: #64748b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
    }

    /* Empty State */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      background: var(--card-bg);
      border: 1px dashed var(--card-border);
      border-radius: var(--radius);
    }

    .empty-state .icon {
      font-size: 2.5rem;
      margin-bottom: 12px;
    }

    .empty-state h3 {
      font-size: 1.15rem;
      color: #fff;
      margin-bottom: 6px;
    }

    .empty-state p {
      color: var(--text-muted);
      font-size: 0.88rem;
      margin-bottom: 18px;
    }

    /* Floating Action Button (Mobile) */
    .fab-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #fff;
      padding: 14px 22px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      box-shadow: 0 10px 25px -4px rgba(2, 132, 199, 0.6);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      z-index: 99;
      transition: all 0.2s;
    }

    .fab-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px -4px rgba(14, 165, 233, 0.7);
    }

    @media (max-width: 640px) {
      .title {
        font-size: 1.7rem;
      }
      .top-bar {
        flex-direction: column;
        align-items: flex-start;
      }
      .cards-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="badge-event">
        <span></span> Apresiasi GTK Jawa Timur 2026
      </div>
      <div class="action-links">
        <button id="refreshBtn" class="btn-action">
          🔄 Refresh
        </button>
        <a href="index.html" class="btn-action primary">
          ✍️ Isi Buku Tamu
        </a>
      </div>
    </div>

    <!-- Header Section -->
    <div class="header-section">
      <h1 class="title">Wall of Impressions & Feedback</h1>
      <p class="subtitle">Apresiasi & catatan kesan dari seluruh pengunjung stand karya inovatif kami</p>
    </div>

    <!-- Stats Bar -->
    <div class="stats-container">
      <div class="stat-card">
        <div class="stat-number" id="totalGuests">-</div>
        <div class="stat-label">Total Tamu</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="countKeren">-</div>
        <div class="stat-label">🌟 Keren / Inovatif</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="countSeru">-</div>
        <div class="stat-label">🎮 Seru / Oke</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="countEvaluasi">-</div>
        <div class="stat-label">💡 Masukan & Evaluasi</div>
      </div>
    </div>

    <!-- Live Status Indicator -->
    <div class="live-status">
      <div class="live-badge">
        <div class="live-dot"></div>
        <span>Live Papan Respon Real-Time</span>
      </div>
      <div id="lastUpdateText">Memuat data...</div>
    </div>

    <!-- Feed Cards Grid -->
    <div class="cards-grid" id="cardsGrid">
      <!-- Cards will be populated dynamically -->
    </div>
  </div>

  <!-- Mobile Floating Action Button -->
  <a href="index.html" class="fab-btn">
    ✍️ Isi Buku Tamu
  </a>

  <script>
    const API_LIST_URL = 'https://api.fanani.my.id/buku-tamu/list?limit=100';

    const cardsGrid = document.getElementById('cardsGrid');
    const refreshBtn = document.getElementById('refreshBtn');
    const totalGuestsEl = document.getElementById('totalGuests');
    const countKerenEl = document.getElementById('countKeren');
    const countSeruEl = document.getElementById('countSeru');
    const countEvaluasiEl = document.getElementById('countEvaluasi');
    const lastUpdateText = document.getElementById('lastUpdateText');

    let justSubmittedName = '';
    try {
      justSubmittedName = sessionStorage.getItem('just_submitted_name') || '';
    } catch (e) {}

    const AVATAR_GRADIENTS = [
      'linear-gradient(135deg, #0284c7, #38bdf8)',
      'linear-gradient(135deg, #6366f1, #818cf8)',
      'linear-gradient(135deg, #0d9488, #2dd4bf)',
      'linear-gradient(135deg, #ea580c, #fb923c)',
      'linear-gradient(135deg, #7c3aed, #a78bfa)',
      'linear-gradient(135deg, #db2777, #f472b6)',
      'linear-gradient(135deg, #059669, #34d399)'
    ];

    function getGradient(name) {
      let hash = 0;
      for (let i = 0; i < name.length; i++) {
        hash = name.charCodeAt(i) + ((hash << 5) - hash);
      }
      const index = Math.abs(hash) % AVATAR_GRADIENTS.length;
      return AVATAR_GRADIENTS[index];
    }

    function getTone(kesan) {
      if (kesan.includes('Kurang') || kesan.includes('Jelek')) return 'bad';
      if (kesan.includes('Perlu') || kesan.includes('Biasa')) return 'warn';
      return 'good';
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatTime(isoString) {
      if (!isoString) return '';
      try {
        const date = new Date(isoString);
        if (isNaN(date.getTime())) return '';
        return date.toLocaleDateString('id-ID', {
          day: 'numeric',
          month: 'short',
          hour: '2-digit',
          minute: '2-digit'
        });
      } catch (e) {
        return '';
      }
    }

    async function loadResponses() {
      try {
        lastUpdateText.textContent = 'Memperbarui...';
        const res = await fetch(API_LIST_URL);
        const data = await res.json();

        if (res.ok && data.success) {
          renderData(data.data || []);
          lastUpdateText.textContent = 'Terakhir diupdate: ' + new Date().toLocaleTimeString('id-ID');
        } else {
          lastUpdateText.textContent = 'Gagal memuat respon terbaru';
        }
      } catch (err) {
        console.error(err);
        lastUpdateText.textContent = 'Koneksi terputus';
      }
    }

    function renderData(items) {
      // Calculate Stats
      totalGuestsEl.textContent = items.length;

      let kerenCount = 0;
      let seruCount = 0;
      let evalCount = 0;

      items.forEach(item => {
        const k = item.kesan || '';
        if (k.includes('Keren') || k.includes('Inovatif')) {
          kerenCount++;
        } else if (k.includes('Seru') || k.includes('Cukup')) {
          seruCount++;
        } else {
          evalCount++;
        }
      });

      countKerenEl.textContent = kerenCount;
      countSeruEl.textContent = seruCount;
      countEvaluasiEl.textContent = evalCount;

      if (items.length === 0) {
        cardsGrid.innerHTML = `
          <div class="empty-state">
            <div class="icon">✨</div>
            <h3>Belum Ada Respon</h3>
            <p>Jadilah yang pertama mengisi buku tamu dan memberikan apresiasi!</p>
            <a href="index.html" class="btn-action primary">✍️ Isi Buku Tamu Sekarang</a>
          </div>
        `;
        return;
      }

      cardsGrid.innerHTML = items.map(item => {
        const isHighlight = justSubmittedName && item.nama.toLowerCase() === justSubmittedName.toLowerCase();
        const initial = (item.nama || 'T').charAt(0).toUpperCase();
        const gradient = getGradient(item.nama || 'Tamu');
        const tone = getTone(item.kesan || '');
        const timeFormatted = formatTime(item.created_at);

        return `
          <div class="feedback-card ${isHighlight ? 'highlight' : ''}">
            ${isHighlight ? '<div class="highlight-pill">Respon Anda 🎉</div>' : ''}
            <div class="card-top">
              <div class="avatar" style="background: ${gradient}">${escapeHtml(initial)}</div>
              <div class="user-info">
                <div class="user-name" title="${escapeHtml(item.nama)}">${escapeHtml(item.nama)}</div>
                <div class="user-instansi" title="${escapeHtml(item.instansi)}">${escapeHtml(item.instansi)}</div>
              </div>
            </div>

            <div class="kesan-badge ${tone}">
              ${escapeHtml(item.kesan)}
            </div>

            ${
              item.pesan && item.pesan.trim()
                ? `<div class="card-message">"${escapeHtml(item.pesan.trim())}"</div>`
                : `<div class="card-message empty">Tidak meninggalkan pesan tertulis.</div>`
            }

            <div class="card-footer">
              <span>Apresiasi GTK Jatim</span>
              <span>${escapeHtml(timeFormatted)}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    // Refresh Click
    refreshBtn.addEventListener('click', () => {
      loadResponses();
    });

    // Initial Load & Auto-Refresh every 15s
    loadResponses();
    setInterval(loadResponses, 15000);
  </script>
</body>
</html>
