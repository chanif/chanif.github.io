<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Buku Tamu Digital — Apresiasi GTK Jawa Timur 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #00798c;
      --primary-dark: #005f73;
      --cyan-border: #38bdf8;
      --cyan-light: #bae6fd;
      --navy-deep: #061325;
      --orange-accent: #f57936;
      --orange-dark: #ea580c;
      --text-main: #0f172a;
      --text-muted: #475569;
      --card-bg: rgba(255, 255, 255, 0.96);
      --card-border: #bae6fd;
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(circle at 5% 4%, rgba(0, 210, 238, 0.22) 0%, transparent 35%),
        radial-gradient(circle at 95% 8%, rgba(245, 121, 54, 0.20) 0%, transparent 32%),
        radial-gradient(circle at 90% 55%, rgba(2, 132, 199, 0.16) 0%, transparent 38%),
        radial-gradient(circle at 8% 85%, rgba(16, 185, 129, 0.18) 0%, transparent 36%),
        linear-gradient(180deg, #f8fcfe 0%, #edf6f9 50%, #e2f0f4 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: auto;
    }

    .badge-event {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(90deg, #007788, #00a8b8);
      color: #ffffff;
      padding: 7px 18px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      box-shadow: 0 4px 10px rgba(0, 121, 140, 0.2);
      margin-bottom: 12px;
      border: 1.5px solid #ffffff;
    }

    .header-card {
      text-align: center;
      margin-bottom: 20px;
    }

    .title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.9rem;
      font-weight: 900;
      line-height: 1.2;
      color: var(--navy-deep);
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.92rem;
      line-height: 1.5;
    }

    .card {
      background: var(--card-bg);
      border: 2.5px solid var(--card-border);
      border-radius: var(--radius);
      padding: 26px 24px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 
        0 8px 0 rgba(0, 121, 140, 0.08), 
        0 20px 36px -10px rgba(0, 95, 115, 0.12),
        0 2px 8px rgba(15, 23, 42, 0.04);
    }

    .form-group {
      margin-bottom: 18px;
    }

    .label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 4px;
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--navy-deep);
      margin-bottom: 8px;
      letter-spacing: 0.01em;
    }

    .label .req {
      color: #ea580c;
      margin-left: 2px;
    }

    .label .hint {
      font-weight: 600;
      font-size: 0.76rem;
      color: #64748b;
    }

    .input-field, .textarea-field {
      width: 100%;
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 0.95rem;
      color: var(--text-main);
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
      box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.03);
    }

    .input-field:focus, .textarea-field:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.18);
      background: #ffffff;
    }

    .input-field::placeholder, .textarea-field::placeholder {
      color: #94a3b8;
      font-size: 0.88rem;
    }

    .textarea-field {
      resize: vertical;
      min-height: 72px;
    }

    /* Pilihan Kesan Pill Grid */
    .pill-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .pill-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      padding: 10px 12px;
      color: #334155;
      font-size: 0.84rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      text-align: left;
      transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    .pill-btn:hover {
      background: #f8fafc;
      border-color: #94a3b8;
      transform: translateY(-1px);
    }

    .pill-btn:active {
      transform: scale(0.97);
    }

    .pill-btn .emoji {
      font-size: 1.15rem;
      line-height: 1;
      flex-shrink: 0;
    }

    /* Active States */
    .pill-btn.active {
      background: #f0fdfa;
      border-color: #00a8b8;
      color: #084c5e;
      box-shadow: 0 0 0 2px rgba(0, 168, 184, 0.25);
    }

    .pill-btn.active.warn {
      background: #fffbeb;
      border-color: #f59e0b;
      color: #92400e;
      box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.25);
    }

    .pill-btn.active.bad {
      background: #fef2f2;
      border-color: #ef4444;
      color: #991b1b;
      box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.25);
    }

    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, #0284c7 0%, #00798c 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 1.02rem;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 6px 16px -2px rgba(0, 121, 140, 0.4);
      transition: all 0.2s ease;
      margin-top: 22px;
    }

    .submit-btn:hover {
      background: linear-gradient(135deg, #0369a1 0%, #005f73 100%);
      box-shadow: 0 8px 20px -2px rgba(0, 121, 140, 0.5);
      transform: translateY(-1px);
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .footer-links {
      text-align: center;
      margin-top: 18px;
    }

    .view-responses-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #0369a1;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 700;
      transition: color 0.15s;
    }

    .view-responses-link:hover {
      color: #0284c7;
      text-decoration: underline;
    }

    .alert {
      display: none;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.88rem;
      margin-bottom: 14px;
      line-height: 1.4;
      font-weight: 600;
    }

    .alert-error {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: #b91c1c;
    }

    .alert-success {
      background: #ecfdf5;
      border: 1px solid #6ee7b7;
      color: #047857;
      text-align: center;
    }

    @media (max-width: 420px) {
      .pill-grid {
        grid-template-columns: 1fr;
      }
      .card {
        padding: 20px 16px;
      }
      .title {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-card">
      <div class="badge-event">
        ⚡ 15 Detik &bull; Apresiasi GTK 2026
      </div>
      <h1 class="title">Buku Tamu Digital</h1>
      <p class="subtitle">Senang Anda mampir ke stand kami!<br>Tinggalkan sapaan atau jejak singkat Anda di bawah ini 👋</p>
    </div>

    <div class="card">
      <div id="alertBox" class="alert"></div>

      <form id="guestbookForm">
        <!-- 1. Nama -->
        <div class="form-group">
          <label class="label" for="namaInput">
            <span>Nama Bapak/Ibu <span class="req">*</span></span>
            <span class="hint">Boleh nama lengkap atau nama panggilan</span>
          </label>
          <input 
            type="text" 
            id="namaInput" 
            class="input-field" 
            placeholder="Contoh: Pak Budi / Budi Darmawan" 
            required 
            maxlength="90"
            autocomplete="name"
          >
        </div>

        <!-- 2. Instansi -->
        <div class="form-group">
          <label class="label" for="instansiInput">
            <span>Instansi <span class="req">*</span></span>
            <span class="hint">Asal lembaga atau organisasi</span>
          </label>
          <input 
            type="text" 
            id="instansiInput" 
            class="input-field" 
            placeholder="Contoh: SMPN 2 Lamongan atau Komunitas Pengagum Senja" 
            required 
            maxlength="90"
          >
        </div>

        <!-- 3. Kesan Cepat (7 Pilihan) -->
        <div class="form-group">
          <label class="label">
            <span>Kesan Anda <span class="req">*</span></span>
            <span class="hint">1x Tap</span>
          </label>
          <div class="pill-grid">
            <button type="button" class="pill-btn active" data-kesan="🌟 Keren & Menginspirasi" data-tone="good">
              <span class="emoji">🌟</span> Keren & Menginspirasi
            </button>
            <button type="button" class="pill-btn" data-kesan="💡 Sangat Inovatif" data-tone="good">
              <span class="emoji">💡</span> Sangat Inovatif
            </button>
            <button type="button" class="pill-btn" data-kesan="🎮 Seru & Interaktif" data-tone="good">
              <span class="emoji">🎮</span> Seru & Interaktif
            </button>
            <button type="button" class="pill-btn" data-kesan="👍 Cukup Bagus / Oke" data-tone="good">
              <span class="emoji">👍</span> Cukup Bagus / Oke
            </button>
            <button type="button" class="pill-btn" data-kesan="🤔 Biasa Saja" data-tone="warn">
              <span class="emoji">🤔</span> Biasa Saja
            </button>
            <button type="button" class="pill-btn" data-kesan="⚠️ Perlu Ditingkatkan" data-tone="warn">
              <span class="emoji">⚠️</span> Perlu Ditingkatkan
            </button>
            <button type="button" class="pill-btn" data-kesan="👎 Kurang / Jelek" data-tone="bad" style="grid-column: 1 / -1;">
              <span class="emoji">👎</span> Kurang / Jelek (Perlu Banyak Perbaikan)
            </button>
          </div>
          <input type="hidden" id="selectedKesan" value="🌟 Keren & Menginspirasi">
        </div>

        <!-- 4. Pesan / Saran Singkat -->
        <div class="form-group" style="margin-bottom: 0;">
          <label class="label" for="pesanInput">
            <span>Pesan / Masukan</span>
            <span class="hint">Boleh dikosongi</span>
          </label>
          <textarea 
            id="pesanInput" 
            class="textarea-field" 
            rows="2" 
            maxlength="500" 
            placeholder="Pesan singkat, doa, atau masukan (bebas)..."
          ></textarea>
        </div>

        <!-- Tombol Kirim -->
        <button type="submit" id="submitBtn" class="submit-btn">
          <span class="btn-spinner" id="btnSpinner"></span>
          <span id="btnText">Kirim Respon & Masuk ke Wall 🚀</span>
        </button>
      </form>
    </div>

    <div class="footer-links">
      <a href="respon.html" class="view-responses-link">
        Lihat Semua Respon Pengunjung Lainnya &rarr;
      </a>
    </div>
  </div>

  <script>
    const API_SUBMIT_URL = 'https://api.fanani.my.id/buku-tamu/submit';

    const form = document.getElementById('guestbookForm');
    const namaInput = document.getElementById('namaInput');
    const instansiInput = document.getElementById('instansiInput');
    const pesanInput = document.getElementById('pesanInput');
    const selectedKesan = document.getElementById('selectedKesan');
    const pillButtons = document.querySelectorAll('.pill-btn');
    const submitBtn = document.getElementById('submitBtn');
    const btnSpinner = document.getElementById('btnSpinner');
    const btnText = document.getElementById('btnText');
    const alertBox = document.getElementById('alertBox');

    // Handle Pill Selection
    pillButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        pillButtons.forEach(b => {
          b.classList.remove('active', 'warn', 'bad');
        });

        const tone = btn.dataset.tone;
        btn.classList.add('active');
        if (tone === 'warn') btn.classList.add('warn');
        if (tone === 'bad') btn.classList.add('bad');

        selectedKesan.value = btn.dataset.kesan;

        // Dynamic placeholder helper
        if (tone === 'bad' || btn.dataset.kesan.includes('Perlu Ditingkatkan')) {
          pesanInput.placeholder = 'Bagian mana yang menurut Anda kurang atau perlu kami tingkatkan? Kritik Anda sangat berharga...';
        } else {
          pesanInput.placeholder = 'Pesan singkat, doa, atau masukan (bebas)...';
        }
      });
    });

    // Handle Form Submit
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const nama = namaInput.value.trim();
      const instansi = instansiInput.value.trim();
      const kesan = selectedKesan.value.trim();
      const pesan = pesanInput.value.trim();

      if (!nama || !instansi || !kesan) {
        showAlert('Mohon isi nama, instansi, dan pilih salah satu kesan ya 🙏', 'error');
        return;
      }

      // UI Loading state
      submitBtn.disabled = true;
      btnSpinner.style.display = 'inline-block';
      btnText.textContent = 'Mengirim...';
      alertBox.style.display = 'none';

      try {
        const response = await fetch(API_SUBMIT_URL, {
          method: 'POST',
          mode: 'cors',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ nama, instansi, kesan, pesan })
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.error || `Server merespon error (${response.status})`);
        }

        const data = await response.json();

        if (data.success) {
          showAlert('🎉 Respon berhasil dikirim! Mengalihkan ke Wall of Responses...', 'success');
          
          try {
            sessionStorage.setItem('just_submitted_name', nama);
          } catch(e) {}

          setTimeout(() => {
            window.location.href = 'respon.html';
          }, 800);
        } else {
          throw new Error(data.error || 'Terjadi kendala saat menyimpan.');
        }
      } catch (err) {
        console.error('Submit error:', err);
        const errMsg = (err && err.message === 'Failed to fetch')
          ? 'Gagal terhubung ke server (Failed to fetch). Mohon periksa koneksi internet Anda atau coba lagi.'
          : (err && err.message ? err.message : 'Gagal mengirim respon.');
        showAlert(errMsg, 'error');
        submitBtn.disabled = false;
        btnSpinner.style.display = 'none';
        btnText.textContent = 'Kirim Respon & Masuk ke Wall 🚀';
      }
    });

    function showAlert(msg, type) {
      alertBox.textContent = msg;
      alertBox.className = 'alert ' + (type === 'success' ? 'alert-success' : 'alert-error');
      alertBox.style.display = 'block';
    }
  </script>
</body>
</html>
