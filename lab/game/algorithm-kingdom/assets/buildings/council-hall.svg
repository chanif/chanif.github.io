<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="marblePillars" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="purpleRoof" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    <linearGradient id="goldFiligree" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="stonePlaza" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="roseWindow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="80%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </radialGradient>
    <filter id="hallShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#090503" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#hallShadow)">
    <!-- Base Island & Plaza Steps -->
    <ellipse cx="256" cy="425" rx="200" ry="70" fill="#0f172a" opacity="0.45"/>
    <path d="M60 410 C120 470 392 470 452 410 L452 432 C392 492 120 492 60 432 Z" fill="#1e293b"/>
    <ellipse cx="256" cy="410" rx="196" ry="65" fill="#334155"/>

    <!-- Tiered Marble Steps (Isometric) -->
    <!-- Step 1 -->
    <path d="M120 405 L256 360 L392 405 L256 450 Z" fill="#64748b"/>
    <path d="M120 405 L256 450 L256 458 L120 413 Z" fill="#475569"/>
    <path d="M256 450 L392 405 L392 413 L256 458 Z" fill="#334155"/>
    <!-- Step 2 -->
    <path d="M135 395 L256 355 L377 395 L256 435 Z" fill="#94a3b8"/>
    <!-- Step 3 (Plinth) -->
    <path d="M150 385 L256 350 L362 385 L256 420 Z" fill="#cbd5e1"/>

    <!-- Red Carpet Leading In -->
    <path d="M230 430 L256 420 L282 430 L268 375 L256 370 L244 375 Z" fill="#b91c1c"/>
    <path d="M228 430 L284 430" stroke="#f59e0b" stroke-width="2"/>

    <!-- Interior Hall Chamber (Dark Behind Columns) -->
    <path d="M165 375 L256 345 L347 375 L347 245 L256 215 L165 245 Z" fill="#1e1b4b"/>

    <!-- Grand Wooden Double Doors Inside -->
    <path d="M232 355 A24 24 0 0 1 280 355 L280 372 L232 372 Z" fill="#78350f" stroke="#fbbf24" stroke-width="2"/>
    <line x1="256" y1="335" x2="256" y2="372" stroke="#451a03" stroke-width="2"/>
    <circle cx="248" cy="355" r="3" fill="#fde047"/>
    <circle cx="264" cy="355" r="3" fill="#fde047"/>

    <!-- Stained Glass Rose Window Above Portal -->
    <circle cx="256" cy="275" r="28" fill="url(#roseWindow)" stroke="#fde047" stroke-width="3"/>
    <circle cx="256" cy="275" r="14" fill="#fbbf24" opacity="0.6"/>
    <circle cx="256" cy="275" r="5" fill="#fef08a"/>
    <!-- Rose window tracery -->
    <line x1="256" y1="247" x2="256" y2="303" stroke="#fde047" stroke-width="2"/>
    <line x1="228" y1="275" x2="284" y2="275" stroke="#fde047" stroke-width="2"/>
    <line x1="236" y1="255" x2="276" y2="295" stroke="#fde047" stroke-width="1.5"/>
    <line x1="276" y1="255" x2="236" y2="295" stroke="#fde047" stroke-width="1.5"/>

    <!-- Front Row of Classical Marble Columns (Colonnade) -->
    <!-- Column 1 (Leftmost) -->
    <g transform="translate(165, 230)">
      <rect x="0" y="10" width="14" height="135" fill="url(#marblePillars)"/>
      <rect x="-3" y="5" width="20" height="8" rx="2" fill="#f8fafc"/>
      <rect x="-3" y="142" width="20" height="8" rx="2" fill="#94a3b8"/>
    </g>
    <!-- Column 2 -->
    <g transform="translate(205, 238)">
      <rect x="0" y="10" width="15" height="135" fill="url(#marblePillars)"/>
      <rect x="-3" y="5" width="21" height="8" rx="2" fill="#f8fafc"/>
      <rect x="-3" y="142" width="21" height="8" rx="2" fill="#94a3b8"/>
    </g>
    <!-- Column 3 -->
    <g transform="translate(292, 238)">
      <rect x="0" y="10" width="15" height="135" fill="url(#marblePillars)"/>
      <rect x="-3" y="5" width="21" height="8" rx="2" fill="#f8fafc"/>
      <rect x="-3" y="142" width="21" height="8" rx="2" fill="#94a3b8"/>
    </g>
    <!-- Column 4 (Rightmost) -->
    <g transform="translate(333, 230)">
      <rect x="0" y="10" width="14" height="135" fill="url(#marblePillars)"/>
      <rect x="-3" y="5" width="20" height="8" rx="2" fill="#f8fafc"/>
      <rect x="-3" y="142" width="20" height="8" rx="2" fill="#94a3b8"/>
    </g>

    <!-- Royal Purple Banners hanging between columns -->
    <g transform="translate(182, 245)">
      <rect x="0" y="0" width="18" height="60" fill="#7c3aed" rx="2"/>
      <polygon points="0,60 9,50 18,60" fill="#1e1b4b"/>
      <polygon points="4,15 9,5 14,15" fill="#fde047"/>
    </g>
    <g transform="translate(312, 245)">
      <rect x="0" y="0" width="18" height="60" fill="#7c3aed" rx="2"/>
      <polygon points="0,60 9,50 18,60" fill="#1e1b4b"/>
      <polygon points="4,15 9,5 14,15" fill="#fde047"/>
    </g>

    <!-- Entablature / Architrave beam -->
    <path d="M150 240 L256 205 L362 240 L256 250 Z" fill="#f8fafc"/>
    <path d="M150 240 L256 250 L256 258 L150 248 Z" fill="#cbd5e1"/>
    <path d="M256 250 L362 240 L362 248 L256 258 Z" fill="#94a3b8"/>

    <!-- Grand Classical Triangular Pediment -->
    <polygon points="150,240 256,130 362,240" fill="#e2e8f0"/>
    <polygon points="150,240 256,130 256,243" fill="#f8fafc"/>
    <!-- Pediment Cornice Gold Trim -->
    <polyline points="145,242 256,126 367,242" fill="none" stroke="url(#goldFiligree)" stroke-width="6"/>

    <!-- Royal Crest inside Pediment (Tympanum) -->
    <circle cx="256" cy="195" r="18" fill="url(#goldFiligree)"/>
    <path d="M246 198 L256 182 L266 198 L262 198 L256 188 L250 198 Z" fill="#581c87"/>
    <circle cx="256" cy="198" r="4" fill="#fbbf24"/>

    <!-- Sloped Mansard / Temple Roof -->
    <path d="M150 238 L256 128 L280 80 L200 80 Z" fill="url(#purpleRoof)" opacity="0.95"/>
    <path d="M256 128 L362 238 L380 180 L280 80 Z" fill="#4c1d95"/>

    <!-- Golden Crown Finial on Apex -->
    <g transform="translate(244, 45) scale(0.6)">
      <path d="M0 30 L40 30 L35 50 L5 50 Z" fill="url(#goldFiligree)"/>
      <polygon points="5,30 5,10 15,22 20,5 25,22 35,10 35,30" fill="url(#goldFiligree)" stroke="#78350f" stroke-width="1.5"/>
      <circle cx="5" cy="8" r="3" fill="#38bdf8"/>
      <circle cx="20" cy="3" r="3" fill="#f43f5e"/>
      <circle cx="35" cy="8" r="3" fill="#38bdf8"/>
    </g>

    <!-- Braziers with Golden Fire on Steps -->
    <g transform="translate(130, 390)">
      <polygon points="5,15 15,15 17,5 3,5" fill="#475569"/>
      <path d="M4 5 Q10 -15 10 -5 Q13 -12 16 5 Z" fill="#f59e0b"/>
      <path d="M7 5 Q10 -8 10 -2 Q12 -6 13 5 Z" fill="#fef08a"/>
    </g>
    <g transform="translate(362, 390)">
      <polygon points="5,15 15,15 17,5 3,5" fill="#475569"/>
      <path d="M4 5 Q10 -15 10 -5 Q13 -12 16 5 Z" fill="#f59e0b"/>
      <path d="M7 5 Q10 -8 10 -2 Q12 -6 13 5 Z" fill="#fef08a"/>
    </g>
  </g>
</svg>
