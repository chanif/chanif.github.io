<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="farmGround" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#4d7c0f"/>
    </linearGradient>
    <linearGradient id="wheatField" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="windmillWallL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="windmillWallR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="thatchRoof" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="woodLog" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <filter id="farmShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#090503" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#farmShadow)">
    <!-- Base Island -->
    <ellipse cx="256" cy="425" rx="195" ry="68" fill="#1e293b" opacity="0.4"/>
    <path d="M65 405 C120 465 392 465 447 405 L447 425 C392 485 120 485 65 425 Z" fill="#3f2e22"/>
    <ellipse cx="256" cy="405" rx="191" ry="63" fill="url(#farmGround)"/>

    <!-- Wheat Patch -->
    <path d="M120 410 Q190 435 240 405 Q170 380 120 410 Z" fill="url(#wheatField)"/>
    <path d="M130 400 L135 390 M145 405 L150 393 M165 410 L170 398 M185 415 L190 402 M205 412 L210 400" stroke="#a16207" stroke-width="2.5"/>

    <!-- Stone Granary Building (Right) -->
    <!-- Left Wall -->
    <path d="M280 380 L350 345 L350 260 L280 290 Z" fill="#94a3b8"/>
    <!-- Right Wall -->
    <path d="M350 345 L420 375 L420 285 L350 260 Z" fill="#64748b"/>
    <!-- Granary Roof -->
    <path d="M270 290 L350 215 L430 280 L350 310 Z" fill="url(#thatchRoof)"/>
    <!-- Granary Door -->
    <path d="M305 365 L335 350 L335 305 L305 320 Z" fill="url(#woodLog)"/>
    <!-- Roof details -->
    <line x1="310" y1="250" x2="350" y2="295" stroke="#713f12" stroke-width="2"/>
    <line x1="385" y1="245" x2="360" y2="295" stroke="#713f12" stroke-width="2"/>

    <!-- Grain Sacks stacked -->
    <g transform="translate(245, 365)">
      <!-- Sack 1 -->
      <path d="M0 25 C-5 15 25 15 20 25 C25 35 -5 35 0 25 Z" fill="#d97706"/>
      <circle cx="10" cy="18" r="4" fill="#b45309"/>
      <!-- Sack 2 -->
      <path d="M18 28 C13 18 43 18 38 28 C43 38 13 38 18 28 Z" fill="#f59e0b"/>
      <circle cx="28" cy="21" r="4" fill="#d97706"/>
      <!-- Sack 3 (Top) -->
      <path d="M8 12 C3 2 33 2 28 12 C33 22 3 22 8 12 Z" fill="#fbbf24"/>
      <circle cx="18" cy="5" r="4" fill="#b45309"/>
    </g>

    <!-- Windmill Tower (Left/Center) -->
    <!-- Octagonal Stone Base -->
    <path d="M140 370 L195 340 L250 365 L250 215 L195 200 L140 215 Z" fill="url(#windmillWallL)"/>
    <path d="M195 340 L250 365 L250 215 L195 200 Z" fill="url(#windmillWallR)"/>

    <!-- Windmill Timber Frame Lines -->
    <line x1="140" y1="310" x2="195" y2="280" stroke="#78350f" stroke-width="3"/>
    <line x1="195" y1="280" x2="250" y2="305" stroke="#78350f" stroke-width="3"/>
    <line x1="140" y1="260" x2="195" y2="235" stroke="#78350f" stroke-width="3"/>
    <line x1="195" y1="235" x2="250" y2="255" stroke="#78350f" stroke-width="3"/>
    <!-- Diagonal cross bracing -->
    <line x1="140" y1="310" x2="195" y2="235" stroke="#92400e" stroke-width="2" opacity="0.6"/>
    <line x1="140" y1="260" x2="195" y2="340" stroke="#92400e" stroke-width="2" opacity="0.6"/>

    <!-- Windmill Arched Entrance -->
    <path d="M158 358 A15 15 0 0 1 182 358 L182 375 L158 375 Z" fill="#451a03"/>

    <!-- Windmill Window -->
    <rect x="162" y="240" width="16" height="20" rx="3" fill="#1e293b"/>
    <line x1="170" y1="240" x2="170" y2="260" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="162" y1="250" x2="178" y2="250" stroke="#fbbf24" stroke-width="1.5"/>

    <!-- Windmill Conical Roof -->
    <path d="M130 220 L195 125 L260 220 Z" fill="#059669"/>
    <path d="M195 125 L260 220 L195 228 Z" fill="#047857"/>

    <!-- Windmill Rotor Axle Hub -->
    <circle cx="195" cy="180" r="14" fill="#b45309" stroke="#451a03" stroke-width="3"/>
    <circle cx="195" cy="180" r="6" fill="#f59e0b"/>

    <!-- Windmill 4 Rotating Blades (Cross) -->
    <!-- Top-Right Blade -->
    <g transform="rotate(25 195 180)">
      <line x1="195" y1="180" x2="195" y2="40" stroke="#78350f" stroke-width="5"/>
      <rect x="198" y="50" width="28" height="85" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" rx="2" opacity="0.9"/>
      <line x1="198" y1="75" x2="226" y2="75" stroke="#cbd5e1" stroke-width="1.5"/>
      <line x1="198" y1="105" x2="226" y2="105" stroke="#cbd5e1" stroke-width="1.5"/>

      <!-- Bottom-Left Blade -->
      <line x1="195" y1="180" x2="195" y2="320" stroke="#78350f" stroke-width="5"/>
      <rect x="164" y="200" width="28" height="85" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" rx="2" opacity="0.9"/>
      <line x1="164" y1="225" x2="192" y2="225" stroke="#cbd5e1" stroke-width="1.5"/>
      <line x1="164" y1="255" x2="192" y2="255" stroke="#cbd5e1" stroke-width="1.5"/>

      <!-- Top-Left Blade -->
      <line x1="195" y1="180" x2="55" y2="180" stroke="#78350f" stroke-width="5"/>
      <rect x="70" y="152" width="85" height="25" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" rx="2" opacity="0.9"/>
      <line x1="95" y1="152" x2="95" y2="177" stroke="#cbd5e1" stroke-width="1.5"/>
      <line x1="125" y1="152" x2="125" y2="177" stroke="#cbd5e1" stroke-width="1.5"/>

      <!-- Bottom-Right Blade -->
      <line x1="195" y1="180" x2="335" y2="180" stroke="#78350f" stroke-width="5"/>
      <rect x="215" y="183" width="85" height="25" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" rx="2" opacity="0.9"/>
      <line x1="240" y1="183" x2="240" y2="208" stroke="#cbd5e1" stroke-width="1.5"/>
      <line x1="270" y1="183" x2="270" y2="208" stroke="#cbd5e1" stroke-width="1.5"/>
    </g>

    <!-- Wooden Picket Fence -->
    <g transform="translate(60, 360)">
      <line x1="0" y1="30" x2="60" y2="50" stroke="#92400e" stroke-width="3"/>
      <line x1="0" y1="40" x2="60" y2="60" stroke="#92400e" stroke-width="3"/>
      <polygon points="10,25 14,20 18,25 18,50 10,50" fill="#b45309"/>
      <polygon points="30,32 34,27 38,32 38,57 30,57" fill="#b45309"/>
      <polygon points="50,40 54,35 58,40 58,65 50,65" fill="#b45309"/>
    </g>
  </g>
</svg>
