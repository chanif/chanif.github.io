<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 160" width="100%" height="100%">
  <defs>
    <!-- Shroud Gradients -->
    <linearGradient id="gpu-i-shroud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="gpu-i-metal-plate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Fan Hub Gradient -->
    <linearGradient id="gpu-i-fan-hub" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- PCIe Gold Connector -->
    <linearGradient id="gpu-i-gold" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <filter id="gpu-i-shadow" x="-5%" y="-10%" width="115%" height="125%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <g filter="url(#gpu-i-shadow)">
    <!-- Top PCIe x16 Connector Gold Fingers (Plugs into PCIe slot above) -->
    <!-- PCB protrusion at top (x=45 to 222, y=6 to 24) -->
    <path d="M 45,24 L 45,6 L 60,6 L 63,11 L 205,11 L 208,6 L 222,6 L 222,24 Z" fill="#0f172a" />
    <!-- Gold Finger Strip with notch at x=61 -->
    <rect x="46" y="9" width="14" height="13" fill="url(#gpu-i-gold)" />
    <rect x="64" y="9" width="156" height="13" fill="url(#gpu-i-gold)" />

    <!-- Gold Pin Dividing Lines -->
    <g stroke="#78350f" stroke-width="0.6">
      <line x1="50" y1="9" x2="50" y2="22" /><line x1="55" y1="9" x2="55" y2="22" />
      <line x1="72" y1="9" x2="72" y2="22" /><line x1="80" y1="9" x2="80" y2="22" />
      <line x1="88" y1="9" x2="88" y2="22" /><line x1="96" y1="9" x2="96" y2="22" />
      <line x1="104" y1="9" x2="104" y2="22" /><line x1="112" y1="9" x2="112" y2="22" />
      <line x1="120" y1="9" x2="120" y2="22" /><line x1="128" y1="9" x2="128" y2="22" />
      <line x1="136" y1="9" x2="136" y2="22" /><line x1="144" y1="9" x2="144" y2="22" />
      <line x1="152" y1="9" x2="152" y2="22" /><line x1="160" y1="9" x2="160" y2="22" />
      <line x1="168" y1="9" x2="168" y2="22" /><line x1="176" y1="9" x2="176" y2="22" />
      <line x1="184" y1="9" x2="184" y2="22" /><line x1="192" y1="9" x2="192" y2="22" />
      <line x1="200" y1="9" x2="200" y2="22" /><line x1="208" y1="9" x2="208" y2="22" />
      <line x1="216" y1="9" x2="216" y2="22" />
    </g>

    <!-- PCIe Bracket on Far Left (Metal rear slot) -->
    <rect x="8" y="10" width="14" height="142" rx="2" fill="#94a3b8" stroke="#cbd5e1" stroke-width="0.8" />
    <circle cx="15" cy="18" r="3" fill="#64748b" />
    <!-- Display Ports on Bracket (HDMI & DisplayPort cutouts) -->
    <rect x="11" y="45" width="8" height="12" rx="1" fill="#1e293b" stroke="#475569" stroke-width="0.5" />
    <rect x="11" y="68" width="8" height="14" rx="1" fill="#1e293b" stroke="#475569" stroke-width="0.5" />
    <rect x="11" y="92" width="8" height="14" rx="1" fill="#1e293b" stroke="#475569" stroke-width="0.5" />

    <!-- Main GPU Card Body / Shroud (Hanging downward) -->
    <path d="M 22,24 
             L 345,24 Q 355,24 355,34 
             L 355,138 Q 355,148 345,148 
             L 22,148 Z" 
          fill="url(#gpu-i-shroud)" stroke="#00D4FF" stroke-width="1.2" />

    <!-- Exposed Aluminum Heatsink Fins (Vertical lines behind shroud) -->
    <g stroke="#64748b" stroke-width="1" opacity="0.35">
      <line x1="35" y1="36" x2="35" y2="136" /><line x1="42" y1="36" x2="42" y2="136" />
      <line x1="49" y1="36" x2="49" y2="136" /><line x1="56" y1="36" x2="56" y2="136" />
      <line x1="165" y1="36" x2="165" y2="136" /><line x1="172" y1="36" x2="172" y2="136" />
      <line x1="179" y1="36" x2="179" y2="136" /><line x1="186" y1="36" x2="186" y2="136" />
      <line x1="193" y1="36" x2="193" y2="136" /><line x1="200" y1="36" x2="200" y2="136" />
      <line x1="310" y1="36" x2="310" y2="136" /><line x1="317" y1="36" x2="317" y2="136" />
      <line x1="324" y1="36" x2="324" y2="136" /><line x1="331" y1="36" x2="331" y2="136" />
    </g>

    <!-- Copper Heatpipes running across the card -->
    <path d="M 50,60 L 330,60" stroke="#b45309" stroke-width="3.5" fill="none" opacity="0.8" />
    <path d="M 50,118 L 330,118" stroke="#b45309" stroke-width="3.5" fill="none" opacity="0.8" />

    <!-- Geometric Accent Faceplates -->
    <polygon points="35,138 100,138 115,120 45,120" fill="url(#gpu-i-metal-plate)" stroke="#475569" stroke-width="0.5" />
    <polygon points="265,138 335,138 345,120 275,120" fill="url(#gpu-i-metal-plate)" stroke="#475569" stroke-width="0.5" />

    <!-- Cyan Glowing LED Accent Line -->
    <path d="M 125,142 L 255,142" stroke="#00D4FF" stroke-width="2.5" stroke-linecap="round" />

    <!-- Bottom Typography Badge -->
    <text x="190" y="134" font-family="'Inter', system-ui, sans-serif" font-size="7.5" font-weight="900" fill="#00D4FF" text-anchor="middle" letter-spacing="1.5">
      GRAPHICS CARD · 8GB GDDR6
    </text>

    <!-- ================= FAN 1 (LEFT) ================= -->
    <g id="gpu-i-fan-1" transform="translate(108, 86)">
      <!-- Fan Circular Well / Recess -->
      <circle cx="0" cy="0" r="44" fill="#020617" stroke="#334155" stroke-width="2" />
      <circle cx="0" cy="0" r="42" fill="none" stroke="#00D4FF" stroke-width="0.5" opacity="0.5" />

      <!-- Fan Blades Group -->
      <g class="spin-blades">
        <path d="M 0,0 C 10,-12 25,-25 40,-20 C 45,-15 35,-5 20,0 Z" fill="#1e293b" stroke="#334155" stroke-width="0.5" />
        <path d="M 0,0 C 10,-12 25,-25 40,-20 C 45,-15 35,-5 20,0 Z" fill="#1e293b" stroke="#334155" stroke-width="0.5" transform="rotate(40)" />
        <path d="M 0,0 C 10,-12 25,-25 40,-20 C 45,-15 35,-5 20,0 Z" fill="#1e293b" stroke="#334155" stroke-width="0.5" transform="rotate(80)" />
        <path d="M 0,0 C 10,-12 25,-25 40,-20 C 45,-15 35,-5 20,0 Z" fill="#1e293b" stroke="#334155" stroke-width="0.5" transform="rotate(120)" />
        <path d="M 0,0 C 10,-12 25,-25 40,-20 C 45,-15 35,-5 20,0 Z" fill="#1e293b" stroke="#334155" stroke-width="0.5" transform="rotate(160)" />
        <path d="M 0,0 C 10,-12 25,-25 40,-20 C 45,-15 35,-5 20,0 Z" fill="#1e293b" stroke="#334155" stroke-width="0.5" transform="rotate(200)" />
        <path d="M 0,0 C 10,-12 25,-25 40,-20 C 45,-15 35,-5 20,0 Z" fill="#1e293b" stroke="#334155" stroke-width="0.5" transform="rotate(240)" />
        <path d="M 0,0 C 10,-12 25,-25 40,-20 C 45,-15 35,-5 20,0 Z" fill="#1e293b" stroke="#334155" stroke-width="0.5" transform="rotate(280)" />
        <path d="M 0,0 C 10,-12 25,-25 40,-20 C 45,-15 35,-5 20,0 Z" fill="#1e293b" stroke="#334155" stroke-width="0.5" transform="rotate(320)" />
      </g>

      <!-- Center Hub Badge -->
      <circle cx="0" cy="0" r="16" fill="url(#gpu-i-fan-hub)" stroke="#ffffff" stroke-width="1" />
      <text x="0" y="3" font-family="'Inter', sans-serif" font-size="6.5" font-weight="900" fill="#ffffff" text-anchor="middle">GPU</text>
    </g>

    <!-- ================= FAN 2 (RIGHT) ================= -->
    <g id="gpu-i-fan-2" transform="translate(252, 86)">
      <!-- Fan Circular Well / Recess -->
      <circle cx="0" cy="0" r="44" fill="#020617" stroke="#334155" stroke-width="2" />
      <circle cx="0" cy="0" r="42" fill="none" stroke="#00D4FF" stroke-width="0.5" opacity="0.5" />

      <!-- Fan Blades Group -->
      <g class="spin-blades">
        <path d="M 0,0 C 10,-12 25,-25 40,-20 C 45,-15 35,-5 20,0 Z" fill="#1e293b" stroke="#334155" stroke-width="0.5" />
        <path d="M 0,0 C 10,-12 25,-25 40,-20 C 45,-15 35,-5 20,0 Z" fill="#1e293b" stroke="#334155" stroke-width="0.5" transform="rotate(40)" />
        <path d="M 0,0 C 10,-12 25,-25 40,-20 C 45,-15 35,-5 20,0 Z" fill="#1e293b" stroke="#334155" stroke-width="0.5" transform="rotate(80)" />
        <path d="M 0,0 C 10,-12 25,-25 40,-20 C 45,-15 35,-5 20,0 Z" fill="#1e293b" stroke="#334155" stroke-width="0.5" transform="rotate(120)" />
        <path d="M 0,0 C 10,-12 25,-25 40,-20 C 45,-15 35,-5 20,0 Z" fill="#1e293b" stroke="#334155" stroke-width="0.5" transform="rotate(160)" />
        <path d="M 0,0 C 10,-12 25,-25 40,-20 C 45,-15 35,-5 20,0 Z" fill="#1e293b" stroke="#334155" stroke-width="0.5" transform="rotate(200)" />
        <path d="M 0,0 C 10,-12 25,-25 40,-20 C 45,-15 35,-5 20,0 Z" fill="#1e293b" stroke="#334155" stroke-width="0.5" transform="rotate(240)" />
        <path d="M 0,0 C 10,-12 25,-25 40,-20 C 45,-15 35,-5 20,0 Z" fill="#1e293b" stroke="#334155" stroke-width="0.5" transform="rotate(280)" />
        <path d="M 0,0 C 10,-12 25,-25 40,-20 C 45,-15 35,-5 20,0 Z" fill="#1e293b" stroke="#334155" stroke-width="0.5" transform="rotate(320)" />
      </g>

      <!-- Center Hub Badge -->
      <circle cx="0" cy="0" r="16" fill="url(#gpu-i-fan-hub)" stroke="#ffffff" stroke-width="1" />
      <text x="0" y="3" font-family="'Inter', sans-serif" font-size="6.5" font-weight="900" fill="#ffffff" text-anchor="middle">GPU</text>
    </g>

    <!-- Supplemental 8-Pin Power Connector at Bottom-Right (x=285) -->
    <rect x="275" y="140" width="34" height="12" rx="1.5" fill="#020617" stroke="#475569" stroke-width="0.8" />
    <g fill="#f59e0b">
      <rect x="278" y="143" width="6" height="4" rx="0.5" />
      <rect x="286" y="143" width="6" height="4" rx="0.5" />
      <rect x="294" y="143" width="6" height="4" rx="0.5" />
      <rect x="302" y="143" width="6" height="4" rx="0.5" />
    </g>
  </g>
</svg>
