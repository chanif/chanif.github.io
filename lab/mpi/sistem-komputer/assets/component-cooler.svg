<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="cooler-hub" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="copper-pipe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <radialGradient id="rgb-halo" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#00D4FF" stop-opacity="0" />
      <stop offset="90%" stop-color="#00D4FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3" />
    </radialGradient>
  </defs>

  <g transform="translate(80, 80)">
    <!-- Outer Mounting Square Bracket with 4 Screws -->
    <rect x="-65" y="-65" width="130" height="130" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2" />
    
    <!-- 4 Corner Screws -->
    <circle cx="-54" cy="-54" r="5" fill="#64748b" stroke="#cbd5e1" stroke-width="1" />
    <circle cx="54" cy="-54" r="5" fill="#64748b" stroke="#cbd5e1" stroke-width="1" />
    <circle cx="-54" cy="54" r="5" fill="#64748b" stroke="#cbd5e1" stroke-width="1" />
    <circle cx="54" cy="54" r="5" fill="#64748b" stroke="#cbd5e1" stroke-width="1" />

    <!-- 4 Copper Heatpipe Tips -->
    <circle cx="-35" cy="-58" r="4" fill="url(#copper-pipe)" />
    <circle cx="-15" cy="-58" r="4" fill="url(#copper-pipe)" />
    <circle cx="15" cy="-58" r="4" fill="url(#copper-pipe)" />
    <circle cx="35" cy="-58" r="4" fill="url(#copper-pipe)" />

    <!-- Radial Aluminum Cooling Fin Ring -->
    <circle cx="0" cy="0" r="56" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    
    <!-- Fine fin concentric ripples -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#334155" stroke-width="0.8" />
    <circle cx="0" cy="0" r="44" fill="none" stroke="#334155" stroke-width="0.8" />
    <circle cx="0" cy="0" r="38" fill="none" stroke="#334155" stroke-width="0.8" />

    <!-- RGB Halo Ring -->
    <circle cx="0" cy="0" r="54" fill="url(#rgb-halo)" />

    <!-- Rotating Fan Blades Group -->
    <g class="spin-blades">
      <path d="M 0,0 C 8,-12 24,-24 38,-20 C 42,-14 34,-4 18,0 Z" fill="#0284c7" opacity="0.85" stroke="#38bdf8" stroke-width="0.5" />
      <path d="M 0,0 C 8,-12 24,-24 38,-20 C 42,-14 34,-4 18,0 Z" fill="#0284c7" opacity="0.85" stroke="#38bdf8" stroke-width="0.5" transform="rotate(51.4)" />
      <path d="M 0,0 C 8,-12 24,-24 38,-20 C 42,-14 34,-4 18,0 Z" fill="#0284c7" opacity="0.85" stroke="#38bdf8" stroke-width="0.5" transform="rotate(102.8)" />
      <path d="M 0,0 C 8,-12 24,-24 38,-20 C 42,-14 34,-4 18,0 Z" fill="#0284c7" opacity="0.85" stroke="#38bdf8" stroke-width="0.5" transform="rotate(154.2)" />
      <path d="M 0,0 C 8,-12 24,-24 38,-20 C 42,-14 34,-4 18,0 Z" fill="#0284c7" opacity="0.85" stroke="#38bdf8" stroke-width="0.5" transform="rotate(205.6)" />
      <path d="M 0,0 C 8,-12 24,-24 38,-20 C 42,-14 34,-4 18,0 Z" fill="#0284c7" opacity="0.85" stroke="#38bdf8" stroke-width="0.5" transform="rotate(257)" />
      <path d="M 0,0 C 8,-12 24,-24 38,-20 C 42,-14 34,-4 18,0 Z" fill="#0284c7" opacity="0.85" stroke="#38bdf8" stroke-width="0.5" transform="rotate(308.4)" />
    </g>

    <!-- Center Fan Motor Hub -->
    <circle cx="0" cy="0" r="16" fill="url(#cooler-hub)" stroke="#ffffff" stroke-width="1.2" />
    <circle cx="0" cy="0" r="14" fill="none" stroke="#00D4FF" stroke-width="0.8" />
    <text x="0" y="3.5" font-family="'Inter', sans-serif" font-size="6" font-weight="900" fill="#ffffff" text-anchor="middle">CPU</text>
  </g>
</svg>
