<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Sci-fi Gradients -->
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <radialGradient id="holo-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="laser-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base with Grid Lines -->
  <rect x="0" y="0" width="800" height="450" rx="20" fill="url(#hero-bg)" />

  <!-- Perspective Floor Grid (Cyber Workbench Grid) -->
  <g stroke="#00D4FF" stroke-width="0.75" opacity="0.18">
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="0" y1="390" x2="800" y2="390" />
    <line x1="0" y1="420" x2="800" y2="420" />
    <line x1="0" y1="450" x2="800" y2="450" />
    <!-- Radiating perspective vanishing lines to center (400, 260) -->
    <line x1="400" y1="260" x2="-100" y2="450" />
    <line x1="400" y1="260" x2="100" y2="450" />
    <line x1="400" y1="260" x2="300" y2="450" />
    <line x1="400" y1="260" x2="500" y2="450" />
    <line x1="400" y1="260" x2="700" y2="450" />
    <line x1="400" y1="260" x2="900" y2="450" />
  </g>

  <!-- Holographic Emitter Glow Pedestal -->
  <ellipse cx="400" cy="340" rx="260" ry="70" fill="url(#holo-glow)" />
  <ellipse cx="400" cy="340" rx="220" ry="55" fill="none" stroke="#00D4FF" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.7" />
  <ellipse cx="400" cy="340" rx="160" ry="40" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.5" />

  <!-- Holographic Concentric Sci-Fi Rings around Center -->
  <g transform="translate(400, 200)" filter="url(#laser-glow)">
    <!-- Outer Quantum Ring -->
    <circle cx="0" cy="0" r="130" fill="none" stroke="#00D4FF" stroke-width="1" stroke-dasharray="14,10" opacity="0.6" />
    <!-- Middle Coordinate Ring -->
    <circle cx="0" cy="0" r="105" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.8" />
    <!-- Ticks on Ring -->
    <line x1="0" y1="-105" x2="0" y2="-95" stroke="#00D4FF" stroke-width="2" />
    <line x1="0" y1="105" x2="0" y2="95" stroke="#00D4FF" stroke-width="2" />
    <line x1="-105" y1="0" x2="-95" y2="0" stroke="#00D4FF" stroke-width="2" />
    <line x1="105" y1="0" x2="95" y2="0" stroke="#00D4FF" stroke-width="2" />
    <!-- Inner Gyro Ring (Rotated Ellipse) -->
    <ellipse cx="0" cy="0" rx="85" ry="35" fill="none" stroke="#818cf8" stroke-width="1.5" transform="rotate(-30)" opacity="0.85" />
    <ellipse cx="0" cy="0" rx="85" ry="35" fill="none" stroke="#00D4FF" stroke-width="1.5" transform="rotate(30)" opacity="0.85" />
    
    <!-- Central Floating CPU Core Hologram (Isometric Prism) -->
    <g transform="translate(0, -10)">
      <!-- Top diamond facet -->
      <polygon points="0,-40 50,-15 0,10 -50,-15" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" />
      <!-- Left side facet -->
      <polygon points="-50,-15 0,10 0,55 -50,30" fill="#0369a1" stroke="#00D4FF" stroke-width="1.2" opacity="0.8" />
      <!-- Right side facet -->
      <polygon points="0,10 50,-15 50,30 0,55" fill="#075985" stroke="#00D4FF" stroke-width="1.2" opacity="0.8" />
      <!-- Core glowing nucleus -->
      <circle cx="0" cy="8" r="14" fill="#00D4FF" opacity="0.9" />
      <circle cx="0" cy="8" r="6" fill="#ffffff" />
    </g>
  </g>

  <!-- Left Side: Data Telemetry Oscilloscope Screen -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="180" height="150" rx="10" fill="#091124" stroke="#1e293b" stroke-width="2" />
    <rect x="8" y="8" width="164" height="134" rx="6" fill="#020617" stroke="#00D4FF" stroke-width="0.8" opacity="0.8" />
    <!-- Header -->
    <text x="18" y="26" font-family="'Inter', monospace" font-size="9" font-weight="700" fill="#00D4FF">VIRTUAL LAB · CH1</text>
    <circle cx="152" cy="23" r="3.5" fill="#10b981" />
    <!-- Sine / Digital Waveform -->
    <path d="M 18,75 Q 35,35 55,75 T 95,75 T 135,75 T 155,75" fill="none" stroke="#10b981" stroke-width="2" filter="url(#laser-glow)" />
    <path d="M 18,105 L 45,105 L 45,85 L 75,85 L 75,105 L 105,105 L 105,85 L 135,85 L 135,105 L 155,105" fill="none" stroke="#00D4FF" stroke-width="1.5" />
    <!-- Data readout -->
    <text x="18" y="130" font-family="monospace" font-size="8" fill="#94a3b8">CLK: 4.80 GHz · 8-BIT OK</text>
  </g>

  <!-- Right Side: Server Rack & Binary Memory Tower -->
  <g transform="translate(560, 90)">
    <rect x="0" y="0" width="180" height="180" rx="10" fill="#091124" stroke="#1e293b" stroke-width="2" />
    <rect x="8" y="8" width="164" height="164" rx="6" fill="#020617" stroke="#818cf8" stroke-width="0.8" />
    <text x="18" y="26" font-family="'Inter', monospace" font-size="9" font-weight="700" fill="#818cf8">SYSTEM BUS · IO</text>
    
    <!-- Binary Stream Bars -->
    <g font-family="monospace" font-size="9" fill="#00D4FF">
      <text x="18" y="50">[1] 1 0 1 1 0 0 1 0</text>
      <text x="18" y="68">[2] 0 1 0 0 1 1 0 1</text>
      <text x="18" y="86">[3] 1 1 1 1 0 0 0 0</text>
      <text x="18" y="104">[4] 0 0 0 1 1 1 0 1</text>
      <text x="18" y="122">[5] 1 0 1 0 1 0 1 0</text>
    </g>
    <!-- Status LED Grid -->
    <g transform="translate(18, 140)">
      <circle cx="10" cy="5" r="4" fill="#10b981" />
      <circle cx="28" cy="5" r="4" fill="#10b981" />
      <circle cx="46" cy="5" r="4" fill="#f59e0b" />
      <circle cx="64" cy="5" r="4" fill="#00D4FF" />
      <circle cx="82" cy="5" r="4" fill="#10b981" />
      <circle cx="100" cy="5" r="4" fill="#818cf8" />
      <circle cx="118" cy="5" r="4" fill="#10b981" />
      <circle cx="136" cy="5" r="4" fill="#10b981" />
    </g>
  </g>

  <!-- Glowing Floating Particles -->
  <g fill="#00D4FF">
    <circle cx="280" cy="120" r="2.5" opacity="0.8" />
    <circle cx="320" cy="90" r="1.5" opacity="0.6" />
    <circle cx="500" cy="110" r="3" opacity="0.9" />
    <circle cx="530" cy="160" r="2" opacity="0.7" />
    <circle cx="250" cy="270" r="2" opacity="0.6" />
    <circle cx="530" cy="290" r="2.5" opacity="0.8" />
  </g>

  <!-- Bottom Floating Holographic Banner -->
  <g transform="translate(400, 395)" text-anchor="middle">
    <rect x="-180" y="-18" width="360" height="34" rx="17" fill="#091124" stroke="#00D4FF" stroke-width="1" opacity="0.9" />
    <text x="0" y="4" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="800" fill="#00D4FF" letter-spacing="2">
      🔬 LABORATORIUM MAYA INFORMATIKA
    </text>
  </g>
</svg>
