<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- PCB Substrate Gradient -->
    <linearGradient id="cpu-pcb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#083024" />
      <stop offset="50%" stop-color="#0b4333" />
      <stop offset="100%" stop-color="#05241b" />
    </linearGradient>

    <!-- Metal IHS Gradient -->
    <linearGradient id="cpu-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="35%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#f1f5f9" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- IHS Bevel Rim -->
    <linearGradient id="cpu-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.9" />
    </linearGradient>

    <!-- Gold Accent -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <filter id="cpu-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer Substrate PCB -->
  <g filter="url(#cpu-shadow)">
    <rect x="15" y="15" width="170" height="170" rx="10" fill="url(#cpu-pcb)" stroke="#10b981" stroke-width="1.5" />
    
    <!-- Gold edge contact notches -->
    <circle cx="15" cy="100" r="4" fill="#f59e0b" opacity="0.8" />
    <circle cx="185" cy="100" r="4" fill="#f59e0b" opacity="0.8" />

    <!-- Alignment Triangle (Pin 1 Indicator) -->
    <polygon points="20,175 35,175 20,160" fill="url(#gold-grad)" />

    <!-- Micro Capacitors & SMD Components around IHS -->
    <g fill="#94a3b8" stroke="#334155" stroke-width="0.5">
      <!-- Top edge SMDs -->
      <rect x="45" y="21" width="6" height="3" rx="0.5" fill="#f59e0b" />
      <rect x="55" y="21" width="6" height="3" rx="0.5" fill="#f59e0b" />
      <rect x="65" y="21" width="6" height="3" rx="0.5" />
      <rect x="130" y="21" width="6" height="3" rx="0.5" />
      <rect x="140" y="21" width="6" height="3" rx="0.5" fill="#f59e0b" />
      <!-- Bottom edge SMDs -->
      <rect x="60" y="176" width="6" height="3" rx="0.5" fill="#f59e0b" />
      <rect x="70" y="176" width="6" height="3" rx="0.5" />
      <rect x="120" y="176" width="6" height="3" rx="0.5" fill="#f59e0b" />
      <rect x="130" y="176" width="6" height="3" rx="0.5" />
    </g>

    <!-- Metallic Integrated Heat Spreader (IHS) -->
    <!-- Base plate -->
    <rect x="30" y="30" width="140" height="140" rx="8" fill="#475569" />
    <!-- Outer metal rim -->
    <rect x="32" y="32" width="136" height="136" rx="7" fill="url(#cpu-rim)" />
    <!-- Inner heat spreader surface -->
    <rect x="36" y="36" width="128" height="128" rx="5" fill="url(#cpu-metal)" stroke="#94a3b8" stroke-width="0.75" />

    <!-- Corner chamfers / heat spreader wings -->
    <path d="M 36,55 L 42,55 L 42,36" fill="none" stroke="#64748b" stroke-width="1.5" />
    <path d="M 164,55 L 158,55 L 158,36" fill="none" stroke="#64748b" stroke-width="1.5" />
    <path d="M 36,145 L 42,145 L 42,164" fill="none" stroke="#64748b" stroke-width="1.5" />
    <path d="M 164,145 L 158,145 L 158,164" fill="none" stroke="#64748b" stroke-width="1.5" />

    <!-- Laser Etched Typography -->
    <g font-family="'Inter', system-ui, sans-serif" fill="#334155" text-anchor="middle" font-weight="700">
      <text x="100" y="72" font-size="15" font-weight="900" letter-spacing="2" fill="#0284c7">PROCESSOR</text>
      
      <line x1="50" y1="84" x2="150" y2="84" stroke="#94a3b8" stroke-width="0.8" />

      <text x="100" y="98" font-size="8" font-weight="600" fill="#475569">OCTA-CORE · 3.60GHz</text>
      <text x="100" y="110" font-size="7.5" font-weight="600" fill="#64748b">8 CORES / 16 THREADS</text>
      <text x="100" y="122" font-size="7" font-weight="500" fill="#64748b">SOCKET LGA · 16MB CACHE</text>
      
      <!-- 2D DataMatrix barcode representation -->
      <g transform="translate(85, 134)" fill="#334155">
        <rect x="0" y="0" width="30" height="3" />
        <rect x="0" y="5" width="8" height="2" />
        <rect x="12" y="5" width="18" height="2" />
        <rect x="0" y="9" width="16" height="2" />
        <rect x="20" y="9" width="10" height="2" />
        <rect x="0" y="13" width="30" height="2" />
      </g>
      <text x="100" y="157" font-size="6" font-family="monospace" fill="#64748b">X329F81204</text>
    </g>
  </g>
</svg>
