<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="100%" height="100%">
  <defs>
    <linearGradient id="ssd-pcb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="ssd-chip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="ssd-controller" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <linearGradient id="ssd-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <filter id="ssd-shadow" x="-5%" y="-15%" width="115%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <g filter="url(#ssd-shadow)">
    <!-- Base PCB Board (2280 form factor: left side has screw notch, right side has gold pins) -->
    <!-- Semi-circular notch on left at x=10, cy=40, radius 7 -->
    <path d="M 10,15 
             L 255,15 
             L 255,27 L 258,29 L 258,51 L 255,53 L 255,65 
             L 10,65 
             L 10,47 A 7,7 0 0,0 10,33 Z" 
          fill="url(#ssd-pcb)" stroke="#0284c7" stroke-width="0.8" />

    <!-- Gold contact ring for screw hole on left -->
    <circle cx="10" cy="40" r="10" fill="none" stroke="url(#ssd-gold)" stroke-width="2.5" opacity="0.9" />

    <!-- Right-side M.2 M-Key Gold Connector Pins (x=258 to 270) -->
    <!-- Top pin bank -->
    <rect x="256" y="16" width="16" height="15" rx="1" fill="url(#ssd-gold)" />
    <!-- M-Key notch gap around y=31 to 38 -->
    <!-- Bottom pin bank -->
    <rect x="256" y="39" width="16" height="25" rx="1" fill="url(#ssd-gold)" />

    <!-- Gold pin strip dividing lines -->
    <g stroke="#78350f" stroke-width="0.7">
      <line x1="256" y1="20" x2="272" y2="20" /><line x1="256" y1="24" x2="272" y2="24" />
      <line x1="256" y1="28" x2="272" y2="28" />
      <line x1="256" y1="43" x2="272" y2="43" /><line x1="256" y1="47" x2="272" y2="47" />
      <line x1="256" y1="51" x2="272" y2="51" /><line x1="256" y1="55" x2="272" y2="55" />
      <line x1="256" y1="59" x2="272" y2="59" />
    </g>

    <!-- Copper Circuit Traces on PCB -->
    <g stroke="#0284c7" stroke-width="0.6" fill="none" opacity="0.4">
      <path d="M 30,22 L 80,22 L 90,32" />
      <path d="M 30,58 L 70,58 L 85,45" />
      <path d="M 140,20 L 170,20 L 180,30" />
      <path d="M 200,60 L 230,60 L 245,45" />
    </g>

    <!-- NAND Flash Chip 1 -->
    <rect x="30" y="20" width="55" height="40" rx="2" fill="url(#ssd-chip)" stroke="#475569" stroke-width="0.75" />
    <circle cx="36" cy="26" r="1.5" fill="#64748b" />
    <text x="57" y="38" font-family="monospace" font-size="5" fill="#94a3b8" text-anchor="middle">NAND FLASH</text>
    <text x="57" y="46" font-family="monospace" font-size="6" font-weight="700" fill="#cbd5e1" text-anchor="middle">256GB 3D</text>

    <!-- NAND Flash Chip 2 -->
    <rect x="95" y="20" width="55" height="40" rx="2" fill="url(#ssd-chip)" stroke="#475569" stroke-width="0.75" />
    <circle cx="101" cy="26" r="1.5" fill="#64748b" />
    <text x="122" y="38" font-family="monospace" font-size="5" fill="#94a3b8" text-anchor="middle">NAND FLASH</text>
    <text x="122" y="46" font-family="monospace" font-size="6" font-weight="700" fill="#cbd5e1" text-anchor="middle">256GB 3D</text>

    <!-- DRAM Cache Chip -->
    <rect x="160" y="22" width="22" height="36" rx="1.5" fill="#1e293b" stroke="#475569" stroke-width="0.6" />
    <text x="171" y="42" font-family="monospace" font-size="4" fill="#64748b" text-anchor="middle" transform="rotate(-90 171 42)">512MB</text>

    <!-- Controller Chip (Silver Heatspreader on Controller) -->
    <rect x="192" y="20" width="44" height="40" rx="2" fill="url(#ssd-controller)" stroke="#cbd5e1" stroke-width="0.8" />
    <text x="214" y="34" font-family="'Inter', sans-serif" font-size="5.5" font-weight="800" fill="#0f172a" text-anchor="middle">PHISON</text>
    <text x="214" y="42" font-family="monospace" font-size="5" font-weight="700" fill="#0369a1" text-anchor="middle">PS5018-E18</text>
    <text x="214" y="50" font-family="monospace" font-size="4.5" fill="#334155" text-anchor="middle">PCIe Gen4x4</text>

    <!-- Brand Typography Header Bar -->
    <rect x="30" y="61" width="206" height="3" fill="#0284c7" />
    <text x="130" y="11" font-family="'Inter', sans-serif" font-size="7" font-weight="800" fill="#00D4FF" text-anchor="middle" letter-spacing="1">
      NVMe M.2 SSD 512GB · 7000 MB/s
    </text>
  </g>
</svg>
