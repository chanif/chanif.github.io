<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="hdd-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="hdd-cover" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="hdd-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <g filter="url(#hdd-shadow)">
    <!-- 3.5 Inch Metal Outer Frame -->
    <rect x="15" y="10" width="170" height="220" rx="8" fill="url(#hdd-body)" stroke="#64748b" stroke-width="1.5" />
    
    <!-- Top Metal Platter Shield Plate -->
    <rect x="22" y="18" width="156" height="155" rx="6" fill="url(#hdd-cover)" stroke="#94a3b8" stroke-width="1" />
    
    <!-- Round Platter Outline Indicator -->
    <circle cx="100" cy="88" r="54" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5" />
    <circle cx="100" cy="88" r="16" fill="#64748b" stroke="#475569" stroke-width="1" />
    <circle cx="100" cy="88" r="6" fill="#334155" />

    <!-- Label Sticker -->
    <rect x="30" y="70" width="140" height="85" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.75" />
    <text x="36" y="85" font-family="sans-serif" font-size="9" font-weight="900" fill="#dc2626">HARD DISK 3.5" IDE PATA</text>
    <text x="36" y="98" font-family="monospace" font-size="7" font-weight="bold" fill="#334155">CAP: 80 GB · 7200 RPM</text>
    <text x="36" y="109" font-family="sans-serif" font-size="6.5" fill="#64748b">PORT: 40-PIN PARALLEL ATA</text>
    <rect x="36" y="116" width="128" height="14" rx="2" fill="#fef2f2" stroke="#f87171" stroke-width="0.5" />
    <text x="100" y="126" text-anchor="middle" font-family="sans-serif" font-size="6.5" font-weight="bold" fill="#dc2626">⚠️ BUKAN SOKET M.2 NVMe!</text>

    <!-- Bottom Vintage Connector Header (Wide 40-pin PATA Ribbon Header + 4-pin Molex) -->
    <rect x="24" y="185" width="152" height="38" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
    
    <!-- 40 Pin IDE Dual-Row Header -->
    <rect x="30" y="192" width="95" height="24" rx="2" fill="#1e293b" stroke="#475569" stroke-width="0.75" />
    <!-- 2 rows of tiny gold pins -->
    <g fill="#f59e0b">
      <circle cx="36" cy="198" r="1.5" /><circle cx="43" cy="198" r="1.5" /><circle cx="50" cy="198" r="1.5" />
      <circle cx="57" cy="198" r="1.5" /><circle cx="64" cy="198" r="1.5" /><circle cx="71" cy="198" r="1.5" />
      <circle cx="78" cy="198" r="1.5" /><circle cx="85" cy="198" r="1.5" /><circle cx="92" cy="198" r="1.5" />
      <circle cx="99" cy="198" r="1.5" /><circle cx="106" cy="198" r="1.5" /><circle cx="113" cy="198" r="1.5" />
      <circle cx="36" cy="208" r="1.5" /><circle cx="43" cy="208" r="1.5" /><circle cx="50" cy="208" r="1.5" />
      <circle cx="57" cy="208" r="1.5" /><circle cx="64" cy="208" r="1.5" /><circle cx="71" cy="208" r="1.5" />
      <circle cx="78" cy="208" r="1.5" /><circle cx="85" cy="208" r="1.5" /><circle cx="92" cy="208" r="1.5" />
      <circle cx="99" cy="208" r="1.5" /><circle cx="106" cy="208" r="1.5" /><circle cx="113" cy="208" r="1.5" />
    </g>
    <text x="77" y="214" text-anchor="middle" font-family="monospace" font-size="5" fill="#94a3b8">40-PIN PATA</text>

    <!-- Molex 4-Pin Power Header -->
    <rect x="135" y="192" width="36" height="24" rx="2" fill="#1e293b" stroke="#475569" stroke-width="0.75" />
    <circle cx="142" cy="204" r="2.5" fill="#e2e8f0" />
    <circle cx="149" cy="204" r="2.5" fill="#e2e8f0" />
    <circle cx="156" cy="204" r="2.5" fill="#e2e8f0" />
    <circle cx="163" cy="204" r="2.5" fill="#e2e8f0" />
  </g>
</svg>
