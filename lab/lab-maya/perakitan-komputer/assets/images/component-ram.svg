<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 90" width="100%" height="100%">
  <defs>
    <!-- Heatspreader Gradient -->
    <linearGradient id="ram-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Metal Armor Plate -->
    <linearGradient id="ram-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- RGB Lightbar Gradient -->
    <linearGradient id="ram-rgb" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="25%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="75%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#00D4FF" />
    </linearGradient>

    <!-- Gold Pins -->
    <linearGradient id="ram-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <filter id="ram-glow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <g filter="url(#ram-glow)">
    <!-- Base PCB Board -->
    <!-- Note the side latch notches and bottom gold connector with DDR key notch at x=135 -->
    <path d="M 10,20 
             L 10,35 L 7,37 L 7,55 L 10,57 L 10,75 
             L 130,75 L 133,70 L 142,70 L 145,75 
             L 330,75 L 330,57 L 333,55 L 333,37 L 330,35 L 330,20 Z" 
          fill="#0f172a" stroke="#00D4FF" stroke-width="0.75" />

    <!-- Gold Edge Connector Contact Pins -->
    <!-- Left bank: x=12 to 128 (width ~116) -->
    <path d="M 12,71 L 129,71 L 129,75 L 12,75 Z" fill="url(#ram-gold)" />
    <!-- DDR Notch gap at 130..144 -->
    <!-- Right bank: x=146 to 328 -->
    <path d="M 146,71 L 328,71 L 328,75 L 146,75 Z" fill="url(#ram-gold)" />

    <!-- Individual pin divider lines -->
    <g stroke="#78350f" stroke-width="0.8" opacity="0.7">
      <!-- Sampling of vertical pin lines -->
      <line x1="20" y1="71" x2="20" y2="75" /><line x1="28" y1="71" x2="28" y2="75" />
      <line x1="36" y1="71" x2="36" y2="75" /><line x1="44" y1="71" x2="44" y2="75" />
      <line x1="52" y1="71" x2="52" y2="75" /><line x1="60" y1="71" x2="60" y2="75" />
      <line x1="68" y1="71" x2="68" y2="75" /><line x1="76" y1="71" x2="76" y2="75" />
      <line x1="84" y1="71" x2="84" y2="75" /><line x1="92" y1="71" x2="92" y2="75" />
      <line x1="100" y1="71" x2="100" y2="75" /><line x1="108" y1="71" x2="108" y2="75" />
      <line x1="116" y1="71" x2="116" y2="75" /><line x1="124" y1="71" x2="124" y2="75" />

      <line x1="154" y1="71" x2="154" y2="75" /><line x1="164" y1="71" x2="164" y2="75" />
      <line x1="174" y1="71" x2="174" y2="75" /><line x1="184" y1="71" x2="184" y2="75" />
      <line x1="194" y1="71" x2="194" y2="75" /><line x1="204" y1="71" x2="204" y2="75" />
      <line x1="214" y1="71" x2="214" y2="75" /><line x1="224" y1="71" x2="224" y2="75" />
      <line x1="234" y1="71" x2="234" y2="75" /><line x1="244" y1="71" x2="244" y2="75" />
      <line x1="254" y1="71" x2="254" y2="75" /><line x1="264" y1="71" x2="264" y2="75" />
      <line x1="274" y1="71" x2="274" y2="75" /><line x1="284" y1="71" x2="284" y2="75" />
      <line x1="294" y1="71" x2="294" y2="75" /><line x1="304" y1="71" x2="304" y2="75" />
      <line x1="314" y1="71" x2="314" y2="75" /><line x1="322" y1="71" x2="322" y2="75" />
    </g>

    <!-- Aluminum Heatspreader Body -->
    <path d="M 12,14 L 328,14 L 328,68 L 12,68 Z" fill="url(#ram-body)" stroke="#334155" stroke-width="1" />

    <!-- Stylized Geometric Armor Facets -->
    <polygon points="20,18 90,18 105,45 35,45" fill="url(#ram-metal)" opacity="0.8" />
    <polygon points="115,18 185,18 200,45 130,45" fill="url(#ram-metal)" opacity="0.8" />
    <polygon points="210,18 280,18 295,45 225,45" fill="url(#ram-metal)" opacity="0.8" />

    <!-- Triangular Cooling Vents -->
    <g fill="#020617">
      <polygon points="45,22 55,22 50,30" />
      <polygon points="65,22 75,22 70,30" />
      <polygon points="140,22 150,22 145,30" />
      <polygon points="160,22 170,22 165,30" />
      <polygon points="235,22 245,22 240,30" />
      <polygon points="255,22 265,22 260,30" />
    </g>

    <!-- Top RGB Lightbar Diffuser -->
    <rect x="14" y="6" width="312" height="9" rx="3" fill="url(#ram-rgb)" opacity="0.95" />
    <!-- Diffuser Frost Highlights -->
    <rect x="18" y="7" width="304" height="3" rx="1.5" fill="#ffffff" opacity="0.6" />

    <!-- Label / Typography -->
    <rect x="85" y="48" width="170" height="17" rx="3" fill="#020617" stroke="#334155" stroke-width="0.8" />
    <g font-family="'Inter', system-ui, sans-serif" fill="#f8fafc" text-anchor="middle">
      <text x="170" y="59" font-size="8.5" font-weight="800" letter-spacing="1">
        <tspan fill="#00D4FF">FANANI</tspan> HYPER-X · 8GB DDR4
      </text>
      <text x="170" y="63" font-size="5" fill="#94a3b8" letter-spacing="0.5">3200MHz · CL16 · 1.35V · 8-BIT BYTE BUS</text>
    </g>
  </g>
</svg>
