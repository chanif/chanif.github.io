<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540" width="100%" height="100%">
  <defs>
    <!-- PCB Base Gradient -->
    <linearGradient id="mb-pcb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d" />
      <stop offset="50%" stop-color="#070c16" />
      <stop offset="100%" stop-color="#040810" />
    </linearGradient>

    <!-- Heatsink Brushed Aluminum -->
    <linearGradient id="mb-heatsink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="25%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="75%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- PCIe Metal Shield -->
    <linearGradient id="mb-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Gold Pin / Solder Gradient -->
    <linearGradient id="mb-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <filter id="mb-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <pattern id="pcb-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#1e293b" opacity="0.6" />
    </pattern>
  </defs>

  <g filter="url(#mb-glow)">
    <!-- ATX PCB Board Foundation -->
    <rect x="15" y="15" width="650" height="510" rx="14" fill="url(#mb-pcb)" stroke="#00D4FF" stroke-width="1.5" />
    <rect x="15" y="15" width="650" height="510" rx="14" fill="url(#pcb-grid)" />

    <!-- Corner Mounting Screw Holes (ATX standard 9 holes) -->
    <g fill="#020617" stroke="#f59e0b" stroke-width="2">
      <circle cx="35" cy="35" r="7" /><circle cx="340" cy="35" r="7" /><circle cx="645" cy="35" r="7" />
      <circle cx="35" cy="270" r="7" /><circle cx="340" cy="270" r="7" /><circle cx="645" cy="270" r="7" />
      <circle cx="35" cy="505" r="7" /><circle cx="340" cy="505" r="7" /><circle cx="645" cy="505" r="7" />
    </g>

    <!-- PCB Circuit Bus Lines (Cyan and Gold Traces) -->
    <g stroke="#00D4FF" stroke-width="1" fill="none" opacity="0.3" stroke-linecap="round">
      <!-- Bus: CPU to RAM -->
      <path d="M 230,100 L 290,100" />
      <path d="M 230,115 L 290,115" />
      <path d="M 230,130 L 290,130" />
      <path d="M 230,145 L 290,145" />
      <path d="M 230,160 L 290,160" />
      <path d="M 230,175 L 290,175" />

      <!-- Bus: CPU to PCIe GPU -->
      <path d="M 160,200 L 160,300" />
      <path d="M 175,200 L 175,300" />
      <path d="M 190,200 L 190,300" />
      <path d="M 205,200 L 205,300" />

      <!-- Bus: CPU to M.2 Storage -->
      <path d="M 190,210 L 220,230 L 270,230" />
      <path d="M 190,218 L 220,238 L 270,238" />

      <!-- Bus: Chipset to SATA / Headers -->
      <path d="M 520,380 L 520,440 L 580,440" />
      <path d="M 500,380 L 500,455 L 580,455" />
      <path d="M 480,380 L 480,470 L 580,470" />
    </g>

    <!-- Amber Power Flow Traces (PSU Header to VRMs) -->
    <g stroke="#f59e0b" stroke-width="1.2" fill="none" opacity="0.35">
      <path d="M 590,120 L 450,120 L 400,65 L 200,65" />
      <path d="M 590,135 L 450,135 L 390,75 L 200,75" />
      <path d="M 590,150 L 470,150 L 470,300 L 410,320" />
    </g>

    <!-- Isolated Audio Guard Line (Bottom Left) -->
    <path d="M 30,370 L 95,370 L 95,510" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="3,3" fill="none" opacity="0.8" />
    <text x="60" y="385" font-family="'Inter', sans-serif" font-size="6" font-weight="700" fill="#f59e0b" opacity="0.9">AUDIO BOOST HD</text>
    <!-- 4 Golden Audio Capacitors -->
    <circle cx="50" cy="410" r="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="75" cy="410" r="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="50" cy="440" r="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="75" cy="440" r="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />

    <!-- REAR I/O SHIELD (Far Left: x=20, y=40, width=45, height=220) -->
    <rect x="22" y="45" width="46" height="210" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="45" y="60" font-family="'Inter', sans-serif" font-size="6" font-weight="800" fill="#94a3b8" text-anchor="middle">REAR I/O</text>
    <!-- Display & USB Ports Stack -->
    <rect x="28" y="70" width="34" height="20" rx="2" fill="#020617" stroke="#38bdf8" stroke-width="0.8" />
    <rect x="28" y="98" width="34" height="24" rx="2" fill="#020617" stroke="#38bdf8" stroke-width="0.8" />
    <rect x="28" y="130" width="34" height="24" rx="2" fill="#020617" stroke="#ef4444" stroke-width="0.8" />
    <rect x="28" y="162" width="34" height="30" rx="2" fill="#020617" stroke="#475569" stroke-width="0.8" />
    <rect x="28" y="200" width="34" height="35" rx="2" fill="#020617" stroke="#f59e0b" stroke-width="0.8" />

    <!-- TOP VRM HEATSINK (Above CPU: x=80, y=35, width=140, height=40) -->
    <rect x="80" y="35" width="135" height="36" rx="4" fill="url(#mb-heatsink)" stroke="#64748b" stroke-width="1" />
    <!-- Cooling Fins Grooves -->
    <line x1="95" y1="35" x2="95" y2="71" stroke="#0f172a" stroke-width="2" />
    <line x1="110" y1="35" x2="110" y2="71" stroke="#0f172a" stroke-width="2" />
    <line x1="125" y1="35" x2="125" y2="71" stroke="#0f172a" stroke-width="2" />
    <line x1="140" y1="35" x2="140" y2="71" stroke="#0f172a" stroke-width="2" />
    <line x1="155" y1="35" x2="155" y2="71" stroke="#0f172a" stroke-width="2" />
    <line x1="170" y1="35" x2="170" y2="71" stroke="#0f172a" stroke-width="2" />
    <line x1="185" y1="35" x2="185" y2="71" stroke="#0f172a" stroke-width="2" />
    <line x1="200" y1="35" x2="200" y2="71" stroke="#0f172a" stroke-width="2" />

    <!-- LEFT VRM HEATSINK (Left of CPU: x=75, y=75, width=32, height=115) -->
    <rect x="75" y="80" width="30" height="110" rx="4" fill="url(#mb-heatsink)" stroke="#64748b" stroke-width="1" />
    <line x1="75" y1="95" x2="105" y2="95" stroke="#0f172a" stroke-width="2" />
    <line x1="75" y1="110" x2="105" y2="110" stroke="#0f172a" stroke-width="2" />
    <line x1="75" y1="125" x2="105" y2="125" stroke="#0f172a" stroke-width="2" />
    <line x1="75" y1="140" x2="105" y2="140" stroke="#0f172a" stroke-width="2" />
    <line x1="75" y1="155" x2="105" y2="155" stroke="#0f172a" stroke-width="2" />
    <line x1="75" y1="170" x2="105" y2="170" stroke="#0f172a" stroke-width="2" />

    <!-- Black Solid Capacitors array around VRM -->
    <g fill="#1e293b" stroke="#cbd5e1" stroke-width="1">
      <circle cx="118" cy="82" r="5" /><circle cx="132" cy="82" r="5" /><circle cx="146" cy="82" r="5" />
      <circle cx="160" cy="82" r="5" /><circle cx="174" cy="82" r="5" /><circle cx="188" cy="82" r="5" />
      <circle cx="118" cy="100" r="5" /><circle cx="118" cy="115" r="5" /><circle cx="118" cy="130" r="5" />
      <circle cx="118" cy="145" r="5" /><circle cx="118" cy="160" r="5" /><circle cx="118" cy="175" r="5" />
    </g>

    <!-- ================= 1. CPU SOCKET (LGA 1700) ================= -->
    <!-- Socket Frame: x=128, y=95, width=100, height=100 -->
    <g id="mb-cpu-socket-area">
      <!-- Metal Bracket outer frame -->
      <rect x="128" y="95" width="102" height="102" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="2" />
      <!-- Socket inner bed -->
      <rect x="134" y="101" width="90" height="90" rx="3" fill="#020617" stroke="#475569" stroke-width="1" />
      
      <!-- Pin Array Texture (Dense golden microdots) -->
      <rect x="140" y="107" width="78" height="78" fill="#0f172a" stroke="#f59e0b" stroke-dasharray="2,2" stroke-width="0.8" opacity="0.8" />
      <text x="179" y="150" font-family="'Inter', sans-serif" font-size="7.5" font-weight="800" fill="#00D4FF" text-anchor="middle" letter-spacing="1">
        LGA 1700
      </text>

      <!-- Metal Load Lever Arm -->
      <rect x="123" y="98" width="4" height="96" rx="2" fill="#cbd5e1" stroke="#64748b" stroke-width="0.8" />
      <circle cx="125" cy="190" r="5" fill="#94a3b8" />
      <path d="M 125,190 L 118,198" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- ================= 2. RAM SLOTS (DIMM A1 / B1) ================= -->
    <!-- RAM Slot 1: x=280, y=55, width=16, height=180 -->
    <!-- RAM Slot 2: x=305, y=55, width=16, height=180 -->
    <g id="mb-ram-slots-area">
      <!-- Slot 1 -->
      <rect x="278" y="55" width="16" height="180" rx="2" fill="#020617" stroke="#38bdf8" stroke-width="1" />
      <!-- Gold contact strip inside slot -->
      <line x1="286" y1="65" x2="286" y2="135" stroke="#f59e0b" stroke-width="2" />
      <!-- Key notch separator -->
      <rect x="282" y="137" width="8" height="4" fill="#020617" />
      <line x1="286" y1="143" x2="286" y2="225" stroke="#f59e0b" stroke-width="2" />
      <!-- Top and Bottom Retention Clips -->
      <rect x="276" y="48" width="20" height="8" rx="2" fill="#cbd5e1" stroke="#475569" stroke-width="0.8" />
      <rect x="276" y="234" width="20" height="8" rx="2" fill="#cbd5e1" stroke="#475569" stroke-width="0.8" />

      <!-- Slot 2 -->
      <rect x="303" y="55" width="16" height="180" rx="2" fill="#020617" stroke="#00D4FF" stroke-width="1.2" />
      <line x1="311" y1="65" x2="311" y2="135" stroke="#f59e0b" stroke-width="2" />
      <rect x="307" y="137" width="8" height="4" fill="#020617" />
      <line x1="311" y1="143" x2="311" y2="225" stroke="#f59e0b" stroke-width="2" />
      <rect x="301" y="48" width="20" height="8" rx="2" fill="#cbd5e1" stroke="#475569" stroke-width="0.8" />
      <rect x="301" y="234" width="20" height="8" rx="2" fill="#cbd5e1" stroke="#475569" stroke-width="0.8" />

      <text x="296" y="42" font-family="'Inter', sans-serif" font-size="6.5" font-weight="700" fill="#38bdf8" text-anchor="middle">
        DDR4 DIMM_1 · 2
      </text>
    </g>

    <!-- ================= 3. 24-PIN ATX POWER HEADER (PSU) ================= -->
    <!-- Located on Right Edge: x=605, y=95, width=32, height=130 -->
    <g id="mb-psu-header-area">
      <rect x="605" y="95" width="34" height="135" rx="3" fill="#020617" stroke="#ef4444" stroke-width="1.5" />
      <text x="622" y="88" font-family="'Inter', sans-serif" font-size="6.5" font-weight="800" fill="#ef4444" text-anchor="middle">
        ATX 24P
      </text>
      <!-- 2x12 Pin Grid -->
      <g fill="#f59e0b" stroke="#78350f" stroke-width="0.5">
        <!-- Col 1 -->
        <rect x="610" y="102" width="8" height="7" rx="1" /><rect x="610" y="112" width="8" height="7" rx="1" />
        <rect x="610" y="122" width="8" height="7" rx="1" /><rect x="610" y="132" width="8" height="7" rx="1" />
        <rect x="610" y="142" width="8" height="7" rx="1" /><rect x="610" y="152" width="8" height="7" rx="1" />
        <rect x="610" y="162" width="8" height="7" rx="1" /><rect x="610" y="172" width="8" height="7" rx="1" />
        <rect x="610" y="182" width="8" height="7" rx="1" /><rect x="610" y="192" width="8" height="7" rx="1" />
        <rect x="610" y="202" width="8" height="7" rx="1" /><rect x="610" y="212" width="8" height="7" rx="1" />
        <!-- Col 2 -->
        <rect x="624" y="102" width="8" height="7" rx="1" /><rect x="624" y="112" width="8" height="7" rx="1" />
        <rect x="624" y="122" width="8" height="7" rx="1" /><rect x="624" y="132" width="8" height="7" rx="1" />
        <rect x="624" y="142" width="8" height="7" rx="1" /><rect x="624" y="152" width="8" height="7" rx="1" />
        <rect x="624" y="162" width="8" height="7" rx="1" /><rect x="624" y="172" width="8" height="7" rx="1" />
        <rect x="624" y="182" width="8" height="7" rx="1" /><rect x="624" y="192" width="8" height="7" rx="1" />
        <rect x="624" y="202" width="8" height="7" rx="1" /><rect x="624" y="212" width="8" height="7" rx="1" />
      </g>
    </g>

    <!-- ================= 4. M.2 NVMe SSD SLOT ================= -->
    <!-- Located Below CPU: x=115, y=225, width=175, height=36 -->
    <g id="mb-m2-slot-area">
      <!-- M.2 Slot Connector Block on Right: x=270, y=228, width=20, height=30 -->
      <rect x="270" y="228" width="20" height="30" rx="2" fill="#020617" stroke="#f59e0b" stroke-width="1.2" />
      <line x1="274" y1="233" x2="274" y2="253" stroke="#f59e0b" stroke-width="1.5" />
      <line x1="278" y1="233" x2="278" y2="253" stroke="#f59e0b" stroke-width="1.5" />

      <!-- M.2 Slot Bed / Heatsink Standoff: x=115 to 268 -->
      <rect x="115" y="228" width="153" height="30" rx="2" fill="#0f172a" stroke="#334155" stroke-width="0.8" stroke-dasharray="3,3" />
      
      <!-- Standoff Screw Nut at 2280 position (x=122, cy=243) -->
      <circle cx="122" cy="243" r="6" fill="#f59e0b" stroke="#78350f" stroke-width="1" />
      <circle cx="122" cy="243" r="2.5" fill="#020617" />

      <text x="195" y="246" font-family="'Inter', sans-serif" font-size="6.5" font-weight="700" fill="#00D4FF" text-anchor="middle">
        M.2 PCIe 4.0 x4 (2280)
      </text>
    </g>

    <!-- ================= 5. PCIe x16 GPU EXPANSION SLOT ================= -->
    <!-- Located Below M.2: x=90, y=285, width=330, height=32 -->
    <g id="mb-pcie-slot-area">
      <!-- Reinforced Steel Armor Casing -->
      <rect x="90" y="285" width="330" height="32" rx="3" fill="url(#mb-metal)" stroke="#ffffff" stroke-width="0.8" />
      
      <!-- Inner Slot Trench -->
      <rect x="98" y="292" width="300" height="18" rx="1.5" fill="#020617" />
      
      <!-- Gold Pins inside slot with key partition at x=135 -->
      <!-- Section 1 (short): x=102 to 132 -->
      <line x1="102" y1="301" x2="132" y2="301" stroke="#f59e0b" stroke-width="3" />
      <!-- Notch Divider -->
      <rect x="133" y="292" width="5" height="18" fill="#475569" />
      <!-- Section 2 (long): x=139 to 395 -->
      <line x1="139" y1="301" x2="395" y2="301" stroke="#f59e0b" stroke-width="3" />

      <!-- PCIe Release Clip on Right End (x=405, y=287) -->
      <rect x="402" y="287" width="16" height="28" rx="2" fill="#cbd5e1" stroke="#475569" stroke-width="1" />
      <circle cx="410" cy="301" r="3" fill="#0284c7" />

      <text x="250" y="278" font-family="'Inter', sans-serif" font-size="7" font-weight="800" fill="#7C3AED" text-anchor="middle" letter-spacing="1">
        PCIe 5.0 x16 (STEEL ARMOR · GPU)
      </text>
    </g>

    <!-- Secondary PCIe x1 Slot below -->
    <g opacity="0.6">
      <rect x="90" y="340" width="120" height="18" rx="2" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <line x1="95" y1="349" x2="205" y2="349" stroke="#f59e0b" stroke-width="1.5" />
      <text x="150" y="368" font-family="'Inter', sans-serif" font-size="5" fill="#64748b" text-anchor="middle">PCIe x1</text>
    </g>

    <!-- SOUTHBRIDGE / CHIPSET HEATSINK (Bottom Right: x=460, y=280, width=150, height=130) -->
    <rect x="460" y="280" width="150" height="130" rx="8" fill="url(#mb-heatsink)" stroke="#00D4FF" stroke-width="1.2" />
    <polygon points="465,285 605,285 580,335 465,335" fill="#0f172a" opacity="0.6" />
    <!-- Chipset Glowing Brand Emblem -->
    <g transform="translate(535, 345)">
      <circle cx="0" cy="0" r="26" fill="#020617" stroke="#00D4FF" stroke-width="1.5" />
      <polygon points="0,-18 16,-9 16,9 0,18 -16,9 -16,-9" fill="none" stroke="#00D4FF" stroke-width="1.5" />
      <text x="0" y="-1" font-family="'Inter', sans-serif" font-size="7" font-weight="900" fill="#00D4FF" text-anchor="middle">ATX</text>
      <text x="0" y="8" font-family="'Inter', sans-serif" font-size="5" font-weight="700" fill="#38bdf8" text-anchor="middle">CHIPSET</text>
    </g>
    <text x="535" y="398" font-family="'Inter', sans-serif" font-size="6.5" font-weight="800" fill="#94a3b8" text-anchor="middle" letter-spacing="1">
      MOTHERBOARD ATX PRO
    </text>

    <!-- SATA 6Gb/s Ports (Far Right Bottom) -->
    <rect x="625" y="320" width="22" height="40" rx="2" fill="#020617" stroke="#475569" stroke-width="0.8" />
    <rect x="625" y="370" width="22" height="40" rx="2" fill="#020617" stroke="#475569" stroke-width="0.8" />
    <text x="636" y="315" font-family="'Inter', sans-serif" font-size="5" fill="#94a3b8" text-anchor="middle">SATA</text>

    <!-- ================= 6. POST DEBUG LED CLUSTER ================= -->
    <!-- Located at Top-Right (x=500, y=45) -->
    <g id="mb-debug-leds" transform="translate(480, 40)">
      <rect x="0" y="0" width="130" height="28" rx="4" fill="#020617" stroke="#475569" stroke-width="1" />
      <text x="65" y="9" font-family="'Inter', sans-serif" font-size="5.5" font-weight="800" fill="#94a3b8" text-anchor="middle">
        EZ DEBUG LED · POST
      </text>

      <!-- LED 1: CPU -->
      <g transform="translate(18, 18)">
        <circle id="led-cpu-bulb" cx="0" cy="0" r="3.5" fill="#ef4444" opacity="0.3" stroke="#7f1d1d" stroke-width="0.5" />
        <text x="0" y="7" font-family="'Inter', sans-serif" font-size="4.5" font-weight="700" fill="#94a3b8" text-anchor="middle">CPU</text>
      </g>

      <!-- LED 2: DRAM (RAM) -->
      <g transform="translate(48, 18)">
        <circle id="led-dram-bulb" cx="0" cy="0" r="3.5" fill="#f59e0b" opacity="0.3" stroke="#78350f" stroke-width="0.5" />
        <text x="0" y="7" font-family="'Inter', sans-serif" font-size="4.5" font-weight="700" fill="#94a3b8" text-anchor="middle">DRAM</text>
      </g>

      <!-- LED 3: VGA (GPU) -->
      <g transform="translate(78, 18)">
        <circle id="led-vga-bulb" cx="0" cy="0" r="3.5" fill="#38bdf8" opacity="0.3" stroke="#0369a1" stroke-width="0.5" />
        <text x="0" y="7" font-family="'Inter', sans-serif" font-size="4.5" font-weight="700" fill="#94a3b8" text-anchor="middle">VGA</text>
      </g>

      <!-- LED 4: BOOT -->
      <g transform="translate(108, 18)">
        <circle id="led-boot-bulb" cx="0" cy="0" r="3.5" fill="#10b981" opacity="0.3" stroke="#064e3b" stroke-width="0.5" />
        <text x="0" y="7" font-family="'Inter', sans-serif" font-size="4.5" font-weight="700" fill="#94a3b8" text-anchor="middle">BOOT</text>
      </g>
    </g>

    <!-- Front Panel Connectors & Headers along Bottom Edge -->
    <g fill="#1e293b" stroke="#334155" stroke-width="0.8">
      <rect x="120" y="495" width="40" height="15" rx="1" />
      <text x="140" y="490" font-family="'Inter', sans-serif" font-size="5" fill="#64748b" text-anchor="middle">USB 2.0</text>
      <rect x="175" y="495" width="45" height="15" rx="1" />
      <text x="197" y="490" font-family="'Inter', sans-serif" font-size="5" fill="#64748b" text-anchor="middle">USB 3.2</text>
      <rect x="235" y="495" width="35" height="15" rx="1" />
      <text x="252" y="490" font-family="'Inter', sans-serif" font-size="5" fill="#64748b" text-anchor="middle">FAN_1</text>
      <rect x="480" y="495" width="55" height="15" rx="1" />
      <text x="507" y="490" font-family="'Inter', sans-serif" font-size="5" fill="#64748b" text-anchor="middle">F_PANEL</text>
    </g>

    <!-- Silk-Screen Main Branding (Central Motherboard Model) -->
    <text x="250" y="380" font-family="'Inter', sans-serif" font-size="11" font-weight="900" fill="#00D4FF" letter-spacing="2" opacity="0.85">
      MOTHERBOARD ATX PRO EDITION
    </text>
    <text x="250" y="393" font-family="'Inter', sans-serif" font-size="6.5" font-weight="600" fill="#64748b" letter-spacing="0.5">
      ATX FORM FACTOR · VRM 16+1+1 PHASES · PCIE 5.0 READY · DDR4 5333MHz (OC)
    </text>
    <text x="250" y="408" font-family="'Space Mono', monospace" font-size="8.5" font-weight="700" fill="#38bdf8" letter-spacing="1" opacity="0.95">
      PCB REVISION 2.4 · fanani.my.id
    </text>
  </g>
</svg>
