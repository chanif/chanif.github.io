<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 170" width="100%" height="100%">
  <defs>
    <!-- Black Molded Nylon Connector Housing -->
    <linearGradient id="psu-plug-mat" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="25%" stop-color="#1e293b" />
      <stop offset="65%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Gold Contact Terminals inside Socket Sockets -->
    <linearGradient id="psu-pin-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <filter id="psu-plug-shadow" x="-15%" y="-10%" width="130%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <g filter="url(#psu-plug-shadow)">
    <!-- Thick Individually Sleeved Power Cables Sweeping Out to Right Edge -->
    <g stroke-linecap="round" fill="none">
      <!-- 12 Individual Braided Sleeved Wires (Authentic ATX 24P Pinout Colors) -->
      <!-- Wire 1 & 2: Orange +3.3V (Top) -->
      <path d="M 38,18 C 58,18 78,14 100,10" stroke="#f97316" stroke-width="3.2" />
      <path d="M 38,30 C 58,30 78,26 100,24" stroke="#f97316" stroke-width="3.2" />
      
      <!-- Wire 3 & 4: Red +5V -->
      <path d="M 38,42 C 60,42 80,40 100,38" stroke="#ef4444" stroke-width="3.2" />
      <path d="M 38,54 C 60,54 80,53 100,52" stroke="#ef4444" stroke-width="3.2" />
      
      <!-- Wire 5 & 6: Yellow +12V -->
      <path d="M 38,66 C 62,66 82,66 100,66" stroke="#eab308" stroke-width="3.2" />
      <path d="M 38,78 C 62,78 82,79 100,80" stroke="#eab308" stroke-width="3.2" />
      
      <!-- Wire 7 & 8: Black Ground (GND) -->
      <path d="M 38,90 C 62,90 82,92 100,94" stroke="#090d16" stroke-width="3.8" />
      <path d="M 38,90 C 62,90 82,92 100,94" stroke="#475569" stroke-width="1.2" />
      <path d="M 38,102 C 62,102 82,105 100,108" stroke="#090d16" stroke-width="3.8" />
      <path d="M 38,102 C 62,102 82,105 100,108" stroke="#475569" stroke-width="1.2" />
      
      <!-- Wire 9: Green Power-On (PS_ON) -->
      <path d="M 38,114 C 60,114 80,118 100,122" stroke="#10b981" stroke-width="3.2" />
      
      <!-- Wire 10: Purple +5VSB Standby -->
      <path d="M 38,126 C 58,126 78,132 100,136" stroke="#a855f7" stroke-width="3.2" />
      
      <!-- Wire 11: Blue -12V -->
      <path d="M 38,138 C 58,138 78,146 100,150" stroke="#3b82f6" stroke-width="3.2" />
      
      <!-- Wire 12: Gray Power Good (PW_OK) -->
      <path d="M 38,150 C 58,150 78,160 100,164" stroke="#94a3b8" stroke-width="3.2" />
    </g>

    <!-- Acrylic Cable Combs holding braided lines neat -->
    <rect x="62" y="10" width="3.5" height="152" rx="1.5" fill="#00D4FF" opacity="0.45" stroke="#ffffff" stroke-width="0.5" />
    <rect x="84" y="8" width="3.5" height="158" rx="1.5" fill="#00D4FF" opacity="0.35" stroke="#ffffff" stroke-width="0.5" />

    <!-- Main 24-Pin ATX Molded Plug Housing (Caps over socket completely: x=4 to 40) -->
    <rect x="4" y="6" width="36" height="158" rx="3.5" fill="url(#psu-plug-mat)" stroke="#00D4FF" stroke-width="1.2" />

    <!-- Motherboard Socket Locking Latch Arm on Left Edge (x=0 to 5) -->
    <path d="M 4,60 L 0,65 L 0,105 L 4,110 Z" fill="#1e293b" stroke="#00D4FF" stroke-width="0.8" />
    <!-- Retention Snap Tab -->
    <polygon points="0,80 -2,85 0,90" fill="#ef4444" />
    <circle cx="1.5" cy="85" r="1.5" fill="#10b981" />

    <!-- 2x12 Pin Terminal Ports (Gold Contacts inside Square Wells) -->
    <!-- Column 1 (Left: x=8) -->
    <g fill="url(#psu-pin-gold)" stroke="#78350f" stroke-width="0.3">
      <rect x="8" y="12" width="10" height="8" rx="1" /><rect x="8" y="24" width="10" height="8" rx="1" />
      <rect x="8" y="36" width="10" height="8" rx="1" /><rect x="8" y="48" width="10" height="8" rx="1" />
      <rect x="8" y="60" width="10" height="8" rx="1" /><rect x="8" y="72" width="10" height="8" rx="1" />
      <rect x="8" y="84" width="10" height="8" rx="1" /><rect x="8" y="96" width="10" height="8" rx="1" />
      <rect x="8" y="108" width="10" height="8" rx="1" /><rect x="8" y="120" width="10" height="8" rx="1" />
      <rect x="8" y="132" width="10" height="8" rx="1" /><rect x="8" y="144" width="10" height="8" rx="1" />
    </g>

    <!-- Column 2 (Right: x=24) -->
    <g fill="url(#psu-pin-gold)" stroke="#78350f" stroke-width="0.3">
      <rect x="24" y="12" width="10" height="8" rx="1" /><rect x="24" y="24" width="10" height="8" rx="1" />
      <rect x="24" y="36" width="10" height="8" rx="1" /><rect x="24" y="48" width="10" height="8" rx="1" />
      <rect x="24" y="60" width="10" height="8" rx="1" /><rect x="24" y="72" width="10" height="8" rx="1" />
      <rect x="24" y="84" width="10" height="8" rx="1" /><rect x="24" y="96" width="10" height="8" rx="1" />
      <rect x="24" y="108" width="10" height="8" rx="1" /><rect x="24" y="120" width="10" height="8" rx="1" />
      <rect x="24" y="132" width="10" height="8" rx="1" /><rect x="24" y="144" width="10" height="8" rx="1" />
    </g>

    <!-- Glowing Power Active Status Line -->
    <line x1="21" y1="12" x2="21" y2="152" stroke="#10b981" stroke-width="1.2" stroke-linecap="round" opacity="0.9" />

    <!-- Silkscreen Label along the plug body -->
    <g transform="translate(21, 85) rotate(90)" font-family="'Inter', system-ui, sans-serif" text-anchor="middle" font-weight="900">
      <text x="0" y="2" font-size="5" fill="#38bdf8" letter-spacing="1">ATX 24-PIN POWER</text>
    </g>
  </g>
</svg>
