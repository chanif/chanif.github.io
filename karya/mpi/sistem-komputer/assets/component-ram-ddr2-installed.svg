<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 200" width="100%" height="100%">
  <defs>
    <!-- Classic Retro Green PCB Gradient -->
    <linearGradient id="ddr2-r-pcb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="50%" stop-color="#166534" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>

    <!-- Retro DRAM IC Chip Body Gradient -->
    <linearGradient id="ddr2-r-chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Gold Pin Gradient -->
    <linearGradient id="ddr2-r-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <filter id="ddr2-r-shadow" x="-20%" y="-10%" width="140%" height="120%">
      <feDropShadow dx="3" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <g filter="url(#ddr2-r-shadow)">
    <!-- Socket Latch Clips on Left Edge (Top & Bottom) -->
    <rect x="0" y="4" width="10" height="12" rx="2" fill="#94a3b8" stroke="#475569" stroke-width="0.8" />
    <polygon points="2,10 8,6 8,14" fill="#334155" />
    <rect x="0" y="184" width="10" height="12" rx="2" fill="#94a3b8" stroke="#475569" stroke-width="0.8" />
    <polygon points="2,190 8,186 8,194" fill="#334155" />

    <!-- Gold Contact Edge Pins with MISALIGNED DDR2 Notch at y=110 -->
    <!-- Bank 1 (Top) y=16 to 108 -->
    <rect x="5" y="16" width="7" height="92" fill="url(#ddr2-r-gold)" />
    <!-- DDR2 Notch gap at y=108 to 118 (MISMATCHED position vs DDR4!) -->
    <!-- Bank 2 (Bottom) y=118 to 184 -->
    <rect x="5" y="118" width="7" height="66" fill="url(#ddr2-r-gold)" />

    <!-- Red Warning Indicator at the Notch Mismatch -->
    <polygon points="12,113 2,108 2,118" fill="#ef4444" stroke="#7f1d1d" stroke-width="0.5" />

    <!-- Pin dividers -->
    <g stroke="#78350f" stroke-width="0.6" opacity="0.8">
      <line x1="5" y1="24" x2="12" y2="24" /><line x1="5" y1="34" x2="12" y2="34" />
      <line x1="5" y1="44" x2="12" y2="44" /><line x1="5" y1="54" x2="12" y2="54" />
      <line x1="5" y1="64" x2="12" y2="64" /><line x1="5" y1="74" x2="12" y2="74" />
      <line x1="5" y1="84" x2="12" y2="84" /><line x1="5" y1="94" x2="12" y2="94" />
      <line x1="5" y1="104" x2="12" y2="104" />
      <line x1="5" y1="126" x2="12" y2="126" /><line x1="5" y1="136" x2="12" y2="136" />
      <line x1="5" y1="146" x2="12" y2="146" /><line x1="5" y1="156" x2="12" y2="156" />
      <line x1="5" y1="166" x2="12" y2="166" /><line x1="5" y1="176" x2="12" y2="176" />
    </g>

    <!-- Main Green PCB Body (Roboh ke kanan: extends from x=10 to x=98) -->
    <path d="M 10,12 
             L 96,12 Q 100,12 100,16 
             L 100,184 Q 100,188 96,188 
             L 10,188 Z" 
          fill="url(#ddr2-r-pcb)" stroke="#22c55e" stroke-width="1.2" />

    <!-- Exposed Copper Traces on Green PCB -->
    <g stroke="#86efac" stroke-width="0.5" fill="none" opacity="0.4">
      <path d="M 16,30 L 30,30 L 36,40" /><path d="M 16,50 L 26,50 L 34,60" />
      <path d="M 16,80 L 30,80 L 38,90" /><path d="M 16,140 L 28,140 L 36,150" />
      <path d="M 16,160 L 30,160 L 38,170" />
    </g>

    <!-- 6 Visible DRAM Chip Packages (Black Rectangles) -->
    <g fill="url(#ddr2-r-chip)" stroke="#0f172a" stroke-width="0.8">
      <rect x="18" y="20" width="36" height="22" rx="1.5" />
      <rect x="18" y="48" width="36" height="22" rx="1.5" />
      <rect x="18" y="76" width="36" height="22" rx="1.5" />
      <rect x="18" y="104" width="36" height="22" rx="1.5" />
      <rect x="18" y="132" width="36" height="22" rx="1.5" />
      <rect x="18" y="160" width="36" height="22" rx="1.5" />
    </g>
    <!-- IC Notch Dots -->
    <circle cx="22" cy="24" r="1.2" fill="#64748b" />
    <circle cx="22" cy="52" r="1.2" fill="#64748b" />
    <circle cx="22" cy="80" r="1.2" fill="#64748b" />
    <circle cx="22" cy="108" r="1.2" fill="#64748b" />
    <circle cx="22" cy="136" r="1.2" fill="#64748b" />
    <circle cx="22" cy="164" r="1.2" fill="#64748b" />

    <!-- Retro Spec White Paper Label on the Right (x=58 to 96) -->
    <rect x="58" y="24" width="38" height="96" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8" />
    <g font-family="sans-serif" text-anchor="middle">
      <text x="77" y="38" font-size="5" font-weight="900" fill="#dc2626">LEGACY</text>
      <text x="77" y="47" font-size="6.5" font-weight="900" fill="#0f172a">DDR2 1GB</text>
      <line x1="62" y1="52" x2="92" y2="52" stroke="#cbd5e1" stroke-width="0.5" />
      <text x="77" y="62" font-size="4.5" font-family="monospace" fill="#475569">800MHz</text>
      <text x="77" y="71" font-size="4.5" font-family="monospace" fill="#475569">CL5 · 1.8V</text>
      <text x="77" y="80" font-size="4" font-family="monospace" fill="#64748b">NOTCH-175</text>
      <rect x="62" y="88" width="30" height="14" rx="1.5" fill="#ef4444" />
      <text x="77" y="98" font-size="4" font-weight="900" fill="#ffffff">TAK COCOK</text>
      <text x="77" y="113" font-size="3.5" font-weight="700" fill="#ef4444">SLOT DDR4</text>
    </g>

    <!-- Retro Barcode Stamp -->
    <g stroke="#0f172a" stroke-width="0.8">
      <line x1="62" y1="126" x2="62" y2="136" /><line x1="65" y1="126" x2="65" y2="136" />
      <line x1="67" y1="126" x2="67" y2="136" /><line x1="71" y1="126" x2="71" y2="136" />
      <line x1="74" y1="126" x2="74" y2="136" /><line x1="78" y1="126" x2="78" y2="136" />
      <line x1="82" y1="126" x2="82" y2="136" /><line x1="87" y1="126" x2="87" y2="136" />
      <line x1="91" y1="126" x2="91" y2="136" />
    </g>

    <!-- Solder Points along the right spine (x=98) -->
    <g fill="#94a3b8" stroke="#475569" stroke-width="0.3">
      <circle cx="97" cy="20" r="1.2" /><circle cx="97" cy="40" r="1.2" />
      <circle cx="97" cy="60" r="1.2" /><circle cx="97" cy="80" r="1.2" />
      <circle cx="97" cy="100" r="1.2" /><circle cx="97" cy="120" r="1.2" />
      <circle cx="97" cy="140" r="1.2" /><circle cx="97" cy="160" r="1.2" />
      <circle cx="97" cy="180" r="1.2" />
    </g>
  </g>
</svg>
