<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%">
  <defs>
    <linearGradient id="psu-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="gold-badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>

    <linearGradient id="switch-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <pattern id="honeycomb" width="12" height="10.392" patternUnits="userSpaceOnUse">
      <path d="M 6,0 L 12,3.464 L 12,10.392 L 6,6.928 Z M 0,3.464 L 6,0 L 6,6.928 L 0,10.392 Z" 
            fill="none" stroke="#334155" stroke-width="0.8" />
    </pattern>

    <filter id="psu-shadow" x="-5%" y="-10%" width="115%" height="125%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <g filter="url(#psu-shadow)">
    <!-- Main Steel Enclosure Box -->
    <rect x="15" y="15" width="200" height="150" rx="8" fill="url(#psu-body)" stroke="#475569" stroke-width="1.5" />

    <!-- Top Inset Bevel Line -->
    <rect x="20" y="20" width="190" height="140" rx="6" fill="none" stroke="#00D4FF" stroke-width="0.75" opacity="0.3" />

    <!-- Honeycomb Exhaust Grille Area (Left 2/3) -->
    <rect x="25" y="25" width="115" height="130" rx="4" fill="#020617" stroke="#1e293b" stroke-width="1" />
    <rect x="25" y="25" width="115" height="130" rx="4" fill="url(#honeycomb)" />

    <!-- Cooling Fan Circle Silhouette inside Grille -->
    <circle cx="82" cy="90" r="50" fill="none" stroke="#1e293b" stroke-width="3" opacity="0.8" />
    <circle cx="82" cy="90" r="16" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <circle cx="82" cy="90" r="4" fill="#00D4FF" />

    <!-- AC Input & Rocker Switch Panel (Right 1/3) -->
    <rect x="148" y="25" width="60" height="130" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />

    <!-- 3-Prong AC Power Socket -->
    <rect x="155" y="35" width="46" height="32" rx="3" fill="#020617" stroke="#475569" stroke-width="1" />
    <!-- Prongs -->
    <rect x="162" y="44" width="5" height="14" rx="1" fill="#cbd5e1" />
    <rect x="187" y="44" width="5" height="14" rx="1" fill="#cbd5e1" />
    <rect x="175" y="38" width="6" height="5" rx="1" fill="#cbd5e1" />

    <!-- Rocker Power Switch (I/O) -->
    <rect x="160" y="80" width="36" height="24" rx="3" fill="#020617" stroke="#334155" stroke-width="1.2" />
    <!-- Rocker Button (Active red illuminated) -->
    <rect x="163" y="83" width="30" height="18" rx="2" fill="url(#switch-red)" />
    <!-- I / O markings -->
    <text x="172" y="95" font-family="monospace" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle">|</text>
    <circle cx="184" cy="92" r="3" fill="none" stroke="#ffffff" stroke-width="1.2" />

    <!-- 80 PLUS GOLD Rating Badge -->
    <g transform="translate(152, 118)">
      <polygon points="26,0 52,7 52,24 26,31 0,24 0,7" fill="url(#gold-badge)" stroke="#fef08a" stroke-width="0.8" />
      <text x="26" y="14" font-family="'Inter', sans-serif" font-size="6.5" font-weight="900" fill="#451a03" text-anchor="middle">80 PLUS</text>
      <text x="26" y="22" font-family="'Inter', sans-serif" font-size="6" font-weight="900" fill="#78350f" text-anchor="middle">GOLD</text>
    </g>

    <!-- Modular Cable Sleeve bundle emerging on Left edge -->
    <g stroke="#0f172a" stroke-width="3" fill="none">
      <!-- Braided main ATX 24-pin cable -->
      <path d="M 15,45 Q 0,45 -10,60" stroke="#00D4FF" stroke-width="3" />
      <path d="M 15,55 Q 0,55 -10,75" stroke="#f59e0b" stroke-width="3" />
      <path d="M 15,65 Q 0,65 -10,90" stroke="#ef4444" stroke-width="3" />
      <path d="M 15,75 Q 0,75 -10,105" stroke="#10b981" stroke-width="3" />
      <path d="M 15,85 Q 0,85 -10,120" stroke="#8b5cf6" stroke-width="3" />
    </g>

    <!-- Model Spec Label on top rim -->
    <text x="82" y="170" font-family="'Inter', sans-serif" font-size="7" font-weight="800" fill="#94a3b8" text-anchor="middle" letter-spacing="1">
      ATX POWER MASTER 650W · FULL MODULAR
    </text>
  </g>
</svg>
