<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 200" width="100%" height="100%">
  <defs>
    <!-- Heatsink Brushed Metal Gradient -->
    <linearGradient id="ram-r-heatsink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="80%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Metal Armor Facet Gradient -->
    <linearGradient id="ram-r-metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- RGB Diffuser Lightbar Gradient (Vertical Spine on Right) -->
    <linearGradient id="ram-r-rgb" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="25%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="75%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#00D4FF" />
    </linearGradient>

    <!-- Gold Pin Gradient -->
    <linearGradient id="ram-r-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <filter id="ram-r-shadow" x="-20%" y="-10%" width="140%" height="120%">
      <feDropShadow dx="3" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <g filter="url(#ram-r-shadow)">
    <!-- Socket Latch Clips on Left Edge (Top & Bottom) -->
    <rect x="0" y="4" width="10" height="12" rx="2" fill="#cbd5e1" stroke="#475569" stroke-width="0.8" />
    <polygon points="2,10 8,6 8,14" fill="#334155" />
    <rect x="0" y="184" width="10" height="12" rx="2" fill="#cbd5e1" stroke="#475569" stroke-width="0.8" />
    <polygon points="2,190 8,186 8,194" fill="#334155" />

    <!-- Gold Edge Connector Pins plugged into slot (x=4 to 12) -->
    <!-- Bank 1 (Top) y=16 to 82 -->
    <rect x="5" y="16" width="7" height="66" fill="url(#ram-r-gold)" />
    <!-- DDR4 Notch Gap at y=82 to 92 (Asymmetric key notch) -->
    <!-- Bank 2 (Bottom) y=92 to 184 -->
    <rect x="5" y="92" width="7" height="92" fill="url(#ram-r-gold)" />

    <!-- Gold Pin Dividers -->
    <g stroke="#78350f" stroke-width="0.6" opacity="0.8">
      <line x1="5" y1="24" x2="12" y2="24" /><line x1="5" y1="32" x2="12" y2="32" />
      <line x1="5" y1="40" x2="12" y2="40" /><line x1="5" y1="48" x2="12" y2="48" />
      <line x1="5" y1="56" x2="12" y2="56" /><line x1="5" y1="64" x2="12" y2="64" />
      <line x1="5" y1="72" x2="12" y2="72" /><line x1="5" y1="80" x2="12" y2="80" />
      <line x1="5" y1="100" x2="12" y2="100" /><line x1="5" y1="108" x2="12" y2="108" />
      <line x1="5" y1="116" x2="12" y2="116" /><line x1="5" y1="124" x2="12" y2="124" />
      <line x1="5" y1="132" x2="12" y2="132" /><line x1="5" y1="140" x2="12" y2="140" />
      <line x1="5" y1="148" x2="12" y2="148" /><line x1="5" y1="156" x2="12" y2="156" />
      <line x1="5" y1="164" x2="12" y2="164" /><line x1="5" y1="172" x2="12" y2="172" />
      <line x1="5" y1="180" x2="12" y2="180" />
    </g>

    <!-- Main RAM Module Body (Roboh ke kanan: extends from x=12 to x=98) -->
    <!-- Dark PCB Base Board -->
    <path d="M 10,12 
             L 96,12 Q 100,12 100,16 
             L 100,184 Q 100,188 96,188 
             L 10,188 Z" 
          fill="#0a0f1d" stroke="#00D4FF" stroke-width="1.2" />

    <!-- Brushed Aluminum Armor Faceplate (Heatsink) -->
    <rect x="15" y="16" width="78" height="168" rx="4" fill="url(#ram-r-heatsink)" stroke="#334155" stroke-width="0.8" />

    <!-- Angular Facets (Cooling Fins Style) -->
    <polygon points="18,22 88,22 76,45 18,45" fill="url(#ram-r-metal)" opacity="0.75" />
    <polygon points="18,52 88,52 76,75 18,75" fill="url(#ram-r-metal)" opacity="0.75" />
    <polygon points="18,125 76,125 88,148 18,148" fill="url(#ram-r-metal)" opacity="0.75" />
    <polygon points="18,155 76,155 88,178 18,178" fill="url(#ram-r-metal)" opacity="0.75" />

    <!-- V-Groove Ventilation Slits -->
    <g fill="#020617" stroke="#00D4FF" stroke-width="0.5">
      <polygon points="25,30 35,30 30,38" />
      <polygon points="45,30 55,30 50,38" />
      <polygon points="65,30 75,30 70,38" />
      <polygon points="25,162 35,162 30,170" />
      <polygon points="45,162 55,162 50,170" />
      <polygon points="65,162 75,162 70,170" />
    </g>

    <!-- Center Model Emblem Badge -->
    <rect x="20" y="80" width="70" height="40" rx="3" fill="#020617" stroke="#00D4FF" stroke-width="1" />
    
    <!-- Silkscreen Typography (Centered on Emblem) -->
    <g font-family="'Inter', system-ui, sans-serif" text-anchor="middle">
      <text x="55" y="93" font-size="8.5" font-weight="900" fill="#00D4FF" letter-spacing="1">DDR4 8GB</text>
      <text x="55" y="103" font-size="5.5" font-weight="700" fill="#ffffff" letter-spacing="0.5">3200 MHz · CL16</text>
      <text x="55" y="112" font-size="4.2" font-weight="600" fill="#94a3b8" letter-spacing="0.8">HIGH-SPEED GAMING</text>
    </g>

    <!-- Glowing RGB Diffuser Lightbar along the RIGHT Edge -->
    <rect x="94" y="14" width="8" height="172" rx="3" fill="url(#ram-r-rgb)" opacity="0.95" />
    <!-- Frost Specular Reflection Line -->
    <rect x="96" y="18" width="2.5" height="164" rx="1.2" fill="#ffffff" opacity="0.65" />

    <!-- Active RGB Light Beads -->
    <circle cx="98" cy="30" r="1.5" fill="#ffffff" />
    <circle cx="98" cy="65" r="1.5" fill="#ffffff" />
    <circle cx="98" cy="100" r="1.5" fill="#ffffff" />
    <circle cx="98" cy="135" r="1.5" fill="#ffffff" />
    <circle cx="98" cy="170" r="1.5" fill="#ffffff" />
  </g>
</svg>
