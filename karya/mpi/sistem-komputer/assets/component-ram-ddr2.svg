<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 90" width="100%" height="100%">
  <defs>
    <linearGradient id="ddr2-pcb" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="50%" stop-color="#166534" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <linearGradient id="ddr2-chip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="ddr2-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="ddr2-shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <g filter="url(#ddr2-shadow)">
    <!-- Base Green Retro PCB -->
    <!-- Notice key notch at x=175 (different from DDR4 at x=135) -->
    <path d="M 10,25 
             L 10,38 L 7,40 L 7,56 L 10,58 L 10,75 
             L 170,75 L 173,69 L 182,69 L 185,75 
             L 330,75 L 330,58 L 333,56 L 333,40 L 330,38 L 330,25 Z" 
          fill="url(#ddr2-pcb)" stroke="#22c55e" stroke-width="1" />

    <!-- Gold Contact Edge Pins -->
    <path d="M 12,71 L 169,71 L 169,75 L 12,75 Z" fill="url(#ddr2-gold)" />
    <path d="M 186,71 L 328,71 L 328,75 L 186,75 Z" fill="url(#ddr2-gold)" />

    <!-- 8 Individual DRAM Chip Packages -->
    <g fill="url(#ddr2-chip)" stroke="#1e293b" stroke-width="0.75">
      <rect x="22" y="32" width="28" height="32" rx="2" />
      <rect x="58" y="32" width="28" height="32" rx="2" />
      <rect x="94" y="32" width="28" height="32" rx="2" />
      <rect x="130" y="32" width="28" height="32" rx="2" />
      <rect x="192" y="32" width="28" height="32" rx="2" />
      <rect x="228" y="32" width="28" height="32" rx="2" />
      <rect x="264" y="32" width="28" height="32" rx="2" />
      <rect x="300" y="28" width="24" height="36" rx="2" />
    </g>

    <!-- Retro Label Sticker -->
    <rect x="70" y="36" width="130" height="24" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.75" />
    <text x="76" y="47" font-family="sans-serif" font-size="7.5" font-weight="bold" fill="#dc2626">LEGACY DDR2 1GB</text>
    <text x="76" y="55" font-family="monospace" font-size="6" fill="#475569">800MHz · CL5 · 1.8V NOTCH-175</text>

    <!-- Warning Stamped Label -->
    <rect x="212" y="40" width="76" height="16" rx="2" fill="#ef4444" opacity="0.9" />
    <text x="250" y="51" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="900" fill="#ffffff">TAK COCOK DDR4</text>
  </g>
</svg>
