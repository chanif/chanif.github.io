<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini LMS | Belajar Coding & AI</title>
    
    <!-- Tailwind CSS & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        h1, h2, h3, h4, .font-heading { font-family: 'Quicksand', sans-serif; }
        body { font-family: 'Inter', sans-serif; }
        html { scroll-behavior: smooth; }
        
        .fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .lms-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .lms-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(99, 102, 241, 0.15);
        }

        .step-transition {
            animation: slideIn 0.3s ease-out forwards;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* High contrast overrides for dynamic lesson contents */
        .prose, .prose * {
            color: #334155 !important; /* Force slate-700 for readability */
        }
        .prose h1, .prose h2, .prose h3, .prose h4, .prose strong {
            color: #4f46e5 !important; /* Force indigo-600 */
        }
        .prose .bg-slate-900\/50, .prose .bg-slate-900 {
            background-color: #f1f5f9 !important; /* Force light slate background */
            border-color: #cbd5e1 !important; /* Force slate border */
        }
        .prose .bg-indigo-900\/40, .prose .bg-indigo-900 {
            background-color: #e0e7ff !important;
            border-color: #c7d2fe !important;
        }
        .prose code, .prose .font-mono {
            background-color: #e2e8f0 !important;
            color: #0f172a !important;
            padding: 2px 4px;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-[#F8FAFC] text-slate-800 antialiased overflow-x-hidden relative min-h-screen selection:bg-indigo-100 selection:text-indigo-900">

    <!-- Decorative blur blobs -->
    <div class="fixed top-[-10%] left-[-10%] w-96 h-96 bg-indigo-200 opacity-20 blur-[120px] rounded-full pointer-events-none z-0"></div>
    <div class="fixed bottom-[10%] right-[-5%] w-80 h-80 bg-amber-200 opacity-15 blur-[100px] rounded-full pointer-events-none z-0"></div>
    <div class="fixed top-[40%] left-[45%] w-72 h-72 bg-cyan-200 opacity-15 blur-[100px] rounded-full pointer-events-none z-0"></div>

    <!-- Main Navigation Bar -->
    <nav class="border-b border-slate-200/60 bg-white/80 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="/learn/" class="font-heading font-extrabold text-xl text-slate-900 tracking-tight flex items-center gap-2">
                fanani<span class="text-indigo-600">.</span>lms
            </a>
            <div class="flex items-center gap-3">
                <button id="resetProgressBtn" class="text-xs font-bold text-rose-600 hover:text-rose-700 bg-rose-50 hover:bg-rose-100 px-3.5 py-2 rounded-xl border border-rose-100 transition shadow-sm">
                    🔄 Reset Progres
                </button>
            </div>
        </div>
    </nav>

    <!-- Dashboard Screen Container -->
    <div id="dashboardSection" class="relative z-10 flex flex-col transition-all duration-300">
        <main class="max-w-5xl mx-auto px-6 py-8 flex-1 w-full space-y-8 animate-fade-in">
            <!-- Progress Card -->
            <section class="bg-white rounded-[2rem] border border-slate-100 shadow-sm p-8">
                <div class="space-y-3 w-full">
                    <div class="flex justify-between items-end">
                        <div>
                            <h2 class="font-heading font-extrabold text-2xl text-slate-800">Kemajuan Belajar Anda</h2>
                            <p class="text-slate-400 text-xs mt-0.5" id="progressDetails">Memuat data kemajuan...</p>
                        </div>
                        <span class="text-2xl font-black text-indigo-600 font-heading" id="progressPctVal">0%</span>
                    </div>
                    <div class="w-full bg-slate-100 h-3.5 rounded-full overflow-hidden border border-slate-200/50">
                        <div id="progressBar" class="bg-gradient-to-r from-indigo-500 to-cyan-400 h-full rounded-full transition-all duration-700" style="width: 0%"></div>
                    </div>
                </div>
            </section>

            <!-- Level Grid Section -->
            <section class="space-y-4">
                <div class="flex items-center gap-2.5">
                    <span class="text-2xl">🚀</span>
                    <h2 class="font-heading font-extrabold text-xl text-slate-800">Pilih Jenjang Pembelajaran</h2>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="levelGrid">
                    <!-- Levels will be dynamically rendered here -->
                </div>
            </section>

            <!-- Lesson Panel Section -->
            <section id="lessonSection" class="bg-white rounded-[2rem] border border-slate-100 shadow-sm p-8 space-y-6 hidden scroll-mt-24">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-slate-100 pb-4 gap-2">
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="text-2xl" id="selectedLevelIcon">👶</span>
                            <h3 class="font-heading font-extrabold text-xl text-slate-800" id="selectedLevelTitle">Level 1: PAUD</h3>
                        </div>
                        <p class="text-slate-500 text-xs mt-1" id="selectedLevelDesc">Materi belajar dasar sekuensial.</p>

                    <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-3 py-1.5 rounded-xl border border-indigo-100" id="selectedLevelProgress">0 / 0 Selesai</span>
                </div>

                <div class="divide-y divide-slate-100 space-y-3" id="lessonList">
                    <!-- Lessons will be dynamically rendered here -->
                </div>
            </section>
        </main>
    </div>

    <!-- Lesson Viewer Screen Container -->
    <div id="viewerSection" class="relative z-10 max-w-3xl mx-auto px-6 py-8 flex flex-col min-h-screen hidden transition-all duration-300">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8 pb-4 border-b border-slate-200/60">
            <button id="exitViewerBtn" class="font-heading font-extrabold text-sm text-slate-900 tracking-tight flex items-center gap-1.5 hover:text-indigo-600 transition bg-slate-100 px-3 py-1.5 rounded-xl border border-slate-200">
                <span>←</span> Dashboard
            </button>
            <span id="lessonNavMeta" class="text-xs font-bold text-slate-400">Materi ...</span>
        </header>

        <!-- Progress/Step Indicator -->
        <section id="stepIndicator" class="grid gap-2 mb-8 text-center text-[10px] sm:text-xs font-bold text-slate-400">
            <!-- Dynamic step indicator -->
        </section>

        <!-- Reader Wrapper Card -->
        <main class="bg-white rounded-[2rem] border border-slate-100 shadow-xl p-8 flex-1 flex flex-col justify-between">
            <div id="stepContent" class="step-transition space-y-6">
                <!-- Dynamic step contents rendered here -->
            </div>
            
            <!-- Navigation Footer -->
            <div id="stepFooter" class="mt-8 pt-6 border-t border-slate-100 flex justify-between items-center gap-4">
                <button id="cancelViewerBtn" class="px-5 py-3 rounded-xl border border-slate-200 text-xs font-bold text-slate-500 hover:bg-slate-50 transition">
                    Batal & Keluar
                </button>
                <button id="nextStepBtn" class="bg-slate-900 hover:bg-slate-800 text-white font-bold px-6 py-3 rounded-xl text-xs transition shadow-md transform hover:-translate-y-0.5 active:translate-y-0">
                    Lanjut
                </button>
            </div>
        </main>
    </div>

    <!-- Footer -->
    <footer class="border-t border-slate-200 bg-white mt-12 py-8 relative z-10">

            <span>&copy; 2026 Ach. Chanifuddin Fanani.</span>
            <a href="/learn/" class="hover:text-indigo-600 font-bold transition">Kembali ke Portal Belajar</a>
        </div>
    </footer>

    <!-- App Script -->
    <script>
        // ==========================================
        // 1. SYLLABUS DATA (embedded from data.js)
        // ==========================================

        function generateMockQuestions(levelId, lessonTitle, lessonIndex) {
            const levelKeywords = {
                paud: ["arah", "pola", "langkah", "urutan", "logika", "gambar"],
                sd: ["blok", "gerakan", "perulangan", "scratch jr", "blockly", "sprite"],
                smp: ["variabel", "kondisi", "cloning", "flowchart", "sintaks", "algoritma"],
                sma: ["python", "tipe data", "perulangan", "fungsi", "list", "chatbot"],
                expert: ["html", "css", "dom", "async", "api", "database", "sql", "git", "firebase"]
            };

            const kw = levelKeywords[levelId] || ["coding"];
            const topic1 = kw[(lessonIndex) % kw.length];
            const topic2 = kw[(lessonIndex + 1) % kw.length];

            return Array.from({ length: 10 }, (_, i) => {
                const questionNum = i + 1;
                let questionText = "";
                let options = [];
                let correctIndex = 0;

                switch (levelId) {
                    case "paud": {
                        const paudTemplates = [
                            { q: `🧩 Bantu karakter kita! Jika ia melihat panah ⬆️, apa yang harus ia lakukan?`, o: [`🚶 Maju satu langkah`, `🛑 Berhenti menangis`, `🔄 Berputar`] },
                            { q: `🎨 Lihat pola ini: 🔴 🔵 🔴 🔵 ... Apa warna selanjutnya?`, o: [`🔴 Merah`, `🟢 Hijau`, `🟡 Kuning`] },
                            { q: `📅 Apa yang harus dilakukan setelah 🛏️ bangun tidur?`, o: [`🪥 Mandi & Sikat Gigi`, `🎮 Main game`, `🌙 Tidur lagi`] },
                            { q: `💡 Jika tombol 🟢 ditekan, mesin menyala. Jika 🔴 ditekan?`, o: [`🛑 Mesin mati`, `🚀 Mesin terbang`, `🎈 Keluar balon`] },
                            { q: `🐾 Urutkan: 1️⃣ Pakai Sepatu, 2️⃣ Keluar Rumah. Boleh dibalik?`, o: [`❌ Tidak, nanti kotor!`, `✅ Boleh saja`, `🤷 Terserah`] },
                            { q: `🍎 Berapa jumlah apel jika kita punya 🍏🍏 dan ditambah 🍏?`, o: [`3️⃣ Tiga`, `5️⃣ Lima`, `1️⃣ Satu`] },
                            { q: `🐱 Hewan apa yang bersuara "Meong" dan suka ikan?`, o: [`🐈 Kucing`, `🐶 Anjing`, `🐰 Kelinci`] },
                            { q: `🌧️ Jika di luar hujan deras, kita harus memakai apa?`, o: [`☔ Payung`, `🕶️ Kacamata hitam`, `🩳 Celana pendek`] },
                            { q: `🚦 Saat lampu lalu lintas berwarna 🔴 Merah, kendaraan harus?`, o: [`🛑 Berhenti`, `🏎️ Ngebut`, `🔄 Putar balik`] },
                            { q: `⭐ Bentuk apakah yang memiliki lima sudut bercahaya di langit malam?`, o: [`🌟 Bintang`, `🔵 Lingkaran`, `⬛ Persegi`] }
                        ];
                        const pTmpl = paudTemplates[i % paudTemplates.length];
                        questionText = `<div class="bg-indigo-100 p-4 rounded-xl border-2 border-indigo-200 shadow-sm text-indigo-900 font-extrabold text-lg flex gap-3 items-center"><span>${pTmpl.q}</span></div>`;
                        options = pTmpl.o.map((opt, idx) => `<div class="bg-white p-3 rounded-lg border-2 border-slate-200 hover:border-indigo-400 hover:bg-indigo-50 transition-all flex items-center gap-3 text-slate-800 font-bold shadow-sm"><span class="text-3xl font-black text-indigo-300">${['A', 'B', 'C'][idx]}</span> <span class="text-base">${opt}</span></div>`);
                        correctIndex = 0;
                        break;
                    }
                    case "sd": {
                        const sdTemplates = [
                            { q: `🤖 Saat kita menggunakan blok 🔁 (Repeat), apa yang terjadi?`, o: [`Berjalan berulang-ulang tanpa ditulis ulang`, `Kode akan dihapus otomatis`, `Sprite berubah warna merah`, `Komputer mati`] },
                            { q: `🏃‍♂️ Jika Sprite ingin berjalan 10 langkah, blok apa yang digunakan?`, o: [`Blok [Maju 10 Langkah] ➡️`, `Blok [Sembunyi] 👻`, `Blok [Putar Balik] 🔄`, `Blok [Suara] 🔊`] },
                            { q: `🤔 Apa yang dimaksud dengan 'Bug' 🐛 dalam kode?`, o: [`Kesalahan yang membuat kode tidak berjalan semestinya`, `Fitur rahasia yang seru`, `Serangga di dalam komputer`, `Hadiah menyelesaikan level`] },
                            { q: `🚦 Blok 'Kondisi' (If/Else) berguna untuk...`, o: [`Membuat keputusan: Jika nabrak, maka belok!`, `Mewarnai layar menjadi biru`, `Membuat komputer melambat`, `Menghapus Sprite`] },
                            { q: `🎭 Bagaimana cara mengganti kostum Sprite di Scratch?`, o: [`Pakai blok [Ganti Kostum] 👕`, `Matikan komputer`, `Panggil dengan suara keras`, `Goyangkan layar`] },
                            { q: `🔊 Jika ingin menambahkan lagu, blok mana yang dipilih?`, o: [`Blok kategori Suara 🎵`, `Blok kategori Gerakan 🏃`, `Blok kategori Kejadian 🏁`, `Blok kategori Variabel 📦`] },
                            { q: `🏁 Kapan biasanya program Scratch mulai berjalan?`, o: [`Saat bendera hijau 🟩 diklik`, `Saat komputer dinyalakan`, `Saat menangis`, `Saat warna merah 🟥 diklik`] },
                            { q: `📦 Apa itu 'Variabel' dalam pemrograman?`, o: [`Kotak untuk menyimpan data/skor 🔢`, `Nama virus komputer`, `Karakter musuh`, `Tombol keluar`] },
                            { q: `💬 Blok [Katakan "Halo!"] akan membuat Sprite...`, o: [`Menampilkan balon kata "Halo!" 🗨️`, `Berteriak sangat keras`, `Menghilang seketika`, `Berubah menjadi kata Halo`] },
                            { q: `🔄 Blok [Putar 15 derajat] membuat Sprite melakukan apa?`, o: [`Miring/berputar sedikit 🌀`, `Berjalan ke depan`, `Melompat tinggi`, `Memutar lagu`] }
                        ];
                        const sTmpl = sdTemplates[i % sdTemplates.length];
                        questionText = `<div class="bg-emerald-100 p-4 rounded-xl border-2 border-emerald-200 shadow-sm text-emerald-900 font-extrabold text-base flex gap-3 items-center"><span>${sTmpl.q}</span></div>`;
                        options = sTmpl.o.map((opt, idx) => `<div class="bg-white p-3 rounded-lg border-2 border-slate-200 hover:border-emerald-400 hover:bg-emerald-50 transition-all flex items-center gap-3 text-slate-800 font-bold shadow-sm"><span class="text-2xl font-black text-emerald-300">${['A', 'B', 'C', 'D'][idx]}</span> <span>${opt}</span></div>`);
                        correctIndex = 0;
                        break;
                    }
                    case "smp":
                        questionText = `Mengapa penggunaan ${topic1} dan ${topic2} sangat penting dalam menyusun alur program pada materi "${lessonTitle}"? (Pertanyaan Varian ${i + 1})`;
                        options = [
                            `Untuk mempermudah pemetaan keputusan dan alur eksekusi logika`,
                            `Hanya agar tampilan diagram alur terlihat lebih menarik`,
                            `Untuk mempercepat proses eksekusi kode komputer secara langsung`,
                            `Agar program tidak perlu ditulis dalam bentuk baris kode`
                        ];
                        correctIndex = 0;
                        break;
                    case "sma":
                        questionText = `Dalam materi "${lessonTitle}", manakah pernyataan berikut yang paling tepat menggambarkan cara kerja dari konsep ${topic1}? (Varian ${i + 1})`;
                        options = [
                            `Digunakan untuk mendefinisikan struktur kontrol dan pemrosesan data`,
                            `Hanya digunakan untuk menampilkan hasil keluaran ke terminal console`,
                            `Menyimpan file konfigurasi eksternal secara otomatis`,
                            `Menghubungkan program langsung ke server database global`
                        ];
                        correctIndex = 0;
                        break;
                    case "expert":
                    default:
                        questionText = `Bagaimana integrasi teknologi ${topic1} dan ${topic2} (Bagian ${i + 1}) membantu dalam optimalisasi pada materi "${lessonTitle}"?`;
                        options = [
                            `Meningkatkan efisiensi pengelolaan data, manipulasi UI, dan transfer data client-server`,
                            `Hanya mengubah tampilan desain visual tanpa mempengaruhi performa sistem`,
                            `Menjamin program terbebas dari kesalahan sintaksis secara permanen`,
                            `Menghapus seluruh file konfigurasi local storage secara otomatis`
                        ];
                        correctIndex = 0;
                        break;
                }

                return {
                    id: `q_${levelId}_l${lessonIndex}_${questionNum}`,
                    question: questionText,
                    options: options,
                    correctIndex: correctIndex
                };
            });
        }

        const paudL1Questions = [
            {
                id: "q_paud_l1_1",
                question: "Jika ingin melangkah maju 1 kotak, arah panah manakah yang harus kita pilih?",
                options: ["👈 Panah ke Kiri", "👉 Panah ke Kanan", "⬆️ Panah ke Atas/Maju"],
                correctIndex: 2
            },
            {
                id: "q_paud_l1_2",
                question: "Arah manakah yang berlawanan dengan arah Kiri 👈?",
                options: ["⬆️ Maju", "👉 Kanan", "👇 Mundur"],
                correctIndex: 1
            },
            {
                id: "q_paud_l1_3",
                question: "Jika kita ingin berbelok ke arah tangan kanan, kartu mana yang kita ambil? 🖐️",
                options: ["➡️ Kartu Kanan", "⬅️ Kartu Kiri", "⬆️ Kartu Maju"],
                correctIndex: 0
            },
            {
                id: "q_paud_l1_4",
                question: "Simbol panah ⬆️ berarti...",
                options: ["⬅️ Belok Kiri", "⬆️ Maju", "➡️ Belok Kanan"],
                correctIndex: 1
            },
            {
                id: "q_paud_l1_5",
                question: "Simbol panah ➡️ berarti...",
                options: ["➡️ Belok Kanan", "⬅️ Belok Kiri", "⬆️ Maju"],
                correctIndex: 0
            },
            {
                id: "q_paud_l1_6",
                question: "Simbol panah ⬅️ berarti...",
                options: ["⬅️ Belok Kiri", "➡️ Belok Kanan", "⬆️ Maju"],
                correctIndex: 0
            },
            {
                id: "q_paud_l1_7",
                question: "Untuk menghindari lubang 🕳️ di depan kita, apa yang sebaiknya kita lakukan?",
                options: ["⬆️ Maju terus", "↩️ Berbelok baru maju", "🛑 Diam saja di tempat"],
                correctIndex: 1
            },
            {
                id: "q_paud_l1_8",
                question: "Jika kita ingin melangkah maju sebanyak 2 kali (robot 🤖 ➡️ 🟩 ➡️ 🟩 ➡️ 🚩), berapa banyak kartu panah 'Maju' ⬆️ yang harus disiapkan?",
                options: ["1️⃣ Satu kartu", "2️⃣ Dua kartu", "3️⃣ Tiga kartu"],
                correctIndex: 1
            },
            {
                id: "q_paud_l1_9",
                question: "Fungsi utama kartu arah (panah ⬆️ ➡️ ⬅️) dalam permainan koding fisik adalah untuk...",
                options: ["🎨 Menggambar pemandangan", "🤖 Menentukan jalan robot", "📖 Mewarnai buku"],
                correctIndex: 1
            },
            {
                id: "q_paud_l1_10",
                question: "Di depan ada pohon 🌳. Kita ingin berjalan mengelilinginya dari sisi kiri. Kartu pertama yang kita taruh adalah...",
                options: ["⬅️ Belok Kiri", "➡️ Belok Kanan", "⬆️ Maju"],
                correctIndex: 0
            }
        ];

        const sdL1Questions = [
            {
                id: "q_sd_l1_1",
                question: "Apakah yang dimaksud dengan Blockly Games? 🧩",
                options: [
                    "🧩 Platform belajar koding visual dengan menyusun blok-blok puzzle",
                    "🎮 Game petualangan 3D berbayar",
                    "📝 Aplikasi untuk menulis kode teks bahasa C++",
                    "🤖 Software untuk mendesain robot mekanis"
                ],
                correctIndex: 0
            },
            {
                id: "q_sd_l1_2",
                question: "Blok manakah yang digunakan untuk menggerakkan karakter maju ke depan? 🏃‍♂️",
                options: [
                    "🔵 Blok 'move forward' (bergerak maju ➡️)",
                    "🟡 Blok 'turn left' (belok kiri ↩️)",
                    "🟢 Blok 'repeat' (ulangi 🔁)",
                    "🟣 Blok 'if' (jika ❓)"
                ],
                correctIndex: 0
            },
            {
                id: "q_sd_l1_3",
                question: "Jika karakter menabrak dinding pada maze Blockly 🧱, tindakan apa yang sebaiknya dilakukan?",
                options: [
                    "🔄 Mengubah arah gerak sebelum menabrak (belok kiri/kanan)",
                    "⬆️ Menambah lebih banyak blok maju terus",
                    "💻 Menekan tombol restart komputer",
                    "🎨 Mengganti sprite karakter"
                ],
                correctIndex: 0
            },
            {
                id: "q_sd_l1_4",
                question: "Fungsi dari blok 'repeat until' 🔁 pada maze Blockly Games adalah...",
                options: [
                    "🏁 Mengulangi perintah terus-menerus sampai karakter mencapai tujuan",
                    "🛑 Menghentikan program secara mendadak",
                    "🎨 Mengubah warna latar belakang labirin",
                    "🚶 Membuat karakter berjalan mundur"
                ],
                correctIndex: 0
            },
            {
                id: "q_sd_l1_5",
                question: "Kelebihan utama belajar koding menggunakan blok 🧩 dibandingkan menulis teks 💻 adalah...",
                options: [
                    "✅ Menghindari kesalahan pengetikan sintaks (typo)",
                    "⚡ Program otomatis langsung selesai sendiri",
                    "📱 Bisa langsung diunggah ke Play Store",
                    "❌ Tidak memerlukan logika berpikir sama sekali"
                ],
                correctIndex: 0
            },
            {
                id: "q_sd_l1_6",
                question: "Dalam Blockly Games, blok berwarna kuning 🟡 biasanya melambangkan konsep...",
                options: [
                    "🔁 Kontrol alur logika (Loops/Perulangan atau Logic)",
                    "🔵 Tindakan gerak fisik (Move)",
                    "🔢 Variabel angka",
                    "📝 Komentar penjelasan"
                ],
                correctIndex: 0
            },

        function generateRichLessonContent(levelId, lessonId, title) {
            const context = lessonContexts[lessonId];
            if (!context) return null;

            if (levelId === "paud" || levelId === "sd") {
                const bgColor = levelId === "paud" ? "bg-indigo-50 border-indigo-200 text-indigo-900" : "bg-emerald-50 border-emerald-200 text-emerald-900";
                const headerColor = levelId === "paud" ? "text-indigo-600" : "text-emerald-600";
                
                return `
                    <div class="space-y-4 font-sans animate-fade-in">
                        <h3 class="text-xl font-extrabold ${headerColor} mb-2 flex items-center gap-2">
                            <span>${context.emoji}</span> Materi: ${title}
                        </h3>
                        
                        <div class="bg-white p-5 rounded-2xl shadow-sm border-2 ${bgColor}">
                            <h4 class="font-bold text-sm mb-3 uppercase tracking-wider opacity-70">📖 Penjelasan</h4>
                            <p class="text-base leading-relaxed font-semibold">${context.desc}</p>
                        </div>

                        <div class="${bgColor} p-5 rounded-2xl shadow-sm border-2">
                            <h4 class="font-bold text-sm mb-3 uppercase tracking-wider opacity-70 flex items-center gap-2">
                                💡 Contoh Seru!
                            </h4>
                            <p class="text-base leading-relaxed font-bold">${context.example}</p>
                        </div>
                    </div>
                `;
            } else {
                let headerColor = "text-blue-600";
                let gradColor = "blue";
                if(levelId === "sma") { headerColor = "text-purple-600"; gradColor = "purple"; }
                if(levelId === "expert") { headerColor = "text-rose-600"; gradColor = "rose"; }

                return `
                    <div class="space-y-5 font-sans animate-fade-in">
                        <h3 class="text-xl font-bold ${headerColor} mb-1 flex items-center gap-2 border-b border-slate-100 pb-3">
                            <span class="p-2 bg-slate-50 rounded-lg border border-slate-200">${context.emoji}</span> ${title}
                        </h3>
                        
                        <div class="prose max-w-none">
                            <p class="text-slate-700 leading-relaxed text-[15px] font-medium">${context.desc}</p>
                        </div>

                        <div class="bg-slate-900 p-5 rounded-xl border border-slate-700 shadow-md relative overflow-hidden">
                            <div class="absolute top-0 left-0 w-1 h-full bg-gradient-to-b from-${gradColor}-500 to-transparent"></div>
                            <h4 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-2">
                                <span>🔬</span> Contextual Example
                            </h4>
                            <p class="text-slate-200 leading-relaxed text-sm font-mono">${context.example}</p>
                        </div>
                    </div>
                `;
            }
        }

        // Initialize Syllabus questions and dynamic content
        lmsSyllabus.forEach(level => {
            level.lessons.forEach((lesson, index) => {
                if (!lesson.questions) {
                    lesson.questions = generateMockQuestions(level.id, lesson.title, index);
                }
                const richContent = generateRichLessonContent(level.id, lesson.id, lesson.title);
                if (richContent) {
                    lesson.content = richContent;
                }
            });
        });


        // ==========================================
        // 2. DATABASE / STORAGE LOGIC (No Firebase)
        // ==========================================
        const STORAGE_KEY = "lms_progress";

        function getUserProgress() {
            return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
        }

        function saveUserProgress(levelId, lessonId, data) {
            const progress = getUserProgress();
            progress[`${levelId}_${lessonId}`] = data;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
        }

        function clearAllProgress() {
            localStorage.removeItem(STORAGE_KEY);
        }


        // ==========================================
        // 3. UI STATE & INTERACTION LOGIC
        // ==========================================
        let selectedLevelId = null;
        let activeLevelData = null;
        let activeLessonData = null;

        // Lesson Viewer Flow variables
        let steps = [];
        let currentStepIndex = 0;
        let pretestQuestions = [];
        let posttestQuestions = [];
        let userPretestAnswers = {};
        let userPosttestAnswers = {};
        let pretestScore = 0;
        let posttestScore = 0;

        document.addEventListener("DOMContentLoaded", () => {
            initApp();
            setupEventListeners();
        });

        function initApp() {
            // Load and update dashboard metrics
            calculateOverallProgress();
            renderLevels();
            
            if (selectedLevelId) {
                showLevelLessons(selectedLevelId);
            }
        }

        function calculateOverallProgress() {
            const userProgress = getUserProgress();
            let totalLessons = 0;
            let completedLessons = 0;

            lmsSyllabus.forEach(level => {
                level.lessons.forEach(lesson => {
                    totalLessons++;
                    const record = userProgress[`${level.id}_${lesson.id}`];
                    if (record && record.completed) {
                        completedLessons++;
                    }
                });
            });

            const pct = totalLessons > 0 ? Math.round((completedLessons / totalLessons) * 100) : 0;
            document.getElementById("progressDetails").textContent = `${completedLessons} dari ${totalLessons} materi telah diselesaikan`;
            document.getElementById("progressPctVal").textContent = `${pct}%`;
            document.getElementById("progressBar").style.width = `${pct}%`;
        }

        function renderLevels() {
            const userProgress = getUserProgress();
            const grid = document.getElementById("levelGrid");
            grid.innerHTML = "";

            lmsSyllabus.forEach(level => {
                let completed = 0;
                level.lessons.forEach(lesson => {
                    const record = userProgress[`${level.id}_${lesson.id}`];
                    if (record && record.completed) {
                        completed++;
                    }
                });

                const card = document.createElement("div");
                card.className = `bg-white border rounded-3xl p-5 shadow-sm lms-card cursor-pointer flex flex-col justify-between ${selectedLevelId === level.id ? 'border-indigo-500 ring-2 ring-indigo-100' : 'border-slate-100'}`;
                card.onclick = () => selectLevel(level.id);

                card.innerHTML = `
                    <div class="space-y-3">
                        <div class="flex justify-between items-start">
                            <span class="text-3xl">${level.icon}</span>
                            <span class="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded-md bg-indigo-50 text-indigo-600 border border-indigo-100">${level.badge}</span>
                        </div>
                        <div>
                            <h3 class="font-heading font-extrabold text-sm text-slate-800">${level.title}</h3>
                            <p class="text-[11px] text-slate-400 mt-1 leading-normal line-clamp-2">${level.description}</p>
                        </div>
                    </div>
                    <div class="mt-4 pt-3 border-t border-slate-50 flex items-center justify-between text-xs font-bold">
                        <span class="text-slate-400">Progres:</span>
                        <span class="text-indigo-600 bg-indigo-50/50 px-2 py-1 rounded-lg">${completed} / ${level.lessons.length}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function selectLevel(levelId) {
            selectedLevelId = levelId;
            renderLevels();
            showLevelLessons(levelId);
            
            // Smooth scroll to lessons section
            setTimeout(() => {
                document.getElementById("lessonSection").scrollIntoView({ behavior: 'smooth' });
            }, 50);
        }

        function showLevelLessons(levelId) {
            const userProgress = getUserProgress();
            const level = lmsSyllabus.find(l => l.id === levelId);
            if (!level) return;

            document.getElementById("selectedLevelIcon").textContent = level.icon;
            document.getElementById("selectedLevelTitle").textContent = level.title;
            document.getElementById("selectedLevelDesc").textContent = level.description;
            
            let completed = 0;
            const list = document.getElementById("lessonList");
            list.innerHTML = "";

            level.lessons.forEach((lesson, index) => {
                const record = userProgress[`${level.id}_${lesson.id}`];
                const isCompleted = record && record.completed;
                if (isCompleted) completed++;

                let scoreLabel = "";
                if (isCompleted) {
                    const preVal = record.pretestScore !== undefined && record.pretestScore !== null ? `${record.pretestScore}%` : "-";
                    const postVal = record.posttestScore !== undefined && record.posttestScore !== null ? `${record.posttestScore}%` : "-";
                    scoreLabel = `<span class="text-[10px] font-bold text-slate-500 bg-slate-100 px-2 py-1 rounded-md border border-slate-200">Skor - Pre: ${preVal} | Post: ${postVal}</span>`;
                }

                const diffColor = lesson.difficulty === "Mudah" ? "bg-emerald-50 text-emerald-600 border border-emerald-100" :
                                  lesson.difficulty === "Sedang" ? "bg-amber-50 text-amber-600 border border-amber-100" :
                                  "bg-rose-50 text-rose-600 border border-rose-100";

                const item = document.createElement("div");
                item.className = "flex flex-col sm:flex-row items-start sm:items-center justify-between py-4 gap-4";

                item.innerHTML = `
                    <div class="flex items-start gap-4">
                        <div class="w-7 h-7 rounded-full flex items-center justify-center flex-shrink-0 border mt-0.5 ${isCompleted ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 text-transparent'}">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
                        </div>
                        <div>
                            <div class="flex flex-wrap items-center gap-2">
                                <span class="text-xs text-slate-400 font-bold">Materi ${index + 1}</span>
                                <span class="text-xs font-bold uppercase tracking-wider text-slate-800 font-heading">${lesson.title}</span>
                                <span class="text-[9px] font-extrabold px-1.5 py-0.5 rounded-md ${diffColor}">${lesson.difficulty}</span>
                            </div>
                            <div class="flex items-center gap-3 mt-1 text-[11px] text-slate-400">
                                <span>⏱️ ${lesson.duration}</span>
                                ${scoreLabel}
                            </div>
                        </div>
                    </div>
                    <div class="flex-shrink-0 self-end sm:self-center">
                        <button onclick="startLesson('${levelId}', '${lesson.id}')" 
                            class="inline-block text-xs font-bold text-white bg-slate-900 hover:bg-slate-800 px-4 py-2 rounded-xl transition hover:shadow-sm">
                            ${isCompleted ? 'Ulangi Belajar' : 'Mulai Belajar'}
                        </button>
                    </div>
                `;
                list.appendChild(item);
            });

            document.getElementById("selectedLevelProgress").textContent = `${completed} / ${level.lessons.length} Selesai`;
            document.getElementById("lessonSection").classList.remove("hidden");
        }


        // ==========================================
        // 4. LESSON VIEWER CORE LOGIC (SPA style)
        // ==========================================

        function startLesson(levelId, lessonId) {
            activeLevelData = lmsSyllabus.find(l => l.id === levelId);
            if (activeLevelData) {
                activeLessonData = activeLevelData.lessons.find(l => l.id === lessonId);
            }

            if (!activeLevelData || !activeLessonData) {
                alert("Materi tidak ditemukan!");
                return;
            }

            // Hide Dashboard, Show Viewer
            document.getElementById("dashboardSection").classList.add("hidden");
            document.getElementById("viewerSection").classList.remove("hidden");
            window.scrollTo({ top: 0, behavior: 'smooth' });

            // Initialize flow
            const hasPretest = levelId !== "paud";
            if (hasPretest) {
                steps = ["pretest", "material", "posttest", "summary"];
            } else {
                steps = ["material", "posttest", "summary"];
            }
            currentStepIndex = 0;

            // Reset scores & selections
            pretestScore = 0;
            posttestScore = 0;
            userPretestAnswers = {};
            userPosttestAnswers = {};

            document.getElementById("lessonNavMeta").textContent = `${activeLevelData.title} | ${activeLessonData.title}`;

            // Initialize Randomized Questions from data pool (10 items)
            initializeQuizzes(hasPretest, levelId);
            
            renderStepIndicator(hasPretest);
            renderStep();
        }

        function initializeQuizzes(hasPretest, levelId) {
            const pool = activeLessonData.questions || [];
            
            // pretest: 3 items
            if (hasPretest && pool.length >= 3) {
                pretestQuestions = getRandomSubset(pool, 3);
            } else {
                pretestQuestions = getRandomSubset(pool, Math.min(pool.length, 3));
            }

            // posttest: 3 for PAUD, 5 for others
            const postTestSize = levelId === "paud" ? 3 : 5;
            if (pool.length >= postTestSize) {
                posttestQuestions = getRandomSubset(pool, postTestSize);
            } else {
                posttestQuestions = getRandomSubset(pool, Math.min(pool.length, postTestSize));
            }
        }

        function getRandomSubset(array, size) {
            const shuffled = [...array].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, size);
        }

        function renderStepIndicator(hasPretest) {
            const container = document.getElementById("stepIndicator");
            container.innerHTML = "";
            container.className = `grid gap-2 mb-8 text-center text-[10px] sm:text-xs font-bold text-slate-400 ${hasPretest ? 'grid-cols-4' : 'grid-cols-3'}`;

            steps.forEach((step, i) => {
                const stepName = step === "pretest" ? "1. PRE-TEST" :
                                 step === "material" ? (hasPretest ? "2. MATERI" : "1. MATERI") :
                                 step === "posttest" ? (hasPretest ? "3. POST-TEST" : "2. POST-TEST") :
                                 (hasPretest ? "4. SELESAI" : "3. SELESAI");

                const indicator = document.createElement("div");
                indicator.className = `pb-2 border-b-2 transition ${i === currentStepIndex ? 'border-indigo-500 text-indigo-600 font-extrabold' : 'border-slate-200'}`;
                indicator.textContent = stepName;
                container.appendChild(indicator);
            });
        }

        function renderStep() {
            const step = steps[currentStepIndex];
            const contentDiv = document.getElementById("stepContent");
            contentDiv.innerHTML = "";
            contentDiv.className = "step-transition space-y-6";

            if (step === "pretest") {
                renderPretest(contentDiv);
            } else if (step === "material") {
                renderMaterial(contentDiv);
            } else if (step === "posttest") {
                renderPosttest(contentDiv);
            } else if (step === "summary") {
                renderSummary(contentDiv);
            }

            // Adjust navigation buttons
            const nextBtn = document.getElementById("nextStepBtn");
            if (step === "summary") {
                nextBtn.textContent = "Selesai & Keluar";
            } else if (step === "pretest" || step === "posttest") {
                nextBtn.textContent = "Kirim Jawaban";
            } else {
                nextBtn.textContent = "Lanjut";
            }
        }

        function renderPretest(container) {
            container.innerHTML = `
                <div class="space-y-2">
                    <span class="text-xs font-bold text-indigo-500 bg-indigo-50 px-2.5 py-1 rounded-md border border-indigo-100 uppercase tracking-wider">Tahap 1: Evaluasi Awal</span>
                    <h2 class="font-heading font-extrabold text-2xl text-slate-800">Pre-test</h2>
                    <p class="text-slate-500 text-sm leading-relaxed">Jawablah ${pretestQuestions.length} pertanyaan acak berikut untuk menguji pemahaman awal Anda sebelum mempelajari materi.</p>
                </div>
                <div class="space-y-6 pt-4" id="pretestQuizContainer"></div>
            `;

            const quizContainer = document.getElementById("pretestQuizContainer");
            pretestQuestions.forEach((q, qIdx) => {
                const qBlock = document.createElement("div");
                qBlock.className = "space-y-3";
                qBlock.innerHTML = `
                    <div class="text-sm font-bold text-slate-700 leading-relaxed">${qIdx + 1}. ${q.question}</div>
                    <div class="grid gap-2">
                        ${q.options.map((opt, optIdx) => `
                            <label class="flex items-center gap-3 p-3 rounded-xl border border-slate-100 bg-slate-50/50 hover:bg-slate-50 cursor-pointer transition text-xs font-semibold text-slate-600">
                                <input type="radio" name="pre_q_${qIdx}" value="${optIdx}" ${userPretestAnswers[qIdx] === String(optIdx) ? 'checked' : ''} class="w-4 h-4 text-indigo-600 border-slate-300 focus:ring-indigo-100">
                                <span>${opt}</span>
                            </label>
                        `).join('')}
                    </div>
                `;
                qBlock.querySelectorAll('input[type="radio"]').forEach(input => {
                    input.addEventListener("change", (e) => {
                        userPretestAnswers[qIdx] = e.target.value;
                    });
                });
                quizContainer.appendChild(qBlock);
            });
        }

        function renderMaterial(container) {
            const diffColor = activeLessonData.difficulty === "Mudah" ? "bg-emerald-50 text-emerald-600 border border-emerald-100" :
                              activeLessonData.difficulty === "Sedang" ? "bg-amber-50 text-amber-600 border border-amber-100" :
                              "bg-rose-50 text-rose-600 border border-rose-100";

            container.innerHTML = `
                <div class="space-y-3 pb-4 border-b border-slate-100">
                    <div class="flex items-center gap-2">
                        <span class="text-3xl">${activeLessonData.icon || '📖'}</span>
                        <h2 class="font-heading font-extrabold text-2xl text-slate-800">${activeLessonData.title}</h2>
                    </div>
                    <div class="flex items-center gap-3 text-xs text-slate-400">
                        <span class="font-extrabold uppercase px-2 py-0.5 rounded-md ${diffColor}">${activeLessonData.difficulty}</span>
                        <span>⏱️ Waktu Baca: ${activeLessonData.duration}</span>
                    </div>
                </div>
                <div class="prose max-w-none text-slate-600 text-sm leading-relaxed space-y-4 pt-2">
                    ${activeLessonData.content}
                </div>
            `;
        }

        function renderPosttest(container) {
            container.innerHTML = `
                <div class="space-y-2">
                    <span class="text-xs font-bold text-indigo-500 bg-indigo-50 px-2.5 py-1 rounded-md border border-indigo-100 uppercase tracking-wider">Tahap Evaluasi Akhir</span>
                    <h2 class="font-heading font-extrabold text-2xl text-slate-800">Post-test</h2>
                    <p class="text-slate-500 text-sm leading-relaxed">Jawablah ${posttestQuestions.length} pertanyaan acak berikut untuk mengevaluasi pemahaman Anda setelah membaca materi.</p>
                </div>
                <div class="space-y-6 pt-4" id="posttestQuizContainer"></div>
            `;

            const quizContainer = document.getElementById("posttestQuizContainer");
            posttestQuestions.forEach((q, qIdx) => {
                const qBlock = document.createElement("div");
                qBlock.className = "space-y-3";
                qBlock.innerHTML = `
                    <div class="text-sm font-bold text-slate-700 leading-relaxed">${qIdx + 1}. ${q.question}</div>
                    <div class="grid gap-2">
                        ${q.options.map((opt, optIdx) => `
                            <label class="flex items-center gap-3 p-3 rounded-xl border border-slate-100 bg-slate-50/50 hover:bg-slate-50 cursor-pointer transition text-xs font-semibold text-slate-600">
                                <input type="radio" name="post_q_${qIdx}" value="${optIdx}" ${userPosttestAnswers[qIdx] === String(optIdx) ? 'checked' : ''} class="w-4 h-4 text-indigo-600 border-slate-300 focus:ring-indigo-100">
                                <span>${opt}</span>
                            </label>
                        `).join('')}
                    </div>
                `;
                qBlock.querySelectorAll('input[type="radio"]').forEach(input => {
                    input.addEventListener("change", (e) => {
                        userPosttestAnswers[qIdx] = e.target.value;
                    });
                });
                quizContainer.appendChild(qBlock);
            });
        }

        const MIN_PASSING_SCORE = 70;

        function renderSummary(container) {
            const hasPretest = activeLevelData.id !== "paud";
            const isPassed = posttestScore >= MIN_PASSING_SCORE;

            let iconHtml = "";
            let titleText = "";
            let descText = "";
            let scoreColor = "";

            if (isPassed) {
                iconHtml = `<div class="w-20 h-20 bg-emerald-50 border border-emerald-100 rounded-full flex items-center justify-center text-4xl mx-auto shadow-sm animate-bounce">🏆</div>`;
                titleText = "Selamat! Anda Menyelesaikan Materi";
                descText = `Materi "${activeLessonData.title}" telah diselesaikan dengan tuntas.`;
                scoreColor = "text-emerald-600";
            } else {
                iconHtml = `<div class="w-20 h-20 bg-rose-50 border border-rose-100 rounded-full flex items-center justify-center text-4xl mx-auto shadow-sm animate-pulse">📚</div>`;
                titleText = "Materi Belum Tuntas";
                descText = `Anda membutuhkan skor minimal ${MIN_PASSING_SCORE}% pada Post-test untuk menyelesaikan materi ini.`;
                scoreColor = "text-rose-600";
            }

            container.innerHTML = `
                <div class="text-center space-y-4 py-6">
                    ${iconHtml}
                    <div class="space-y-1.5">
                        <h2 class="font-heading font-extrabold text-2xl text-slate-800">${titleText}</h2>
                        <p class="text-slate-400 text-xs">${descText}</p>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 bg-slate-50 p-6 rounded-2xl border border-slate-100 text-center">
                    <div>
                        <span class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Skor Pre-test</span>
                        <span class="block text-2xl font-black font-heading text-slate-700">${hasPretest ? `${pretestScore}%` : '-'}</span>
                    </div>
                    <div class="border-l border-slate-200">
                        <span class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Skor Post-test</span>
                        <span class="block text-2xl font-black font-heading ${scoreColor}">${posttestScore}%</span>
                    </div>
                </div>

                ${isPassed ? `
                <div class="bg-indigo-50/50 p-6 rounded-2xl border border-indigo-100 space-y-3">
                    <h4 class="text-xs font-bold uppercase tracking-wider text-indigo-500">Materi Pengayaan (Enrichment)</h4>
                    <p class="text-xs text-slate-500 leading-relaxed">Untuk memperluas pemahaman Anda mengenai topik ini, silakan kunjungi sumber belajar eksternal berikut:</p>
                    <a href="${activeLessonData.enrichment?.url || '#'}" target="_blank" rel="noopener noreferrer" 
                        class="inline-flex items-center gap-1.5 text-xs font-bold text-indigo-600 hover:text-indigo-700 transition">
                        🔗 ${activeLessonData.enrichment?.title || 'Sumber Belajar Pengayaan'} →
                    </a>
                </div>
                ` : `
                <div class="bg-rose-50/50 p-6 rounded-2xl border border-rose-100 space-y-3 text-left">
                    <h4 class="text-xs font-bold uppercase tracking-wider text-rose-500">Butuh Belajar Lagi?</h4>
                    <p class="text-xs text-slate-500 leading-relaxed">Jangan khawatir! Anda dapat mengulangi membaca materi atau langsung mencoba kembali Post-test untuk memperbaiki nilai Anda.</p>
                    <div class="flex gap-2 pt-1">
                        <button id="retryPosttestBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-4 py-2 rounded-xl transition shadow-sm">
                            🔄 Ulangi Post-test
                        </button>
                        <button id="rereadMaterialBtn" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-bold px-4 py-2 rounded-xl transition">
                            📖 Baca Ulang Materi
                        </button>
                    </div>
                </div>
                `}
            `;

            // If user previously completed the lesson, do not downgrade their status on retry failure.
            const userProgress = getUserProgress();
            const record = userProgress[`${activeLevelData.id}_${activeLessonData.id}`];
            const wasCompleted = record && record.completed;

            // Save completed progress
            const progressData = {
                completed: wasCompleted || isPassed,
                pretestScore: hasPretest ? pretestScore : (record ? record.pretestScore : null),
                posttestScore: Math.max(posttestScore, (record && record.posttestScore) ? record.posttestScore : 0),
                timestamp: new Date().toISOString()
            };
            saveUserProgress(activeLevelData.id, activeLessonData.id, progressData);

            // Hook up event listeners inside the summary if failed
            if (!isPassed) {
                document.getElementById("retryPosttestBtn").addEventListener("click", () => {
                    userPosttestAnswers = {};
                    posttestScore = 0;
                    const posttestStepIdx = steps.indexOf("posttest");
                    if (posttestStepIdx !== -1) {
                        currentStepIndex = posttestStepIdx;
                        renderStepIndicator(hasPretest);
                        renderStep();
                    }
                });

                document.getElementById("rereadMaterialBtn").addEventListener("click", () => {
                    const materialStepIdx = steps.indexOf("material");
                    if (materialStepIdx !== -1) {
                        currentStepIndex = materialStepIdx;
                        renderStepIndicator(hasPretest);
                        renderStep();
                    }
                });
            }
        }

        function handleNextStep() {
            const step = steps[currentStepIndex];

            if (step === "pretest") {
                // Validate answers
                if (Object.keys(userPretestAnswers).length < pretestQuestions.length) {
                    alert("Silakan jawab seluruh pertanyaan sebelum melanjutkan.");
                    return;
                }
                
                // Calculate pretest score
                let correctCount = 0;
                pretestQuestions.forEach((q, idx) => {
                    if (Number(userPretestAnswers[idx]) === q.correctIndex) {
                        correctCount++;
                    }
                });
                pretestScore = Math.round((correctCount / pretestQuestions.length) * 100);
            } 
            
            else if (step === "posttest") {
                // Validate answers
                if (Object.keys(userPosttestAnswers).length < posttestQuestions.length) {
                    alert("Silakan jawab seluruh pertanyaan sebelum menyelesaikan materi.");
                    return;
                }

                // Calculate posttest score
                let correctCount = 0;
                posttestQuestions.forEach((q, idx) => {
                    if (Number(userPosttestAnswers[idx]) === q.correctIndex) {
                        correctCount++;
                    }
                });
                posttestScore = Math.round((correctCount / posttestQuestions.length) * 100);
            } 
            
            else if (step === "summary") {
                // Return to dashboard and update UI
                closeViewer();
                return;
            }

            // Move to next step
            currentStepIndex++;
            renderStepIndicator(activeLevelData.id !== "paud");
            renderStep();
            
            // Scroll reader back to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function closeViewer() {
            document.getElementById("viewerSection").classList.add("hidden");
            document.getElementById("dashboardSection").classList.remove("hidden");
            initApp(); // reload dashboard metrics
        }


        // ==========================================
        // 5. EVENT LISTENERS
        // ==========================================
        function setupEventListeners() {
            // Reset Progress Button
            document.getElementById("resetProgressBtn").addEventListener("click", () => {
                if (confirm("Apakah Anda yakin ingin menghapus seluruh progres belajar Anda? Tindakan ini tidak dapat dibatalkan.")) {
                    clearAllProgress();
                    selectedLevelId = null;
                    document.getElementById("lessonSection").classList.add("hidden");
                    initApp();
                    alert("Progres belajar telah direset!");
                }
            });

            // Exit Viewer Button (top navbar)
            document.getElementById("exitViewerBtn").addEventListener("click", () => {
                if (confirm("Keluar dari materi sekarang? Progres membaca/skor tes pada sesi ini belum akan disimpan.")) {
                    closeViewer();
                }
            });

            // Cancel Viewer Button (footer)
            document.getElementById("cancelViewerBtn").addEventListener("click", () => {
                if (confirm("Keluar dari materi sekarang? Progres membaca/skor tes pada sesi ini belum akan disimpan.")) {
                    closeViewer();
                }
            });

            // Next Step Button
            document.getElementById("nextStepBtn").addEventListener("click", handleNextStep);
        }
    </script>
</body>
</html>
